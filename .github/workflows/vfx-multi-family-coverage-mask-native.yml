name: vfx-multi-family-coverage-mask-native

on:
  pull_request:
    paths:
      - 'src/vfx_multi_family_coverage_mask_native_bridge.mjs'
      - 'tests/vfx_multi_family_coverage_mask_native_bridge.test.mjs'
      - '.github/workflows/vfx-multi-family-coverage-mask-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_multi_family_coverage_mask_native_bridge.mjs'
      - 'tests/vfx_multi_family_coverage_mask_native_bridge.test.mjs'
      - '.github/workflows/vfx-multi-family-coverage-mask-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-multi-family-coverage-mask-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: fd2c6e27e6174b78f07e5ce9776724cec0c7e9b7
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained attempt evidence
        run: |
          base=creative-render/build/vfx-multi-family-coverage-mask-native
          mkdir -p "$base"
          cat > "$base/donor-revisions.json" <<'EOF'
          {
            "visual_effect_fabric": "fd2c6e27e6174b78f07e5ce9776724cec0c7e9b7",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          EOF
          cat > "$base/attempt-inputs.json" <<'EOF'
          {
            "source_families": ["fbm-value-noise-2d", "cellular-nearest-feature-2d"],
            "shared_transfer": {"threshold":0.52,"softness":0.11,"invert":false},
            "shared_derived_contract": "axm.coverage-mask-grid/v0.1",
            "grid": {"width":48,"height":32,"cells":1536},
            "observer": "one derived mask cell becomes one planar two-triangle square; coverage 0..1 maps linearly to neutral grayscale 24..240",
            "consumer_semantics_assigned": false
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build retained multi-family mask and native-scene evidence
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { observeVisualEffectCoverageMaskFamiliesNative } from './creative-render/src/vfx_multi_family_coverage_mask_native_bridge.mjs';
          const base='creative-render/build/vfx-multi-family-coverage-mask-native/';
          await mkdir(base,{recursive:true});
          const result=await observeVisualEffectCoverageMaskFamiliesNative('visual-effect-fabric',{vfxRevision:'fd2c6e27e6174b78f07e5ce9776724cec0c7e9b7'});
          for(const name of ['fbm','cellular']){
            const row=result.variants[name];
            await Promise.all([
              writeFile(base+name+'-request.json',row.requestBytes),
              writeFile(base+name+'-source.json',row.sourceBytes),
              writeFile(base+name+'-mask-source.json',row.maskSourceBytes),
              writeFile(base+name+'-mask-grid.json',row.gridBytes),
              writeFile(base+name+'.axmscene',row.adapted.bytes),
            ]);
          }
          await writeFile(base+'multi-family-coverage.receipt.json',JSON.stringify(result.receipt,null,2)+'\n');
          console.log('vfx_multi_family_coverage_mask_bridge=PASS');
          console.log(`fbm_mask_hash=${result.variants.fbm.grid.maskHash}`);
          console.log(`cellular_mask_hash=${result.variants.cellular.grid.maskHash}`);
          NODE

      - name: Independently assert authority, shared transfer, generic mask compatibility and budget honesty
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-multi-family-coverage-mask-native/';
          const [receiptBytes,donorBytes,attemptBytes]=await Promise.all([
            readFile(base+'multi-family-coverage.receipt.json'),
            readFile(base+'donor-revisions.json'),
            readFile(base+'attempt-inputs.json'),
          ]);
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const donors=JSON.parse(donorBytes.toString('utf8'));
          const attempt=JSON.parse(attemptBytes.toString('utf8'));
          if(donors.visual_effect_fabric!=='fd2c6e27e6174b78f07e5ce9776724cec0c7e9b7'||donors.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor revision evidence drifted');
          if(receipt.contract!=='AXM_CREATIVE_VFX_MULTI_FAMILY_COVERAGE_MASK_NATIVE_RECEIPT'||receipt.version!==1)throw new Error('coverage receipt contract drifted');
          if(receipt.donor.revision!==donors.visual_effect_fabric||receipt.donor.graphs.fbm.id!=='fx.field.coverage-mask2d'||receipt.donor.graphs.cellular.id!=='fx.field.coverage-mask2d-cellular')throw new Error('current VFX multi-family coverage graphs were not exercised');
          if(receipt.caller_authority.caller_requests_mutated!==false||receipt.caller_authority.human_machine_replay_identical_per_family!==true||receipt.caller_authority.canonical_scalar_sources_remain_authoritative!==true||receipt.caller_authority.coverage_transfer_sources_remain_authoritative!==true||receipt.caller_authority.coverage_grids_are_canonical!==false||receipt.caller_authority.native_scenes_are_canonical!==false||receipt.caller_authority.consumer_semantics_assigned!==false)throw new Error('authority boundary failed');
          if(JSON.stringify(receipt.shared_transfer)!==JSON.stringify({...attempt.shared_transfer,identical_across_source_families:true,source_lineage_remains_distinct:true}))throw new Error('shared transfer evidence drifted');
          if(receipt.shared_consumer_contract.schema!==attempt.shared_derived_contract||receipt.shared_consumer_contract.cells!==attempt.grid.cells||receipt.shared_consumer_contract.generic_sampler!=='sampleCoverageMask'||receipt.shared_consumer_contract.source_family_branching!==false||receipt.shared_consumer_contract.geometry_identical_across_families!==true)throw new Error('shared mask consumer contract drifted');

          const retained={};
          for(const name of ['fbm','cellular']){
            const [requestBytes,sourceBytes,maskSourceBytes,gridBytes,sceneBytes]=await Promise.all([
              readFile(base+name+'-request.json'),readFile(base+name+'-source.json'),readFile(base+name+'-mask-source.json'),readFile(base+name+'-mask-grid.json'),readFile(base+name+'.axmscene')
            ]);
            const source=JSON.parse(sourceBytes.toString('utf8'));
            const maskSource=JSON.parse(maskSourceBytes.toString('utf8'));
            const grid=JSON.parse(gridBytes.toString('utf8'));
            const row=receipt.variants[name];
            if(row.request_sha256!==sha(requestBytes)||row.source.bytes_sha256!==sha(sourceBytes)||row.mask_source.bytes_sha256!==sha(maskSourceBytes)||row.grid.bytes_sha256!==sha(gridBytes)||row.native_scene.bytes_sha256!==sha(sceneBytes))throw new Error(`retained byte binding drifted for ${name}`);
            if(grid.schema!=='axm.coverage-mask-grid/v0.1'||grid.fieldSourceHash!==row.source.hash||grid.maskSourceHash!==row.mask_source.hash||grid.maskHash!==row.grid.hash||grid.width!==48||grid.height!==32||grid.values.length!==1536||grid.derived!==true||grid.rebuildable!==true)throw new Error(`coverage-grid lineage drifted for ${name}`);
            if(maskSource.fieldSourceHash!==row.source.hash||maskSource.threshold!==attempt.shared_transfer.threshold||maskSource.softness!==attempt.shared_transfer.softness||maskSource.invert!==attempt.shared_transfer.invert)throw new Error(`coverage transfer/source binding drifted for ${name}`);
            if(row.working_set_budget.exact_1536_matches_roomy_16384!==true||row.working_set_budget.insufficient_1535_failed_loudly!==true||!row.working_set_budget.insufficient_error.includes('coverageMask cell budget exceeded'))throw new Error(`working-set budget gate failed for ${name}`);
            if(!Array.isArray(row.generic_samples)||row.generic_samples.length!==5||row.generic_samples.some(sample=>!Number.isFinite(sample.value)||sample.value<0||sample.value>1))throw new Error(`generic mask sampler evidence drifted for ${name}`);
            if(row.native_scene.adapter.input_schema!==grid.schema||row.native_scene.adapter.field_source_hash!==grid.fieldSourceHash||row.native_scene.adapter.mask_source_hash!==grid.maskSourceHash||row.native_scene.adapter.mask_hash!==grid.maskHash||row.native_scene.adapter.source_family_branching!==false||row.native_scene.adapter.consumer_semantics_assigned!==false||row.native_scene.adapter.canonical_source_rewritten!==false||row.native_scene.adapter.derived!==true||row.native_scene.adapter.replaceable!==true)throw new Error(`native observer boundary drifted for ${name}`);
            const scene=parseScene(sceneBytes.toString('utf8'));
            if(scene.triangles.length!==3072||row.native_scene.triangles!==3072)throw new Error(`native mask scene triangle count drifted for ${name}`);
            retained[name]={source,maskSource,grid,scene};
          }
          if(retained.fbm.source.schema===retained.cellular.source.schema)throw new Error('fixture no longer proves distinct retained source families');
          if(receipt.comparison.source_hashes_differ!==true||receipt.comparison.mask_source_hashes_differ!==true||receipt.comparison.mask_grid_hashes_differ!==true||receipt.comparison.native_scene_bytes_differ!==true||receipt.comparison.native_geometry_is_identical!==true||receipt.comparison.native_albedo_differs!==true)throw new Error('multi-family comparison evidence drifted');
          const geometry=scene=>scene.triangles.map(triangle=>triangle.vertices);
          const albedo=scene=>scene.triangles.map(triangle=>triangle.albedo);
          if(JSON.stringify(geometry(retained.fbm.scene))!==JSON.stringify(geometry(retained.cellular.scene)))throw new Error('source family leaked into native observation geometry');
          if(JSON.stringify(albedo(retained.fbm.scene))===JSON.stringify(albedo(retained.cellular.scene)))throw new Error('distinct masks collapsed to identical native albedo');
          if(receipt.replaceability.same_generic_derived_mask_contract_can_feed_one_native_observer_for_both_source_families!==true||receipt.replaceability.observer_does_not_rewrite_donor_source_transfer_or_grid_truth!==true||receipt.replaceability.native_scene_and_pixels_remain_replaceable_observation_bodies!==true)throw new Error('replaceability boundary drifted');
          const evidence={contract:'AXM_CREATIVE_VFX_MULTI_FAMILY_COVERAGE_MASK_INDEPENDENT_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:donors,source_schemas:{fbm:retained.fbm.source.schema,cellular:retained.cellular.source.schema},mask_grid_schema:'axm.coverage-mask-grid/v0.1',mask_hashes:{fbm:retained.fbm.grid.maskHash,cellular:retained.cellular.grid.maskHash},gates:{canonical_source_authority:'PASS',shared_transfer_retained:'PASS',caller_neutral_repeat:'PASS',generic_derived_mask_contract:'PASS',generic_sampler_accepts_both:'PASS',source_family_neutral_native_adapter:'PASS',sufficient_budgets_noncreative:'PASS',insufficient_budgets_fail_loudly:'PASS',native_geometry_constant:'PASS',consumer_semantics_not_assigned:'PASS'}};
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_multi_family_coverage_mask_independent_evidence=PASS');
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify both source-family mask observations
        run: |
          base=creative-render/build/vfx-multi-family-coverage-mask-native
          for name in fbm cellular; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind generic mask contract to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-multi-family-coverage-mask-native/';
          const receiptBytes=await readFile(base+'multi-family-coverage.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['fbm','cellular']){
            const [scene,request,renderReceipt,frame]=await Promise.all([
              readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')
            ]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
            if(receipt.variants[name].native_scene.bytes_sha256!==renders[name].scene_sha256)throw new Error(`scene identity changed before native rendering: ${name}`);
          }
          if(renders.fbm.frame_sha256===renders.cellular.frame_sha256)throw new Error('distinct multi-family coverage masks did not reach distinct native frame bytes');
          const evidence={contract:'AXM_CREATIVE_VFX_MULTI_FAMILY_COVERAGE_MASK_NATIVE_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:{visual_effect_fabric:'fd2c6e27e6174b78f07e5ce9776724cec0c7e9b7',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},shared_transfer:receipt.shared_transfer,shared_mask_contract:receipt.shared_consumer_contract,mask_hashes:{fbm:receipt.variants.fbm.grid.hash,cellular:receipt.variants.cellular.grid.hash},renders,render_receipt_replay:{fbm:'PASS',cellular:'PASS'},authority:receipt.caller_authority,truth_boundary:receipt.truth_boundary};
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_multi_family_coverage_mask_native_render=PASS');
          console.log(`fbm_frame_sha256=${renders.fbm.frame_sha256}`);
          console.log(`cellular_frame_sha256=${renders.cellular.frame_sha256}`);
          NODE

      - name: Upload retained multi-family coverage-mask proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-multi-family-coverage-mask-native-proof
          path: creative-render/build/vfx-multi-family-coverage-mask-native
          if-no-files-found: warn
