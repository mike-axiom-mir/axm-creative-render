name: vfx-path-sweep-indexed-strip-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vfx-path-sweep-indexed-strip-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-vfx-path-sweep-indexed-strip-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Creative Render candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: 2c0944e7625b274a7d88f1dfecfa92bc8cb3e1e0
          path: visual-effect-fabric

      - name: Checkout pinned current Render Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Retain and verify exact checkout identities before gates
        env:
          EXPECTED_CREATIVE_RENDER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          root=creative-render/build/vfx-path-sweep-indexed-strip
          mkdir -p "$root"
          creative_sha=$(git -C creative-render rev-parse HEAD)
          vfx_sha=$(git -C visual-effect-fabric rev-parse HEAD)
          render_sha=$(git -C render-fabric rev-parse HEAD)
          cat > "$root/attempt.json" <<EOF
          {
            "creative_render_head": "$creative_sha",
            "visual_effect_fabric_revision": "$vfx_sha",
            "render_fabric_revision": "$render_sha",
            "lane": "vfx-path-sweep-indexed-strip-native",
            "authority": "EVIDENCE_ONLY"
          }
          EOF
          test "$creative_sha" = "$EXPECTED_CREATIVE_RENDER_SHA"
          test "$vfx_sha" = "2c0944e7625b274a7d88f1dfecfa92bc8cb3e1e0"
          test "$render_sha" = "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run pinned current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Execute current VFX indexed-strip donor and build disposable native observation
        run: |
          root=creative-render/build/vfx-path-sweep-indexed-strip
          node creative-render/src/vfx_path_sweep_indexed_strip_native_cli.mjs build \
            --vfx-root visual-effect-fabric \
            --vfx-revision 2c0944e7625b274a7d88f1dfecfa92bc8cb3e1e0 \
            --scene "$root/scene.axmscene" \
            --donor-state "$root/donor-state.json" \
            --receipt "$root/indexed-strip.receipt.json"

      - name: Assert retained truth, donor connectivity reuse, structural bounds, and forgery rejection
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';

          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const root='creative-render/build/vfx-path-sweep-indexed-strip/';
          const [receiptBytes,stateBytes,sceneBytes]=await Promise.all([
            readFile(root+'indexed-strip.receipt.json'),
            readFile(root+'donor-state.json'),
            readFile(root+'scene.axmscene'),
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const state=JSON.parse(stateBytes.toString('utf8'));
          if(r.contract!=='AXM_CREATIVE_VFX_PATH_SWEEP_INDEXED_STRIP_NATIVE_RECEIPT'||r.version!==1)throw new Error('indexed-strip receipt drifted');

          const v=r.visual_effect_fabric;
          if(v.revision!=='2c0944e7625b274a7d88f1dfecfa92bc8cb3e1e0'||v.donor_graph_reused!==true)throw new Error('pinned current indexed-strip donor not exercised');
          if(v.graph_id!=='fx.geometry.path-sweep-indexed-strip2d'||v.graph_version!=='0.1.0')throw new Error('indexed-strip graph identity drifted');
          if(v.caller_neutral_replay!=='PASS'||v.caller_request_unchanged!==true||v.caller_paths_unchanged!==true)throw new Error('indexed-strip caller/source boundary failed');

          const s=v.retained_sweep_source;
          if(s.schema!=='axm.path-sweep-frame-source/v0.1'||s.algorithm!=='polyline-bisector-sweep-frame2d/v0.1'||s.profile!=='symmetric-ribbon2d'||s.frame_policy!=='left-normal-bisector2d'||s.reversal_fallback!=='outgoing-segment'||s.width_mode!=='constant-half-width')throw new Error('retained sweep semantics drifted');
          const frame=v.selected_frame_set;
          const ribbon=v.selected_ribbon_set;
          const strip=v.selected_indexed_strip_set;
          if(frame.schema!=='axm.path-sweep-frame-set/v0.1'||frame.derived!==true||frame.rebuildable!==true||frame.sourceHash!==s.source_hash||frame.pathSourceHash!==s.path_source_hash)throw new Error('frame lineage drifted');
          if(ribbon.schema!=='axm.path-sweep-ribbon-set/v0.1'||ribbon.derived!==true||ribbon.rebuildable!==true||ribbon.sweepSourceHash!==s.source_hash||ribbon.pathSourceHash!==s.path_source_hash||ribbon.frameSetHash!==frame.frameSetHash)throw new Error('ribbon lineage drifted');
          if(strip.schema!=='axm.path-sweep-indexed-strip-set/v0.1'||strip.derived!==true||strip.rebuildable!==true||strip.sweepSourceHash!==s.source_hash||strip.pathSourceHash!==s.path_source_hash||strip.frameSetHash!==frame.frameSetHash||strip.ribbonSetHash!==ribbon.ribbonSetHash)throw new Error('indexed-strip lineage drifted');
          if(strip.vertexCount!==strip.pointCount*2||strip.triangleCount!==(strip.pointCount-strip.pathCount)*2||strip.indexCount!==strip.triangleCount*3)throw new Error('indexed-strip structural cardinality drifted');
          const sem=strip.semantics;
          if(sem.algorithm!=='ribbon-adjacent-pair-indexed-strip2d/v0.1'||sem.primitiveTopology!=='triangle-list'||sem.vertexOrder!=='left-right-per-path-point'||sem.pathBridging!=='forbidden'||sem.joinAuthority!=='none'||sem.capAuthority!=='none'||sem.uvAuthority!=='none'||sem.materialAuthority!=='none'||sem.rendererAuthority!=='none'||sem.frontFaceAuthority!=='none'||sem.manifoldAuthority!=='none'||sem.selfIntersectionResolution!=='none'||sem.geometryValidityClaim!=='connectivity-only')throw new Error('indexed-strip authority semantics drifted');

          if(r.outputs.scene.sha256!==sha(sceneBytes)||r.outputs.donor_state.sha256!==sha(stateBytes))throw new Error('indexed-strip output bytes are not receipt-bound');
          if(!Object.values(r.challenges).every(Boolean))throw new Error('one or more indexed-strip challenges failed');
          const o=r.native_observer;
          if(o.donor_triangle_connectivity_consumed_directly!==true||o.triangulation_rederived_by_consumer!==false||o.boundary_offsets_rederived_by_consumer!==false||o.path_bridging_introduced_by_consumer!==false||o.canonical_mesh_authority_acquired!==false||o.renderer_authority_acquired!==false||o.material_authority_acquired!==false||o.consumer_semantics_assigned!==false)throw new Error('indexed-strip native observer authority boundary drifted');
          const t=r.truth_boundary;
          if(t.caller_paths_authority!=='RETAINED_CALLER_SOURCE_TRUTH'||t.sweep_source_authority!=='RETAINED_VFX_SOURCE'||t.frame_set_authority!=='DERIVED_REBUILDABLE_VFX_BODY'||t.ribbon_set_authority!=='DERIVED_REBUILDABLE_VFX_BODY'||t.indexed_strip_set_authority!=='DERIVED_REBUILDABLE_VFX_BODY'||t.native_scene_receipt_pixels_authority!=='DERIVED_REPLACEABLE_OBSERVER_BODIES'||t.donor_geometry_validity_claim!=='CONNECTIVITY_ONLY')throw new Error('indexed-strip truth boundary drifted');
          for(const key of ['triangulation_rederived_by_creative_render','boundary_offsets_rederived_by_creative_render','canonical_mesh_authority_acquired','consumer_semantics_proven','general_surface_validity_proven','winding_validity_proven','self_intersection_safety_proven','aesthetic_quality_proven','accessibility_proven','realtime_performance_proven','gpu_equivalence_proven','cross_machine_bitwise_determinism_proven']){
            if(t[key]!==false)throw new Error(`unsupported claim promoted: ${key}`);
          }

          const donor=await import(pathToFileURL(resolve('visual-effect-fabric/hand-lab/src/path-sweep-indexed-strip2d.mjs')).href);
          if(donor.validatePathSweepIndexedStripSet(state,strip,{maxPoints:4096})!==true)throw new Error('retained donor state no longer validates selected indexed strip');

          const challenges={
            contract:'AXM_CREATIVE_VFX_PATH_SWEEP_INDEXED_STRIP_NATIVE_CHALLENGES',
            version:1,
            caller_neutral_replay:'PASS',
            retained_paths_unchanged:'PASS',
            exact_vs_roomy_donor_capacity:'PASS',
            one_below_donor_capacity:'REJECTED_AS_REQUIRED',
            exact_vs_roomy_observer_capacity:'PASS',
            one_below_observer_capacity:'REJECTED_AS_REQUIRED',
            graph_4097_points_over_default_4096:'REJECTED_AS_REQUIRED',
            path_local_connectivity_isolation:'PASS',
            self_consistent_indexed_strip_tamper:'REJECTED_AS_REQUIRED',
            self_consistent_semantic_forgery:'REJECTED_AS_REQUIRED',
            self_consistent_ribbon_tamper_laundering:'REJECTED_AS_REQUIRED'
          };
          await writeFile(root+'challenges.json',JSON.stringify(challenges,null,2)+'\n');
          console.log('vfx_path_sweep_indexed_strip_truth_gates=PASS');
          console.log(`path_source_hash=${s.path_source_hash}`);
          console.log(`sweep_source_hash=${s.source_hash}`);
          console.log(`ribbon_set_hash=${ribbon.ribbonSetHash}`);
          console.log(`indexed_strip_set_hash=${strip.indexedStripSetHash}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify donor-connectivity observation
        run: |
          root=creative-render/build/vfx-path-sweep-indexed-strip
          cat > "$root/scene.axmrender" <<'EOF_REQ'
          AXM_RENDER_REQUEST 1
          scene scene.axmscene
          backend axm.native.cpu.reference
          width 640
          height 420
          format ppm-rgb8
          output scene.ppm
          EOF_REQ
          render-fabric/build/axm-render --request "$root/scene.axmrender" --receipt "$root/scene.axmreceipt"
          render-fabric/build/axm-render-verify-receipt "$root/scene.axmrender" "$root/scene.axmreceipt"

      - name: Bind donor connectivity to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const root='creative-render/build/vfx-path-sweep-indexed-strip/';
          const receipt=JSON.parse(await readFile(root+'indexed-strip.receipt.json','utf8'));
          const [scene,request,renderReceipt,frame]=await Promise.all([
            readFile(root+'scene.axmscene'),
            readFile(root+'scene.axmrender'),
            readFile(root+'scene.axmreceipt'),
            readFile(root+'scene.ppm'),
          ]);
          if(sha(scene)!==receipt.outputs.scene.sha256)throw new Error('native renderer did not consume receipt-bound indexed-strip scene bytes');
          if(frame.length<=32)throw new Error('native indexed-strip frame is unexpectedly empty');
          const evidence={
            contract:'AXM_CREATIVE_VFX_PATH_SWEEP_INDEXED_STRIP_NATIVE_PIXEL_EVIDENCE',
            version:1,
            retained_path_source_hash:receipt.visual_effect_fabric.retained_sweep_source.path_source_hash,
            retained_sweep_source_hash:receipt.visual_effect_fabric.retained_sweep_source.source_hash,
            derived_frame_set_hash:receipt.visual_effect_fabric.selected_frame_set.frameSetHash,
            derived_ribbon_set_hash:receipt.visual_effect_fabric.selected_ribbon_set.ribbonSetHash,
            derived_indexed_strip_set_hash:receipt.visual_effect_fabric.selected_indexed_strip_set.indexedStripSetHash,
            scene_sha256:sha(scene),
            request_sha256:sha(request),
            render_receipt_sha256:sha(renderReceipt),
            frame_sha256:sha(frame),
            frame_bytes:frame.length,
            native_receipt_independently_verified:true,
            donor_connectivity_consumed_directly:true,
            pixels_authority:'DERIVED_REPLACEABLE_OBSERVER_BODY',
            general_surface_validity_proven:false,
            winding_validity_proven:false,
            aesthetic_quality_proven:false
          };
          await writeFile(root+'native-pixel-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_path_sweep_indexed_strip_native_pixel_binding=PASS');
          console.log(`frame_sha256=${evidence.frame_sha256}`);
          NODE

      - name: Upload retained indexed-strip proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-path-sweep-indexed-strip-native-proof
          path: creative-render/build/vfx-path-sweep-indexed-strip
          if-no-files-found: warn
          retention-days: 30
