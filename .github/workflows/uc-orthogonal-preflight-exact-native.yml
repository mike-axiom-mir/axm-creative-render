name: uc-orthogonal-preflight-exact-native

on:
  pull_request:
    paths:
      - 'src/uc_orthogonal_preflight_exact_native_bridge.mjs'
      - 'src/uc_orthogonal_preflight_exact_native_cli.mjs'
      - 'tests/uc_orthogonal_preflight_exact_native_bridge.test.mjs'
      - '.github/workflows/uc-orthogonal-preflight-exact-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/uc_orthogonal_preflight_exact_native_bridge.mjs'
      - 'src/uc_orthogonal_preflight_exact_native_cli.mjs'
      - 'tests/uc_orthogonal_preflight_exact_native_bridge.test.mjs'
      - '.github/workflows/uc-orthogonal-preflight-exact-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-uc-orthogonal-preflight-exact-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Universal Creation
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: e6826acbc7296ba77d25534c8d3d3770ff3fa747
          path: universal-creation

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained proof directory
        run: |
          mkdir -p creative-render/build/uc-orthogonal-preflight-exact-native
          cat > creative-render/build/uc-orthogonal-preflight-exact-native/donor-revisions.json <<'EOF'
          {
            "universal_creation": "e6826acbc7296ba77d25534c8d3d3770ff3fa747",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Verify retained UC composer and preflight stack
        run: |
          node universal-creation/capabilities/physics-core/constraint-composer-selftest.js
          node universal-creation/capabilities/physics-core/constraint-preflight-selftest.js
          node universal-creation/capabilities/physics-core/constraint-preflight-guard-selftest.js
          node universal-creation/capabilities/physics-core/orthogonal-projection-preflight-selftest.js

      - name: Build exact-geometry orthogonal preflight proof
        run: |
          base=creative-render/build/uc-orthogonal-preflight-exact-native
          node creative-render/src/uc_orthogonal_preflight_exact_native_cli.mjs build \
            --uc-root universal-creation \
            --uc-revision e6826acbc7296ba77d25534c8d3d3770ff3fa747 \
            --source-scene "$base/source.axmscene" \
            --blocked-scene "$base/blocked.axmscene" \
            --accepted-scene "$base/accepted.axmscene" \
            --receipt "$base/orthogonal-preflight-exact.receipt.json"

      - name: Independently assert exact proof and rounding-boundary delegation
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/uc-orthogonal-preflight-exact-native/';
          const [receiptBytes,sourceScene,blockedScene,acceptedScene]=await Promise.all([
            readFile(base+'orthogonal-preflight-exact.receipt.json'),readFile(base+'source.axmscene'),
            readFile(base+'blocked.axmscene'),readFile(base+'accepted.axmscene')
          ]);
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          if(receipt.contract!=='AXM_CREATIVE_UC_ORTHOGONAL_PREFLIGHT_EXACT_NATIVE_RECEIPT'||receipt.version!==1)throw new Error('orthogonal preflight receipt contract drifted');
          if(receipt.donor.revision!=='e6826acbc7296ba77d25534c8d3d3770ff3fa747')throw new Error('pinned current UC revision drifted');
          if(receipt.donor.orthogonal_preflight_version!=='0.3.0'||receipt.donor.orthogonal_preflight_schema!=='axm.uc-orthogonal-projection-preflight/v0.3')throw new Error('current exact-geometry preflight donor was not exercised');
          if(receipt.donor.orthogonal_guard_version!=='0.2.0'||receipt.donor.orthogonal_guard_schema!=='axm.uc-orthogonal-projection-preflight-guard-step/v0.2')throw new Error('current orthogonal guard donor was not exercised');
          if(receipt.caller_authority.source_state_mutated!==false||receipt.caller_authority.requests_mutated!==false||receipt.caller_authority.stronger_guard_is_opt_in!==true)throw new Error('caller authority boundary failed');
          const blocked=receipt.exact_orthogonal_block;
          if(blocked.proof_geometry!=='full-precision-normalized'||blocked.conflict_code!=='ORTHOGONAL_PROJECTIONS_EXCEED_DISTANCE_MAX')throw new Error('exact conflict proof drifted');
          if(blocked.minimum_required_distance!==5||blocked.maximum_allowed_distance!==4.5)throw new Error('3-4-5 conflict evidence drifted');
          if(blocked.accepted!==false||blocked.blocked!==true||blocked.reason!=='PROVABLE_ORTHOGONAL_LOCAL_CONFLICT'||blocked.core_step_executed!==false||blocked.composer_present!==false||blocked.world_unchanged!==true)throw new Error('exact orthogonal zero-step block drifted');
          if(blocked.world_checksum_before!==blocked.world_checksum_after||blocked.repeat_verification!=='PASS')throw new Error('exact block continuity/replay evidence drifted');
          const near=receipt.near_orthogonal_rounding_boundary;
          if(near.caller_direction_x!==1.4e-9||near.presentation_direction_x!==1e-9||near.orthogonality_tolerance!==1e-9)throw new Error('rounding-boundary fixture drifted');
          if(near.proof_geometry!=='full-precision-normalized'||near.orthogonal_checks!==0||near.orthogonal_conflicts!==0||near.conflict_free!==true)throw new Error('full-precision proof incorrectly accepted display rounding as orthogonality');
          if(near.guard_accepted!==true||near.core_step_executed!==true||near.exact_base_guard_equivalent!==true||near.repeat_verification!=='PASS')throw new Error('near-orthogonal delegation evidence drifted');
          if(receipt.outputs.source_scene.sha256!==sha(sourceScene)||receipt.outputs.blocked_scene.sha256!==sha(blockedScene)||receipt.outputs.accepted_scene.sha256!==sha(acceptedScene))throw new Error('derived scene byte lineage drifted');
          if(sha(sourceScene)!==sha(blockedScene)||receipt.outputs.source_and_blocked_scenes_identical!==true)throw new Error('blocked branch invented visual state');
          if(sha(sourceScene)===sha(acceptedScene)||receipt.outputs.source_and_accepted_scenes_differ!==true)throw new Error('accepted branch failed to create observable derived state');
          for(const bytes of [sourceScene,blockedScene,acceptedScene]){
            const scene=parseScene(bytes.toString('utf8'));
            if(scene.triangles.length!==4)throw new Error('bounded orthogonal-preflight adapter triangle count drifted');
            if(JSON.stringify(scene.triangles[0].albedo)!==JSON.stringify([90,110,145])||JSON.stringify(scene.triangles[2].albedo)!==JSON.stringify([224,166,72]))throw new Error('orthogonal-preflight adapter albedo drifted');
          }
          const evidence={
            contract:'AXM_CREATIVE_UC_ORTHOGONAL_PREFLIGHT_EXACT_INDEPENDENT_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),source_scene_sha256:sha(sourceScene),blocked_scene_sha256:sha(blockedScene),accepted_scene_sha256:sha(acceptedScene),
            gates:{caller_authority:'PASS',exact_geometry_conflict_block:'PASS',zero_step_visual_noop:'PASS',presentation_rounding_not_authority:'PASS',near_orthogonal_delegation:'PASS',exact_base_guard_equivalence:'PASS',same_runtime_repeat:'PASS'}
          };
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('uc_orthogonal_preflight_exact_independent_evidence=PASS');
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify all orthogonal-preflight observations
        run: |
          base=creative-render/build/uc-orthogonal-preflight-exact-native
          for name in source blocked accepted; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind exact proof decisions to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/uc-orthogonal-preflight-exact-native/';
          const receiptBytes=await readFile(base+'orthogonal-preflight-exact.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const names=['source','blocked','accepted'];
          const renders={};
          for(const name of names){
            const [scene,frame,renderReceipt]=await Promise.all([readFile(base+name+'.axmscene'),readFile(base+name+'.ppm'),readFile(base+name+'.axmreceipt')]);
            renders[name]={scene_sha256:sha(scene),frame_sha256:sha(frame),receipt_sha256:sha(renderReceipt)};
          }
          if(renders.source.frame_sha256!==renders.blocked.frame_sha256)throw new Error('zero-step exact block invented native pixel change');
          if(renders.source.frame_sha256===renders.accepted.frame_sha256)throw new Error('accepted near-orthogonal delegation did not reach distinct native pixels');
          const evidence={
            contract:'AXM_CREATIVE_UC_ORTHOGONAL_PREFLIGHT_EXACT_NATIVE_RENDER_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),uc_revision:receipt.donor.revision,proof_geometry:receipt.exact_orthogonal_block.proof_geometry,
            renders,render_receipt_replay:{source:'PASS',blocked:'PASS',accepted:'PASS'},
            observed_native_identity:{source_equals_blocked:true,source_differs_from_accepted:true},
            authority:{source_world_and_constraint_requests:'CALLER_AUTHORITATIVE',rounded_public_values:'PRESENTATION_ONLY',preflight_guard_and_accepted_world:'DERIVED_UC_EVIDENCE',scenes:'DERIVED_REPLACEABLE_OBSERVATIONS',pixels:'DERIVED_RENDER_FABRIC_OUTPUT'},
            truth_boundary:{
              proves:'current UC full-precision orthogonal preflight can block an exact bounded contradiction without integration while declining a near-orthogonal display-rounding case and delegating it through the established guard into independently receipt-verified native pixels',
              does_not_prove:'global satisfiability, oblique or multi-direction conflict solving, multi-pair or loop reasoning, convergence, stability, general collision correctness, scientific validity, gameplay correctness or aesthetic quality'
            }
          };
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('uc_orthogonal_preflight_exact_native_render=PASS');
          console.log(`source_frame_sha256=${renders.source.frame_sha256}`);
          console.log(`blocked_frame_sha256=${renders.blocked.frame_sha256}`);
          console.log(`accepted_frame_sha256=${renders.accepted.frame_sha256}`);
          NODE

      - name: Upload retained exact-geometry orthogonal preflight proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-uc-orthogonal-preflight-exact-native-proof
          path: creative-render/build/uc-orthogonal-preflight-exact-native/
          if-no-files-found: warn
