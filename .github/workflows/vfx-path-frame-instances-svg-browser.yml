name: vfx-path-frame-instances-svg-browser

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vfx-path-frame-instances-svg-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-vfx-path-frame-instances-svg-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Creative Render revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: 18c2fd43703fed49e2afe7f5f99d51c4707fed6c
          path: visual-effect-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained attempt evidence before gates
        shell: bash
        run: |
          set -euo pipefail
          root=creative-render/build/vfx-path-frame-instances-svg-browser
          mkdir -p "$root"
          creative_sha="$(git -C creative-render rev-parse HEAD)"
          donor_sha="$(git -C visual-effect-fabric rev-parse HEAD)"
          expected_creative="${{ github.event.pull_request.head.sha || github.sha }}"
          expected_donor="18c2fd43703fed49e2afe7f5f99d51c4707fed6c"
          cat > "$root/checkout-provenance.json" <<EOF_JSON
          {
            "creative_render_expected": "$expected_creative",
            "creative_render_checked_out": "$creative_sha",
            "visual_effect_fabric_expected": "$expected_donor",
            "visual_effect_fabric_checked_out": "$donor_sha",
            "authority": "EVIDENCE_ONLY"
          }
          EOF_JSON
          cat > "$root/attempt.json" <<'EOF_JSON'
          {
            "lane": "vfx-path-frame-instances-svg-browser",
            "canonical_authority": "retained caller path source plus retained VFX sweep-frame source",
            "derived_rebuildable": ["path sweep frames", "path-frame instance transform sets"],
            "derived_replaceable": ["caller-declared renderer-only prototype", "SVG realization", "browser probe", "browser RGBA", "screenshots"],
            "automatic_aesthetic_acceptance": false
          }
          EOF_JSON
          test "$creative_sha" = "$expected_creative"
          test "$donor_sha" = "$expected_donor"

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run pinned current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build source-honest path-frame instance SVG proof
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { sha256 } from './creative-render/src/creative_scene_operator.mjs';
          import { observeVisualEffectPathFrameInstancesStaticSvg } from './creative-render/src/vfx_path_frame_instances_svg_browser_bridge.mjs';
          const root='creative-render/build/vfx-path-frame-instances-svg-browser';
          await mkdir(root,{recursive:true});
          const observed=await observeVisualEffectPathFrameInstancesStaticSvg(resolve('visual-effect-fabric'),{vfxRevision:'18c2fd43703fed49e2afe7f5f99d51c4707fed6c'});
          const files={
            'prepared-donor-state.json':observed.donorStateBytes,
            'path-frame-instances-native.receipt.json':observed.nativeReceiptBytes,
            'dense.svg':observed.denseSvg,
            'sparse.svg':observed.sparseSvg,
            'alternate-presentation.svg':observed.alternatePresentationSvg,
            'alternate-prototype.svg':observed.alternatePrototypeSvg,
            'browser-probe.html':observed.probeHtml,
          };
          const outputs={};
          for(const [name,bytes] of Object.entries(files)){await writeFile(`${root}/${name}`,bytes);outputs[name]={sha256:sha256(bytes),bytes:bytes.length};}
          const provenance=JSON.parse(await readFile(`${root}/checkout-provenance.json`,'utf8'));
          const receipt={
            contract:'AXM_CREATIVE_VFX_PATH_FRAME_INSTANCES_SVG_BROWSER_BUILD_RECEIPT',version:1,
            checkout_provenance:provenance,
            visual_effect_fabric:observed.observation,
            outputs,
            authority:{
              canonical:'retained caller path source plus retained VFX sweep-frame source',
              derived_rebuildable:['path sweep frames','path-frame instance transform sets'],
              caller_declared_noncanonical:['renderer-only prototype'],
              derived_replaceable:['SVG realization','browser probe','browser RGBA','screenshots']
            }
          };
          const receiptBytes=Buffer.from(JSON.stringify(receipt,null,2)+'\n');
          await writeFile(`${root}/build.receipt.json`,receiptBytes);
          console.log('vfx_path_frame_instances_svg_build=PASS');
          console.log(`dense_svg_sha256=${outputs['dense.svg'].sha256}`);
          console.log(`sparse_svg_sha256=${outputs['sparse.svg'].sha256}`);
          console.log(`receipt_sha256=${sha256(receiptBytes)}`);
          NODE

      - name: Independently assert authority, replaceability and fail-closed gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const root='creative-render/build/vfx-path-frame-instances-svg-browser/';
          const names=['build.receipt.json','checkout-provenance.json','prepared-donor-state.json','path-frame-instances-native.receipt.json','dense.svg','sparse.svg','alternate-presentation.svg','alternate-prototype.svg','browser-probe.html'];
          const values=Object.fromEntries(await Promise.all(names.map(async name=>[name,await readFile(root+name)])));
          const r=JSON.parse(values['build.receipt.json']),v=r.visual_effect_fabric,p=JSON.parse(values['checkout-provenance.json']);
          if(r.contract!=='AXM_CREATIVE_VFX_PATH_FRAME_INSTANCES_SVG_BROWSER_BUILD_RECEIPT'||r.version!==1)throw new Error('build receipt drifted');
          if(p.creative_render_expected!==p.creative_render_checked_out||p.visual_effect_fabric_expected!==p.visual_effect_fabric_checked_out)throw new Error('checkout provenance drifted');
          if(v.donor_revision!=='18c2fd43703fed49e2afe7f5f99d51c4707fed6c'||v.static_graph_id!=='fx.geometry.path-frame-instances2d-static-svg'||v.static_hand_id!=='fx.geometry.path-frame-instances2d-static-svg-realize')throw new Error('expected current donor SVG graph/Hand was not exercised');
          if(v.derived.dense_instance_set_hash===v.derived.sparse_instance_set_hash||!(v.derived.dense_instance_count>v.derived.sparse_instance_count))throw new Error('dense/sparse verified selection boundary drifted');
          if(v.prototype.provenance_status!=='CALLER_DECLARED_NOT_VERIFIED_BY_HAND'||v.prototype.canonical!==false||v.prototype.renderer_only!==true)throw new Error('caller prototype was promoted');
          if(v.capacity_challenge.exact_equals_roomy!==true||v.capacity_challenge.one_below_instance_rejected!==true||v.capacity_challenge.one_below_output_points_rejected!==true)throw new Error('structural capacity boundary failed');
          if(v.presentation_challenge.same_instance_set_hash!==true||v.presentation_challenge.same_prototype_hash!==true||v.presentation_challenge.svg_bytes_changed!==true)throw new Error('presentation replaceability boundary failed');
          if(v.prototype_challenge.same_instance_set_hash!==true||v.prototype_challenge.prototype_hash_changed!==true||v.prototype_challenge.svg_bytes_changed!==true||v.prototype_challenge.prototype_remains_noncanonical!==true)throw new Error('external prototype boundary failed');
          if(v.derived_tamper_challenge.recomputed_self_consistent_hash!==true||v.derived_tamper_challenge.rejected!==true)throw new Error('self-consistent derived tamper was not rejected');
          for(const [name,row] of Object.entries(r.outputs)){if(!values[name]||row.sha256!==sha(values[name])||row.bytes!==values[name].length)throw new Error(`retained output byte binding drifted: ${name}`);}
          if(sha(values['dense.svg'])===sha(values['sparse.svg']))throw new Error('dense/sparse donor SVG bytes unexpectedly match');
          if(sha(values['dense.svg'])===sha(values['alternate-presentation.svg']))throw new Error('presentation challenge did not change replaceable SVG bytes');
          if(sha(values['dense.svg'])===sha(values['alternate-prototype.svg']))throw new Error('prototype challenge did not change replaceable SVG bytes');
          if(v.truth_boundary.browser_pixels_proven!==false||v.truth_boundary.prototype_quality_proven!==false||v.truth_boundary.consumer_semantics_proven!==false||v.truth_boundary.aesthetic_quality_proven!==false)throw new Error('pre-browser truth boundary was promoted');
          const evidence={
            contract:'AXM_CREATIVE_VFX_PATH_FRAME_INSTANCES_SVG_INDEPENDENT_EVIDENCE',version:1,
            build_receipt_sha256:sha(values['build.receipt.json']),donor_revision:v.donor_revision,
            path_source_hash:v.retained.path_source_hash,sweep_source_hash:v.retained.sweep_source_hash,frame_set_hash:v.derived.frame_set_hash,
            dense_instance_set_hash:v.derived.dense_instance_set_hash,sparse_instance_set_hash:v.derived.sparse_instance_set_hash,
            prototype_hash:v.prototype.hash,
            gates:{checkout_exact:'PASS',source_authority:'PASS',derived_rebuild_lineage:'PASS',capacity_fail_closed:'PASS',derived_tamper_rejected:'PASS',presentation_replaceability:'PASS',external_prototype_noncanonical:'PASS',pre_browser_truth_boundary:'PASS'}
          };
          await writeFile(root+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_path_frame_instances_svg_lineage=PASS');
          NODE

      - name: Locate installed browser and retain exact version
        shell: bash
        run: |
          set -euo pipefail
          root=creative-render/build/vfx-path-frame-instances-svg-browser
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then echo "No supported Chromium-family browser is installed" >&2; exit 1; fi
          printf '%s\n' "$browser" > "$root/browser-path.txt"
          "$browser" --version | tee "$root/browser-version.txt"

      - name: Rasterize exact donor SVGs through the real headless browser
        shell: bash
        run: |
          set -euo pipefail
          root=creative-render/build/vfx-path-frame-instances-svg-browser
          browser="$(cat "$root/browser-path.txt")"
          probe_uri="file://$(realpath "$root/browser-probe.html")"
          "$browser" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "$probe_uri" > "$root/browser-probe.dump.html"
          grep -q 'data-axm-done="true"' "$root/browser-probe.dump.html"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=640,420 --screenshot="$PWD/$root/dense-browser.png" "file://$(realpath "$root/dense.svg")"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=640,420 --screenshot="$PWD/$root/sparse-browser.png" "file://$(realpath "$root/sparse.svg")"
          test -s "$root/dense-browser.png" && test -s "$root/sparse-browser.png"

      - name: Verify and bind raw browser pixel evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parsePathFrameInstancesSvgBrowserProbeDump, verifyPathFrameInstancesSvgBrowserRasterEvidence } from './creative-render/src/vfx_path_frame_instances_svg_browser_bridge.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const root='creative-render/build/vfx-path-frame-instances-svg-browser/';
          const [dump,probe,receiptBytes,browserVersionBytes,denseShot,sparseShot]=await Promise.all([readFile(root+'browser-probe.dump.html'),readFile(root+'browser-probe.html'),readFile(root+'build.receipt.json'),readFile(root+'browser-version.txt'),readFile(root+'dense-browser.png'),readFile(root+'sparse-browser.png')]);
          const r=JSON.parse(receiptBytes),v=r.visual_effect_fabric;
          if(sha(probe)!==r.outputs['browser-probe.html'].sha256)throw new Error('browser probe changed after build receipt');
          const raster=verifyPathFrameInstancesSvgBrowserRasterEvidence(parsePathFrameInstancesSvgBrowserProbeDump(dump),{denseSvgSha256:r.outputs['dense.svg'].sha256,sparseSvgSha256:r.outputs['sparse.svg'].sha256});
          const sig='89504e470d0a1a0a';if(denseShot.subarray(0,8).toString('hex')!==sig||sparseShot.subarray(0,8).toString('hex')!==sig)throw new Error('browser screenshots are not PNG');
          const browserVersion=browserVersionBytes.toString('utf8').trim();if(!browserVersion)throw new Error('browser version evidence is empty');
          const evidence={
            contract:'AXM_CREATIVE_VFX_PATH_FRAME_INSTANCES_SVG_BROWSER_RASTER_EVIDENCE',version:1,
            build_receipt_sha256:sha(receiptBytes),donor_revision:v.donor_revision,
            path_source_hash:v.retained.path_source_hash,sweep_source_hash:v.retained.sweep_source_hash,frame_set_hash:v.derived.frame_set_hash,
            dense_instance_set_hash:v.derived.dense_instance_set_hash,sparse_instance_set_hash:v.derived.sparse_instance_set_hash,
            prototype_hash:v.prototype.hash,
            browser:{version:browserVersion,version_sha256:sha(browserVersionBytes),mode:'headless-local-file',network_required:false},
            raster,
            screenshots:{dense:{sha256:sha(denseShot),bytes:denseShot.length},sparse:{sha256:sha(sparseShot),bytes:sparseShot.length}},
            authority:{canonical:'retained caller path source plus retained VFX sweep-frame source',derived_rebuildable:['path sweep frames','path-frame instance transform sets'],prototype:'CALLER_DECLARED_RENDERER_ONLY_NOT_VERIFIED_BY_HAND',browser_rgba_and_screenshots:'DERIVED_BROWSER_OUTPUT'},
            truth_boundary:{proves:'the identified local browser decoded and rasterized exact hash-bound donor SVGs made from two verified derived instance selections while the caller-declared prototype remained renderer-only',does_not_prove:'prototype quality, sprite/particle/decal/mesh/game/UI/world meaning, aesthetic quality, accessibility, production readiness, continuous animation, GPU parity, target-device realtime performance, Firefox/WebKit equivalence, or cross-browser/cross-machine bitwise determinism'}
          };
          await writeFile(root+'browser-raster-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_path_frame_instances_svg_browser_observation=PASS');
          console.log(`browser=${browserVersion}`);console.log(`different_pixels=${raster.different_pixels}`);console.log(`different_channels=${raster.different_channels}`);console.log(`sum_abs_channel_delta=${raster.sum_abs_channel_delta}`);console.log(`dense_rgba_fnv1a32=${raster.dense_rgba_fnv1a32}`);console.log(`sparse_rgba_fnv1a32=${raster.sparse_rgba_fnv1a32}`);
          NODE

      - name: Upload complete path-frame instance SVG browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-path-frame-instances-svg-browser-proof
          path: creative-render/build/vfx-path-frame-instances-svg-browser/
          if-no-files-found: warn
