name: vfx-path-wave-displacement-native

on:
  pull_request:
    paths:
      - 'src/vfx_path_wave_displacement_bridge.mjs'
      - 'src/vfx_path_wave_displacement_cli.mjs'
      - 'tests/vfx_path_wave_displacement_bridge.test.mjs'
      - '.github/workflows/vfx-path-wave-displacement-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_path_wave_displacement_bridge.mjs'
      - 'src/vfx_path_wave_displacement_cli.mjs'
      - 'tests/vfx_path_wave_displacement_bridge.test.mjs'
      - '.github/workflows/vfx-path-wave-displacement-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-path-wave-displacement-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: 75338a92e6d09876f976909ded0610e4d3026d83
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained attempt evidence before assertions
        run: |
          mkdir -p creative-render/build/vfx-path-wave-displacement-native
          cat > creative-render/build/vfx-path-wave-displacement-native/attempt.json <<EOF
          {
            "contract": "AXM_CREATIVE_VFX_PATH_WAVE_NATIVE_ATTEMPT",
            "version": 1,
            "creative_render_head": "${GITHUB_SHA}",
            "visual_effect_fabric": "75338a92e6d09876f976909ded0610e4d3026d83",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b",
            "graph": "fx.path.wave-displace2d",
            "authority": "caller path topology and normalized VFX wave source remain authoritative; wave-displaced sets, AXM_SCENE bodies, receipts and pixels are derived/replaceable"
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run pinned current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build zero and active path-wave proof
        run: |
          base=creative-render/build/vfx-path-wave-displacement-native
          node creative-render/src/vfx_path_wave_displacement_cli.mjs build \
            --vfx-root visual-effect-fabric \
            --vfx-revision 75338a92e6d09876f976909ded0610e4d3026d83 \
            --source-paths "$base/source-paths.json" \
            --zero-scene "$base/zero.axmscene" \
            --waved-scene "$base/waved.axmscene" \
            --zero-state "$base/zero-state.json" \
            --waved-state "$base/waved-state.json" \
            --receipt "$base/path-wave.receipt.json"

      - name: Independently assert authority, bounds, tamper rejection and adapter evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-path-wave-displacement-native/';
          const [receiptBytes,sourcePathsBytes,zeroSceneBytes,wavedSceneBytes,zeroStateBytes,wavedStateBytes,attemptBytes]=await Promise.all([
            readFile(base+'path-wave.receipt.json'),readFile(base+'source-paths.json'),readFile(base+'zero.axmscene'),readFile(base+'waved.axmscene'),
            readFile(base+'zero-state.json'),readFile(base+'waved-state.json'),readFile(base+'attempt.json')
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const attempt=JSON.parse(attemptBytes.toString('utf8'));
          if(attempt.visual_effect_fabric!=='75338a92e6d09876f976909ded0610e4d3026d83'||attempt.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor attempt evidence drifted');
          if(r.contract!=='AXM_CREATIVE_VFX_PATH_WAVE_DISPLACEMENT_RECEIPT'||r.version!==1)throw new Error('path-wave receipt contract drifted');
          if(r.donor.revision!==attempt.visual_effect_fabric||r.donor.graph_id!=='fx.path.wave-displace2d'||r.donor.graph_version!=='0.1.0')throw new Error('current VFX path-wave graph was not exercised');
          if(JSON.stringify(r.donor.hand_ids)!==JSON.stringify(['fx.path.wave-displacement-source-normalize','fx.path.wave-displacement-build']))throw new Error('VFX path-wave Hand boundary drifted');
          if(r.caller_authority.source_paths_mutated!==false||r.caller_authority.path_metadata_preserved!==true||r.caller_authority.point_metadata_preserved!==true||r.caller_authority.consumer_meaning_assigned!==false)throw new Error('caller path authority boundary failed');
          if(r.outputs.source_paths.sha256!==sha(sourcePathsBytes)||r.outputs.zero_state.sha256!==sha(zeroStateBytes)||r.outputs.active_state.sha256!==sha(wavedStateBytes))throw new Error('source/state byte binding drifted');
          if(r.outputs.zero_scene.sha256!==sha(zeroSceneBytes)||r.outputs.active_scene.sha256!==sha(wavedSceneBytes))throw new Error('scene byte binding drifted');
          if(r.zero_amplitude.caller_neutral_repeat_verification!=='PASS'||r.active_wave.caller_neutral_repeat_verification!=='PASS')throw new Error('caller-neutral repeat verification failed');
          if(r.zero_amplitude.exact_derived_noop_verified!==true||r.zero_amplitude.max_displacement!==0||r.zero_amplitude.changed_interior_points!==0)throw new Error('zero amplitude did not remain exact derived no-op');
          if(!(r.active_wave.max_displacement>0)||!(r.active_wave.changed_interior_points>0))throw new Error('active path wave did not displace interior coordinates');
          if(r.zero_amplitude.endpoint_preservation_verified!==true||r.active_wave.endpoint_preservation_verified!==true)throw new Error('endpoint envelope evidence failed');
          if(r.zero_amplitude.displacement_source_hash===r.active_wave.displacement_source_hash||r.zero_amplitude.path_set_hash===r.active_wave.path_set_hash)throw new Error('explicit amplitude challenge did not change derived identities');
          if(r.execution_bounds.exact_max_points!==10||r.execution_bounds.roomy_max_points!==4096||r.execution_bounds.sufficient_budget_identity_preserved!==true)throw new Error('sufficient point budget became a hidden creative parameter');
          if(r.execution_bounds.insufficient_max_points!==9||!/pathWave point budget exceeded: 10 > 9/.test(r.execution_bounds.insufficient_budget_error)||r.execution_bounds.failed_budget_mutated_retained_source!==false)throw new Error('insufficient point budget did not fail closed');
          if(r.semantic_tamper_challenge.changed_field!=='pathWaveSource.algorithm'||r.semantic_tamper_challenge.recomputed_source_hash!==true||r.semantic_tamper_challenge.rejected!==true||!/algorithm mismatch/.test(r.semantic_tamper_challenge.error)||r.semantic_tamper_challenge.failed_challenge_mutated_retained_source!==false)throw new Error('self-consistent semantic-source tamper was not rejected');
          for(const row of [r.zero_amplitude,r.active_wave]){
            if(row.path_set.schema!=='axm.wave-displaced-path-set/v0.1'||row.path_set.derived!==true||row.path_set.rebuildable!==true)throw new Error('derived path-set truth boundary drifted');
            if(row.path_set.path_count!==2||row.path_set.point_count!==10)throw new Error('bounded caller path fixture cardinality drifted');
            if(row.scene_adapter.geometry_encodes_derived_path_coordinates!==true||row.scene_adapter.albedo_is_constant_observation_style!==true||row.scene_adapter.consumer_semantics_preserved!==false)throw new Error('replaceable scene-adapter boundary drifted');
          }
          if(sha(zeroSceneBytes)===sha(wavedSceneBytes))throw new Error('active path wave produced identical derived scene bytes');
          const zeroScene=parseScene(zeroSceneBytes.toString('utf8')),wavedScene=parseScene(wavedSceneBytes.toString('utf8'));
          if(zeroScene.triangles.length!==16||wavedScene.triangles.length!==16)throw new Error('expected bounded 8-segment/16-triangle adapter was not exercised');
          const zeroAlbedo=zeroScene.triangles.map(t=>t.albedo),wavedAlbedo=wavedScene.triangles.map(t=>t.albedo);
          if(JSON.stringify(zeroAlbedo)!==JSON.stringify(wavedAlbedo))throw new Error('path-wave observation styling changed across derived geometry states');
          if(zeroScene.triangles.some(t=>JSON.stringify(t.albedo)!==JSON.stringify([232,170,74])))throw new Error('path-wave observation style is not constant');
          if(JSON.stringify(zeroScene.triangles.map(t=>t.vertices))===JSON.stringify(wavedScene.triangles.map(t=>t.vertices)))throw new Error('active path-wave displacement did not reach scene geometry');
          const evidence={
            contract:'AXM_CREATIVE_VFX_PATH_WAVE_INDEPENDENT_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),attempt_sha256:sha(attemptBytes),
            donor_revisions:{visual_effect_fabric:attempt.visual_effect_fabric,render_fabric:attempt.render_fabric},
            retained_source:r.shared_retained_source,
            gates:{caller_path_authority:'PASS',metadata_preserved:'PASS',zero_amplitude_exact_noop:'PASS',endpoint_envelope_pinned:'PASS',active_interior_displacement:'PASS',sufficient_budget_noncreative:'PASS',insufficient_budget_fail_closed:'PASS',self_consistent_semantic_tamper_rejected:'PASS',constant_style_geometry_adapter:'PASS',same_runtime_caller_neutral_repeat:'PASS'}
          };
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_path_wave_independent_evidence=PASS');
          console.log(`source_path_hash=${r.shared_retained_source.path_source_hash}`);
          console.log(`zero_path_set_hash=${r.zero_amplitude.path_set_hash}`);
          console.log(`waved_path_set_hash=${r.active_wave.path_set_hash}`);
          console.log(`active_max_displacement=${r.active_wave.max_displacement}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify both path-wave candidates
        run: |
          base=creative-render/build/vfx-path-wave-displacement-native
          for name in zero waved; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind wave-displaced geometry to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-path-wave-displacement-native/';
          const receiptBytes=await readFile(base+'path-wave.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['zero','waved']){
            const [scene,request,renderReceipt,frame]=await Promise.all([
              readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')
            ]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
          }
          if(renders.zero.scene_sha256!==receipt.outputs.zero_scene.sha256||renders.waved.scene_sha256!==receipt.outputs.active_scene.sha256)throw new Error('scene identity changed before native rendering');
          if(renders.zero.frame_sha256===renders.waved.frame_sha256)throw new Error('active wave-displaced geometry did not reach distinct native frame bytes');
          const evidence={
            contract:'AXM_CREATIVE_VFX_PATH_WAVE_NATIVE_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),
            donor_revisions:{visual_effect_fabric:'75338a92e6d09876f976909ded0610e4d3026d83',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},
            retained_source:receipt.shared_retained_source,
            zero_displacement_source_hash:receipt.zero_amplitude.displacement_source_hash,
            active_displacement_source_hash:receipt.active_wave.displacement_source_hash,
            zero_path_set_hash:receipt.zero_amplitude.path_set_hash,
            active_path_set_hash:receipt.active_wave.path_set_hash,
            active_max_displacement:receipt.active_wave.max_displacement,
            renders,render_receipt_replay:{zero:'PASS',waved:'PASS'},
            authority:{caller_paths:'CALLER_CANONICAL_PATH_SOURCE',vfx_wave_source:'RETAINED_VFX_PATH_WAVE_SOURCE',path_sets:'DERIVED_REBUILDABLE_VFX_WORKING_SETS',scenes:'DERIVED_REPLACEABLE_VISUALIZATIONS',pixels:'DERIVED_RENDER_FABRIC_OUTPUT'},
            truth_boundary:{
              proves:'the pinned current VFX renderer-neutral path-wave graph preserves caller-owned path topology and metadata across an explicit zero-to-active wave amplitude choice, keeps adequate resource ceilings non-creative, rejects insufficient resource bounds and self-consistent semantic-source forgery, and carries the legitimate derived coordinate change through one constant-style adapter into independently receipt-verified native pixels',
              does_not_prove:'water/rope/cloth/shockwave/electricity/brush/animation/game/UI/world semantics, physical wave accuracy, temporal continuity, visual quality, target-device performance, GPU/browser parity or cross-machine bitwise determinism'
            }
          };
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_path_wave_native_render=PASS');
          console.log(`zero_frame_sha256=${renders.zero.frame_sha256}`);
          console.log(`waved_frame_sha256=${renders.waved.frame_sha256}`);
          NODE

      - name: Upload retained VFX path-wave native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-path-wave-displacement-native-proof
          path: creative-render/build/vfx-path-wave-displacement-native/
          if-no-files-found: warn
