name: vfx-branch-flow-guided-native

on:
  pull_request:
    paths:
      - 'src/vfx_branch_flow_guided_native_bridge.mjs'
      - 'src/vfx_branch_flow_guided_native_cli.mjs'
      - 'tests/vfx_branch_flow_guided_native_bridge.test.mjs'
      - '.github/workflows/vfx-branch-flow-guided-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_branch_flow_guided_native_bridge.mjs'
      - 'src/vfx_branch_flow_guided_native_cli.mjs'
      - 'tests/vfx_branch_flow_guided_native_bridge.test.mjs'
      - '.github/workflows/vfx-branch-flow-guided-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-branch-flow-guided-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: d6d30581d5e5eebc56b3df879dc3cd723b5427d0
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained proof inputs before assertions
        run: |
          base=creative-render/build/vfx-branch-flow-guided-native
          mkdir -p "$base"
          cat > "$base/donor-revisions.json" <<'EOF'
          {
            "visual_effect_fabric": "d6d30581d5e5eebc56b3df879dc3cd723b5427d0",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          EOF
          cat > "$base/attempt-inputs.json" <<'EOF'
          {
            "growth": {
              "id": "creative-render-flow-guided-growth",
              "origin": [0.5, 0.92],
              "headingTurns": 0.75,
              "baseLength": 0.18,
              "lengthDecay": 0.66,
              "branchOffsetsTurns": [-0.075, 0.075],
              "generations": 5
            },
            "flow": {
              "id": "creative-render-flow-guidance",
              "mode": "gradient",
              "strength": 2.4,
              "sampleStep": 0.02,
              "field": {
                "id": "creative-render-flow-field",
                "seed": 4242,
                "frequency": 3.5,
                "octaves": 4,
                "lacunarity": 2,
                "gain": 0.5,
                "offset": [0.1, -0.2]
              }
            },
            "guidance_choices": {
              "zero": {"curvatureScale": 0, "maxControlOffset": 0.18},
              "active": {"curvatureScale": 1.1, "maxControlOffset": 0.18}
            },
            "native_observation": {
              "quadratic_subdivisions_per_curve": 8,
              "style_fixed": true,
              "consumer_semantics_assigned": false
            }
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build retained flow-guided sources, curves, SVGs and native scenes
        run: |
          base=creative-render/build/vfx-branch-flow-guided-native
          node creative-render/src/vfx_branch_flow_guided_native_cli.mjs build \
            --vfx-root visual-effect-fabric \
            --vfx-revision d6d30581d5e5eebc56b3df879dc3cd723b5427d0 \
            --zero-growth-source "$base/zero-growth-source.json" \
            --active-growth-source "$base/active-growth-source.json" \
            --zero-network "$base/zero-network.json" \
            --active-network "$base/active-network.json" \
            --zero-field-source "$base/zero-field-source.json" \
            --active-field-source "$base/active-field-source.json" \
            --zero-flow-source "$base/zero-flow-source.json" \
            --active-flow-source "$base/active-flow-source.json" \
            --zero-guidance-source "$base/zero-guidance-source.json" \
            --active-guidance-source "$base/active-guidance-source.json" \
            --zero-curve-set "$base/zero-curve-set.json" \
            --active-curve-set "$base/active-curve-set.json" \
            --zero-svg "$base/zero.svg" \
            --active-svg "$base/active.svg" \
            --zero-state "$base/zero-state.json" \
            --active-state "$base/active-state.json" \
            --zero-scene "$base/zero.axmscene" \
            --active-scene "$base/active.axmscene" \
            --receipt "$base/branch-flow-guided.receipt.json"

      - name: Independently assert authority, no-op and derived-curvature boundaries
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-branch-flow-guided-native/';
          const [receiptBytes, donorBytes, attemptBytes] = await Promise.all([
            readFile(base+'branch-flow-guided.receipt.json'),
            readFile(base+'donor-revisions.json'),
            readFile(base+'attempt-inputs.json'),
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const donors=JSON.parse(donorBytes.toString('utf8'));
          const attempt=JSON.parse(attemptBytes.toString('utf8'));
          if(donors.visual_effect_fabric!=='d6d30581d5e5eebc56b3df879dc3cd723b5427d0'||donors.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor revision evidence drifted');
          if(r.contract!=='AXM_CREATIVE_VFX_BRANCH_FLOW_GUIDED_NATIVE_RECEIPT'||r.version!==1)throw new Error('flow-guided branch receipt contract drifted');
          if(r.donor.revision!==donors.visual_effect_fabric||r.donor.graph_id!=='fx.growth.branching2d-flow-guided-static-svg'||r.donor.graph_version!=='0.1.0')throw new Error('current VFX flow-guided branch graph was not exercised');
          if(JSON.stringify(r.donor.hand_ids)!==JSON.stringify(['fx.growth.branching2d-source-normalize','fx.growth.branching2d-network-build','fx.field.flow-source-normalize','fx.growth.branching2d-flow-guidance-source-normalize','fx.growth.branching2d-flow-guided-curves-build','fx.growth.branching2d-flow-guided-static-svg-realize']))throw new Error('VFX flow-guided branch Hand boundary drifted');
          if(r.caller_authority.explicit_choice!=='branchFlowGuidanceRequest.curvatureScale'||r.caller_authority.caller_requests_mutated!==false||r.caller_authority.retained_growth_field_flow_sources_remain_authoritative!==true||r.caller_authority.guided_curve_set_is_derived_rebuildable_not_canonical!==true||r.caller_authority.donor_svg_is_canonical!==false||r.caller_authority.native_scene_is_canonical!==false||r.caller_authority.consumer_semantics_assigned!==false)throw new Error('flow-guided authority boundary failed');
          if(attempt.guidance_choices.zero.curvatureScale!==0||attempt.guidance_choices.active.curvatureScale!==1.1||attempt.guidance_choices.zero.maxControlOffset!==attempt.guidance_choices.active.maxControlOffset)throw new Error('attempt fixture drifted');

          const bytes={};
          for(const name of ['growth-source','network','field-source','flow-source']){
            const [z,a]=await Promise.all([readFile(base+'zero-'+name+'.json'),readFile(base+'active-'+name+'.json')]);
            if(!z.equals(a))throw new Error(`retained ${name} changed across explicit curvature choice`);
            bytes[name]=sha(z);
          }
          const [zeroGuidanceBytes,activeGuidanceBytes,zeroCurveBytes,activeCurveBytes,zeroSvgBytes,activeSvgBytes,zeroSceneBytes,activeSceneBytes]=await Promise.all([
            readFile(base+'zero-guidance-source.json'),readFile(base+'active-guidance-source.json'),
            readFile(base+'zero-curve-set.json'),readFile(base+'active-curve-set.json'),
            readFile(base+'zero.svg'),readFile(base+'active.svg'),
            readFile(base+'zero.axmscene'),readFile(base+'active.axmscene'),
          ]);
          const zeroGuidance=JSON.parse(zeroGuidanceBytes.toString('utf8'));
          const activeGuidance=JSON.parse(activeGuidanceBytes.toString('utf8'));
          const zeroCurve=JSON.parse(zeroCurveBytes.toString('utf8'));
          const activeCurve=JSON.parse(activeCurveBytes.toString('utf8'));
          if(zeroGuidance.curvatureScale!==0||activeGuidance.curvatureScale!==1.1||zeroGuidance.maxControlOffset!==activeGuidance.maxControlOffset)throw new Error('guidance isolation drifted');
          if(zeroCurve.curveCount!==31||activeCurve.curveCount!==31||zeroCurve.maxOffsetMagnitude!==0||zeroCurve.meanOffsetMagnitude!==0||!(activeCurve.maxOffsetMagnitude>0))throw new Error('zero/active curve-set behavior drifted');
          if(zeroCurve.branchSourceHash!==activeCurve.branchSourceHash||zeroCurve.baseNetworkHash!==activeCurve.baseNetworkHash||zeroCurve.scalarSourceHash!==activeCurve.scalarSourceHash||zeroCurve.flowSourceHash!==activeCurve.flowSourceHash)throw new Error('retained lineage changed across curvature choice');
          let changedControls=0;
          for(let i=0;i<zeroCurve.curves.length;i+=1){
            const z=zeroCurve.curves[i],a=activeCurve.curves[i];
            if(z.segmentId!==a.segmentId||z.parentId!==a.parentId||z.generation!==a.generation||JSON.stringify(z.start)!==JSON.stringify(a.start)||JSON.stringify(z.end)!==JSON.stringify(a.end))throw new Error(`branch topology/endpoints changed at curve ${i}`);
            const midpoint=[Number(((z.start[0]+z.end[0])/2).toFixed(6)),Number(((z.start[1]+z.end[1])/2).toFixed(6))];
            if(JSON.stringify(z.control)!==JSON.stringify(midpoint))throw new Error(`zero-curvature control was not exact midpoint at curve ${i}`);
            if(JSON.stringify(z.control)!==JSON.stringify(a.control))changedControls+=1;
          }
          if(changedControls<1)throw new Error('active curvature changed no derived controls');
          if(zeroSvgBytes.equals(activeSvgBytes)||zeroSceneBytes.equals(activeSceneBytes))throw new Error('derived curvature did not reach both replaceable realizations');
          for(const name of ['zero','active']){
            const row=r.variants[name];
            const curveBytes=name==='zero'?zeroCurveBytes:activeCurveBytes;
            const svgBytes=name==='zero'?zeroSvgBytes:activeSvgBytes;
            const sceneBytes=name==='zero'?zeroSceneBytes:activeSceneBytes;
            if(row.curve_set.bytes_sha256!==sha(curveBytes)||row.donor_svg.bytes_sha256!==sha(svgBytes)||row.native_scene.bytes_sha256!==sha(sceneBytes))throw new Error(`retained byte binding drifted for ${name}`);
            if(row.working_set_budget.exact_curve_count_matches_2048!==true||row.working_set_budget.insufficient_budget_failed_loudly!==true||!row.working_set_budget.insufficient_budget_error.includes('curve budget exceeded'))throw new Error(`curve working-set budget truth gate failed for ${name}`);
            if(row.native_scene.adapter.subdivisions_per_curve!==8||row.native_scene.adapter.output_triangle_count!==496||row.native_scene.adapter.style_is_fixed!==true||row.native_scene.adapter.consumer_semantics_assigned!==false)throw new Error(`native curve adapter truth boundary drifted for ${name}`);
            const scene=parseScene(sceneBytes.toString('utf8'));
            if(scene.triangles.length!==496)throw new Error(`native flow-guided scene triangle count drifted for ${name}`);
          }
          const zeroScene=parseScene(zeroSceneBytes.toString('utf8'));
          const activeScene=parseScene(activeSceneBytes.toString('utf8'));
          if(JSON.stringify(zeroScene.triangles.map(t=>t.albedo))!==JSON.stringify(activeScene.triangles.map(t=>t.albedo)))throw new Error('fixed native observation style drifted');
          if(JSON.stringify(zeroScene.triangles.map(t=>t.vertices))===JSON.stringify(activeScene.triangles.map(t=>t.vertices)))throw new Error('active derived curvature did not change native geometry');
          const evidence={contract:'AXM_CREATIVE_VFX_BRANCH_FLOW_GUIDED_INDEPENDENT_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:donors,retained_identical_sha256:bytes,changed_control_count:changedControls,gates:{caller_authority:'PASS',caller_neutral_repeat:'PASS',retained_growth_network_field_flow_identity:'PASS',zero_curvature_exact_noop:'PASS',active_curvature_derived_only:'PASS',endpoint_topology_preservation:'PASS',sufficient_budget_noncreative:'PASS',insufficient_budget_fails_loudly:'PASS',replaceable_svg_and_native_scene:'PASS',fixed_native_style:'PASS',consumer_semantics_not_assigned:'PASS'}};
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_branch_flow_guided_independent_evidence=PASS');
          console.log(`changed_control_count=${changedControls}`);
          console.log(`zero_curve_set_hash=${r.variants.zero.curve_set.hash}`);
          console.log(`active_curve_set_hash=${r.variants.active.curve_set.hash}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify zero and active curvature observations
        run: |
          base=creative-render/build/vfx-branch-flow-guided-native
          for name in zero active; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 480
          height 270
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind derived curvature to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-branch-flow-guided-native/';
          const receiptBytes=await readFile(base+'branch-flow-guided.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['zero','active']){
            const [scene,request,renderReceipt,frame]=await Promise.all([
              readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')
            ]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
            if(receipt.variants[name].native_scene.bytes_sha256!==renders[name].scene_sha256)throw new Error(`scene identity changed before native rendering: ${name}`);
          }
          const zero=await readFile(base+'zero.ppm');
          const active=await readFile(base+'active.ppm');
          if(zero.length!==active.length)throw new Error('native frame lengths differ unexpectedly');
          let differingBytes=0,totalAbsoluteByteDelta=0,maxByteDelta=0;
          for(let i=0;i<zero.length;i+=1){
            const delta=Math.abs(zero[i]-active[i]);
            if(delta){differingBytes+=1;totalAbsoluteByteDelta+=delta;maxByteDelta=Math.max(maxByteDelta,delta);}
          }
          if(renders.zero.frame_sha256===renders.active.frame_sha256||differingBytes<1)throw new Error('active donor-derived curvature did not reach distinct native frame bytes');
          const evidence={contract:'AXM_CREATIVE_VFX_BRANCH_FLOW_GUIDED_NATIVE_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:{visual_effect_fabric:'d6d30581d5e5eebc56b3df879dc3cd723b5427d0',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},lineage:{branch_source_hash:receipt.variants.zero.growth_source.hash,base_network_hash:receipt.variants.zero.network.hash,scalar_source_hash:receipt.variants.zero.scalar_source.hash,flow_source_hash:receipt.variants.zero.flow_source.hash,zero_guidance_source_hash:receipt.variants.zero.guidance_source.hash,active_guidance_source_hash:receipt.variants.active.guidance_source.hash,zero_curve_set_hash:receipt.variants.zero.curve_set.hash,active_curve_set_hash:receipt.variants.active.curve_set.hash},renders,pixel_byte_difference:{differing_bytes:differingBytes,total_absolute_byte_delta:totalAbsoluteByteDelta,max_byte_delta:maxByteDelta},render_receipt_replay:{zero:'PASS',active:'PASS'},authority:receipt.authority,truth_boundary:receipt.truth_boundary};
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_branch_flow_guided_native_render=PASS');
          console.log(`zero_frame_sha256=${renders.zero.frame_sha256}`);
          console.log(`active_frame_sha256=${renders.active.frame_sha256}`);
          console.log(`differing_frame_bytes=${differingBytes}`);
          NODE

      - name: Upload retained VFX flow-guided branch native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-branch-flow-guided-native-proof
          path: creative-render/build/vfx-branch-flow-guided-native/
          if-no-files-found: warn
