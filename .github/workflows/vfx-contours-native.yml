name: vfx-contours-native

on:
  pull_request:
    paths:
      - 'src/vfx_contours_native_bridge.mjs'
      - 'tests/vfx_contours_native_bridge.test.mjs'
      - '.github/workflows/vfx-contours-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_contours_native_bridge.mjs'
      - 'tests/vfx_contours_native_bridge.test.mjs'
      - '.github/workflows/vfx-contours-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-contours-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: 8262235ae49c6fe575c8cab14a0d05f58b2c2a8b
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained attempt evidence
        run: |
          base=creative-render/build/vfx-contours-native
          mkdir -p "$base"
          cat > "$base/donor-revisions.json" <<'EOF'
          {
            "visual_effect_fabric": "8262235ae49c6fe575c8cab14a0d05f58b2c2a8b",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          EOF
          cat > "$base/attempt-inputs.json" <<'EOF'
          {
            "explicit_choice": "contourRequest.levels",
            "variants": {
              "baseline": [0.35, 0.5, 0.65],
              "shifted": [0.3, 0.55, 0.75]
            },
            "field": {"seed":2468,"frequency":3.25,"octaves":4,"lacunarity":2,"gain":0.5,"offset":[0,0]},
            "derived_working_set": {"columns":48,"rows":32,"levels":3,"cellLevelProbes":4608}
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build retained contour sources, segment sets, SVGs and native scenes
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { observeVisualEffectContoursNative } from './creative-render/src/vfx_contours_native_bridge.mjs';
          const base='creative-render/build/vfx-contours-native/';
          await mkdir(base,{recursive:true});
          const result=await observeVisualEffectContoursNative('visual-effect-fabric',{vfxRevision:'8262235ae49c6fe575c8cab14a0d05f58b2c2a8b'});
          for(const name of ['baseline','shifted']){
            const row=result.variants[name];
            await Promise.all([
              writeFile(base+name+'-field-source.json',row.fieldSourceBytes),
              writeFile(base+name+'-contour-source.json',row.contourSourceBytes),
              writeFile(base+name+'-segment-set.json',row.segmentSetBytes),
              writeFile(base+name+'.svg',row.svgBytes),
              writeFile(base+name+'-state.json',row.stateBytes),
              writeFile(base+name+'.axmscene',row.adapted.bytes),
            ]);
          }
          await writeFile(base+'contours.receipt.json',JSON.stringify(result.receipt,null,2)+'\n');
          console.log('vfx_contours_bridge=PASS');
          console.log(`baseline_segments=${result.variants.baseline.segmentSet.segmentCount}`);
          console.log(`shifted_segments=${result.variants.shifted.segmentSet.segmentCount}`);
          NODE

      - name: Independently assert source authority, contour lineage and budget honesty
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-contours-native/';
          const [receiptBytes,donorBytes,attemptBytes]=await Promise.all([
            readFile(base+'contours.receipt.json'),readFile(base+'donor-revisions.json'),readFile(base+'attempt-inputs.json')
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const donors=JSON.parse(donorBytes.toString('utf8'));
          const attempt=JSON.parse(attemptBytes.toString('utf8'));
          if(donors.visual_effect_fabric!=='8262235ae49c6fe575c8cab14a0d05f58b2c2a8b'||donors.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor revision evidence drifted');
          if(r.contract!=='AXM_CREATIVE_VFX_CONTOURS_NATIVE_RECEIPT'||r.version!==1)throw new Error('contour receipt contract drifted');
          if(r.donor.revision!==donors.visual_effect_fabric||r.donor.graph_id!=='fx.stylize.field-contours2d-static-svg'||r.donor.graph_version!=='0.1.0')throw new Error('current VFX contour graph was not exercised');
          const hands=['fx.field.fbm-source-normalize','fx.stylize.contour2d-source-normalize','fx.stylize.contour2d-segment-set-build','fx.stylize.contour2d-static-svg-realize'];
          if(JSON.stringify(r.donor.hand_ids)!==JSON.stringify(hands))throw new Error('VFX contour Hand boundary drifted');
          if(r.caller_authority.explicit_choice!=='contourRequest.levels'||r.caller_authority.scalar_field_source_held_exactly_constant!==true||r.caller_authority.other_contour_fields_held_constant!==true||r.caller_authority.caller_requests_mutated!==false||r.caller_authority.canonical_field_source_remains_authoritative!==true||r.caller_authority.canonical_contour_source_remains_authoritative!==true||r.caller_authority.segment_sets_are_canonical!==false||r.caller_authority.donor_svg_is_canonical!==false||r.caller_authority.native_scene_is_canonical!==false||r.caller_authority.consumer_semantics_assigned!==false)throw new Error('contour authority boundary failed');
          if(attempt.explicit_choice!==r.caller_authority.explicit_choice||attempt.derived_working_set.cellLevelProbes!==4608)throw new Error('attempt input evidence drifted');

          const rows={};
          for(const name of ['baseline','shifted']){
            const [fieldSourceBytes,contourSourceBytes,segmentSetBytes,svgBytes,sceneBytes]=await Promise.all([
              readFile(base+name+'-field-source.json'),readFile(base+name+'-contour-source.json'),readFile(base+name+'-segment-set.json'),readFile(base+name+'.svg'),readFile(base+name+'.axmscene')
            ]);
            const fieldSource=JSON.parse(fieldSourceBytes.toString('utf8'));
            const contourSource=JSON.parse(contourSourceBytes.toString('utf8'));
            const segmentSet=JSON.parse(segmentSetBytes.toString('utf8'));
            const row=r.variants[name];
            if(row.field_source.bytes_sha256!==sha(fieldSourceBytes)||row.contour_source.bytes_sha256!==sha(contourSourceBytes)||row.segment_set.bytes_sha256!==sha(segmentSetBytes)||row.donor_svg.bytes_sha256!==sha(svgBytes)||row.native_scene.bytes_sha256!==sha(sceneBytes))throw new Error(`retained byte binding drifted for ${name}`);
            if(contourSource.fieldSourceHash!==row.field_source.hash||segmentSet.fieldSourceHash!==row.field_source.hash||segmentSet.sourceHash!==row.contour_source.hash)throw new Error(`contour lineage drifted for ${name}`);
            if(segmentSet.columns!==48||segmentSet.rows!==32||segmentSet.levels.length!==3||segmentSet.cellLevelProbes!==4608||segmentSet.segmentCount<2||segmentSet.derived!==true||segmentSet.rebuildable!==true)throw new Error(`bounded contour segment-set contract drifted for ${name}`);
            if(row.working_set_budget.exact_4608_probes_matches_roomy_65536!==true||row.working_set_budget.exact_segment_count_matches_roomy_32768!==true||row.working_set_budget.insufficient_4607_probes_failed_loudly!==true||!row.working_set_budget.insufficient_probe_error.includes('contour cell-level probe budget exceeded')||row.working_set_budget.insufficient_segment_count_minus_one_failed_loudly!==true||!row.working_set_budget.insufficient_segment_error.includes('contour segment budget exceeded'))throw new Error(`working-set budget truth gate failed for ${name}`);
            if(row.donor_svg.field_source_hash!==row.field_source.hash||row.donor_svg.contour_source_hash!==row.contour_source.hash||row.donor_svg.segment_set_hash!==row.segment_set.hash||row.donor_svg.derived!==true||row.donor_svg.replaceable!==true)throw new Error(`donor SVG lineage drifted for ${name}`);
            if(row.native_scene.adapter.field_source_hash!==row.field_source.hash||row.native_scene.adapter.contour_source_hash!==row.contour_source.hash||row.native_scene.adapter.segment_set_hash!==row.segment_set.hash||row.native_scene.adapter.endpoints_only!==true||row.native_scene.adapter.style_is_fixed!==true||row.native_scene.adapter.consumer_semantics_assigned!==false)throw new Error(`native adapter truth boundary drifted for ${name}`);
            for(let i=0;i<segmentSet.segments.length;i+=1){const s=segmentSet.segments[i];if(s.index!==i||s.level!==segmentSet.levels[s.levelIndex]||!(s.length>0)||s.start.some(v=>v<0||v>1)||s.end.some(v=>v<0||v>1))throw new Error(`derived contour segment identity drifted for ${name} at ${i}`);}
            const scene=parseScene(sceneBytes.toString('utf8'));
            if(scene.triangles.length!==segmentSet.segmentCount*2)throw new Error(`native contour scene triangle count drifted for ${name}`);
            if(scene.triangles.some(t=>JSON.stringify(t.albedo)!==JSON.stringify([238,238,238])))throw new Error(`fixed native contour style drifted for ${name}`);
            rows[name]={fieldSource,contourSource,segmentSet};
          }
          if(r.variants.baseline.field_source.hash!==r.variants.shifted.field_source.hash)throw new Error('contour level choice rewrote canonical scalar-field identity');
          const stripLevels=source=>{const copy=structuredClone(source);delete copy.levels;return copy;};
          if(JSON.stringify(stripLevels(rows.baseline.contourSource))!==JSON.stringify(stripLevels(rows.shifted.contourSource)))throw new Error('retained contour fields beyond levels changed');
          if(JSON.stringify(rows.baseline.contourSource.levels)===JSON.stringify(rows.shifted.contourSource.levels))throw new Error('explicit contour levels collapsed');
          if(r.comparison.contour_source_hashes_differ!==true||r.comparison.segment_set_hashes_differ!==true||r.comparison.native_scene_bytes_differ!==true||r.comparison.fixed_native_style!==true)throw new Error('contour comparison evidence drifted');
          if(r.replaceability.same_derived_segment_set_can_feed_donor_svg_and_native_scene_realizations!==true||r.replaceability.donor_svg_and_native_scene_do_not_rewrite_field_or_contour_truth!==true)throw new Error('replaceability boundary drifted');
          const evidence={contract:'AXM_CREATIVE_VFX_CONTOURS_INDEPENDENT_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:donors,segment_counts:{baseline:rows.baseline.segmentSet.segmentCount,shifted:rows.shifted.segmentSet.segmentCount},gates:{caller_source_authority:'PASS',caller_neutral_repeat:'PASS',scalar_field_exactly_retained:'PASS',explicit_contour_levels:'PASS',sufficient_budgets_noncreative:'PASS',insufficient_budgets_fail_loudly:'PASS',derived_segment_lineage:'PASS',replaceable_svg_and_native_realizations:'PASS',fixed_native_style:'PASS',consumer_semantics_not_assigned:'PASS'}};
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_contours_independent_evidence=PASS');
          console.log(`baseline_segment_count=${rows.baseline.segmentSet.segmentCount}`);
          console.log(`shifted_segment_count=${rows.shifted.segmentSet.segmentCount}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify both contour observations
        run: |
          base=creative-render/build/vfx-contours-native
          for name in baseline shifted; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind derived contour segment sets to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-contours-native/';
          const receiptBytes=await readFile(base+'contours.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['baseline','shifted']){
            const [scene,request,renderReceipt,frame]=await Promise.all([readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
            if(receipt.variants[name].native_scene.bytes_sha256!==renders[name].scene_sha256)throw new Error(`scene identity changed before native rendering: ${name}`);
          }
          if(renders.baseline.frame_sha256===renders.shifted.frame_sha256)throw new Error('explicit contour-level choice did not reach distinct native frame bytes');
          const evidence={contract:'AXM_CREATIVE_VFX_CONTOURS_NATIVE_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:{visual_effect_fabric:'8262235ae49c6fe575c8cab14a0d05f58b2c2a8b',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},field_source_hash:receipt.variants.baseline.field_source.hash,contour_source_hashes:{baseline:receipt.variants.baseline.contour_source.hash,shifted:receipt.variants.shifted.contour_source.hash},segment_set_hashes:{baseline:receipt.variants.baseline.segment_set.hash,shifted:receipt.variants.shifted.segment_set.hash},segment_counts:{baseline:receipt.variants.baseline.segment_set.segment_count,shifted:receipt.variants.shifted.segment_set.segment_count},renders,render_receipt_replay:{baseline:'PASS',shifted:'PASS'},authority:receipt.authority,truth_boundary:receipt.truth_boundary};
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_contours_native_render=PASS');
          console.log(`baseline_frame_sha256=${renders.baseline.frame_sha256}`);
          console.log(`shifted_frame_sha256=${renders.shifted.frame_sha256}`);
          NODE

      - name: Upload retained contour proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-contours-native-proof
          path: creative-render/build/vfx-contours-native
          if-no-files-found: warn
          retention-days: 30
