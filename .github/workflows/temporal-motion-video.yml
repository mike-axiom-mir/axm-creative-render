name: temporal-motion-video

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: temporal-motion-video-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-temporal-motion-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned Universal Creation donor with frame finishing
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 026f4f5d0e669627639f404945147c9dedb48ff2
          path: universal-creation

      - name: Checkout pinned Render Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Checkout pinned FrameState donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-framestate
          ref: 41c9c6827e64613b523b28536ab864dddf046d93
          path: framestate

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install explicit FFmpeg assembly boundary
        run: |
          set -euo pipefail
          mkdir -p creative-render/build
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          {
            echo "resolved_executable=$(readlink -f "$(command -v ffmpeg)")"
            echo "package_version=$(dpkg-query -W -f='${Version}' ffmpeg)"
            ffmpeg -version | head -n 1
          } | tee creative-render/build/temporal-motion-ffmpeg-environment.txt

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Sample close Universal Creation animation states
        run: |
          node creative-render/src/temporal_cli.mjs sample \
            --uc-root universal-creation \
            --out-dir creative-render/build/temporal-motion-source \
            --receipt creative-render/build/temporal-motion-source/temporal.receipt.json \
            --times 0,0.25,0.5

      - name: Build and test Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and verify motion source 000
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-motion-source/frame-000.axmrender --receipt creative-render/build/temporal-motion-source/frame-000.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-motion-source/frame-000.axmrender creative-render/build/temporal-motion-source/frame-000.axmreceipt

      - name: Render and verify motion source 001
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-motion-source/frame-001.axmrender --receipt creative-render/build/temporal-motion-source/frame-001.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-motion-source/frame-001.axmrender creative-render/build/temporal-motion-source/frame-001.axmreceipt

      - name: Render and verify motion source 002
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-motion-source/frame-002.axmrender --receipt creative-render/build/temporal-motion-source/frame-002.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-motion-source/frame-002.axmrender creative-render/build/temporal-motion-source/frame-002.axmreceipt

      - name: Infer translation, stabilize and finish through Universal Creation Creative Flow
        run: |
          node creative-render/src/temporal_motion_cli.mjs apply \
            --uc-root universal-creation \
            --frames creative-render/build/temporal-motion-source/frame-000.ppm,creative-render/build/temporal-motion-source/frame-001.ppm,creative-render/build/temporal-motion-source/frame-002.ppm \
            --out-dir creative-render/build/temporal-motion \
            --receipt creative-render/build/temporal-motion.receipt.json \
            --search-radius 16 \
            --trail-window 3 \
            --decay 0.65

      - name: Assert bounded motion evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const receipt = JSON.parse(await readFile('creative-render/build/temporal-motion.receipt.json','utf8'));
          const o = receipt.observation;
          if (o.hand_count !== 501 || o.recipe_count !== 508) throw new Error('pinned Universal Creation capability census drifted');
          if (o.repeat_verification !== 'PASS') throw new Error('temporal motion repeat gate failed');
          if (!(o.nonzero_track_count >= 1)) throw new Error('expected at least one non-zero translation track');
          if (!(o.strictly_improved_track_count >= 1)) throw new Error('expected at least one tracked region to improve after stabilization');
          const required = new Set(['creative.frame-finish.block-match-track','creative.frame-finish.stabilize-translation','creative.frame-finish.difference-frame','creative.frame-finish.motion-trail']);
          for (const id of required) if (!o.operation_ids.includes(id)) throw new Error(`missing executed operation ${id}`);
          for (const row of o.motion.slice(1)) {
            if (Math.abs(row.dx) > o.policy.searchRadius || Math.abs(row.dy) > o.policy.searchRadius) throw new Error('track escaped declared radius');
            console.log(`motion_${row.index}=dx:${row.dx},dy:${row.dy},pre:${row.pre_region_mse},post:${row.post_region_mse}`);
          }
          console.log('bounded_temporal_motion=PASS');
          NODE

      - name: Build FrameState project from exact tracked and finished frames
        run: |
          node creative-render/src/framestate_bridge_cli.mjs build \
            --machine-root . \
            --frames creative-render/build/temporal-motion/finished/frame-000.ppm,creative-render/build/temporal-motion/finished/frame-001.ppm,creative-render/build/temporal-motion/finished/frame-002.ppm \
            --project creative-render/build/temporal-motion-project.json \
            --receipt creative-render/build/temporal-motion-project.receipt.json \
            --fps 12 \
            --hold-frames 4 \
            --project-id axm-creative-render-temporal-motion-proof

      - name: FrameState canonical admission
        run: |
          PYTHONPATH=framestate/src python -m axm_framestate inspect creative-render/build/temporal-motion-project.json > creative-render/build/temporal-motion-inspect.json

      - name: Render and assemble tracked FrameState video
        run: |
          set +e
          PYTHONPATH=framestate/src python -m axm_framestate render \
            creative-render/build/temporal-motion-project.json \
            creative-render/build/temporal-motion-render \
            --profile fast \
            > creative-render/build/temporal-motion-render-output.json \
            2> creative-render/build/temporal-motion-render-stderr.txt
          rc=$?
          set -e
          echo "$rc" > creative-render/build/temporal-motion-render-returncode.txt
          {
            echo "returncode=$rc"
            echo "--- stderr ---"
            cat creative-render/build/temporal-motion-render-stderr.txt || true
            echo "--- produced files ---"
            find creative-render/build/temporal-motion-render -maxdepth 3 -type f -printf '%P %s bytes\n' 2>/dev/null | sort || true
          } | tee creative-render/build/temporal-motion-render-diagnostic.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          test -s creative-render/build/temporal-motion-render/video.mp4
          test -s creative-render/build/temporal-motion-render/render-receipt.json

      - name: Upload temporal motion diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-temporal-motion-failure
          path: |
            creative-render/build/temporal-motion.receipt.json
            creative-render/build/temporal-motion-project.json
            creative-render/build/temporal-motion-project.receipt.json
            creative-render/build/temporal-motion-render-output.json
            creative-render/build/temporal-motion-render-stderr.txt
            creative-render/build/temporal-motion-render-returncode.txt
            creative-render/build/temporal-motion-render-diagnostic.txt

      - name: FrameState deterministic repeat verification
        run: |
          PYTHONPATH=framestate/src python -m axm_framestate verify-repeat \
            creative-render/build/temporal-motion-project.json \
            creative-render/build/temporal-motion-repeat > creative-render/build/temporal-motion-repeat.json

      - name: FrameState read-only caller-pinned render verification
        run: |
          receipt_digest="$(python -c "import json; print(json.load(open('creative-render/build/temporal-motion-render/render-receipt.json'))['receipt_digest'])")"
          project_digest="$(python -c "import json; print(json.load(open('creative-render/build/temporal-motion-render/render-receipt.json'))['project_digest'])")"
          PYTHONPATH=framestate/src python -m axm_framestate verify-render \
            creative-render/build/temporal-motion-render \
            --receipt-digest "$receipt_digest" \
            --project-digest "$project_digest" > creative-render/build/temporal-motion-verify-render.json

      - name: Bind FrameState video evidence
        run: |
          node creative-render/src/framestate_video_verify.mjs \
            --bridge-receipt creative-render/build/temporal-motion-project.receipt.json \
            --project creative-render/build/temporal-motion-project.json \
            --render-receipt creative-render/build/temporal-motion-render/render-receipt.json \
            --repeat creative-render/build/temporal-motion-repeat.json \
            --verify-render creative-render/build/temporal-motion-verify-render.json \
            --video creative-render/build/temporal-motion-render/video.mp4 \
            --ffmpeg-evidence creative-render/build/temporal-motion-ffmpeg-environment.txt \
            --out creative-render/build/temporal-motion-framestate-video-evidence.json

      - name: Bind tracking provenance into final video evidence
        run: |
          node creative-render/src/temporal_motion_video_verify.mjs \
            --motion-receipt creative-render/build/temporal-motion.receipt.json \
            --bridge-receipt creative-render/build/temporal-motion-project.receipt.json \
            --video-evidence creative-render/build/temporal-motion-framestate-video-evidence.json \
            --out creative-render/build/temporal-motion-video-evidence.json

      - name: Assert bounded motion video result
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const e = JSON.parse(await readFile('creative-render/build/temporal-motion-video-evidence.json','utf8'));
          if (e.contract !== 'AXM_CREATIVE_TEMPORAL_MOTION_VIDEO_EVIDENCE' || e.version !== 1) throw new Error('combined evidence contract drifted');
          if (e.source_frame_count !== 3 || e.realized_frame_count !== 12) throw new Error('bounded frame counts drifted');
          if (e.fps !== 12 || e.duration_seconds !== 1) throw new Error('bounded timing drifted');
          if (e.universal_creation_hand_count !== 501 || e.universal_creation_recipe_count !== 508) throw new Error('pinned UC census drifted');
          if (!(e.nonzero_track_count >= 1) || !(e.strictly_improved_track_count >= 1)) throw new Error('motion proof lost required bounded evidence');
          if (e.framestate_authority !== 'EVIDENCE_ADMISSION_ONLY') throw new Error('FrameState authority boundary drifted');
          if (!(e.video_bytes > 0)) throw new Error('motion video is empty');
          console.log('temporal_motion_video=PASS');
          console.log(`video_sha256=${e.video_sha256}`);
          console.log(`nonzero_track_count=${e.nonzero_track_count}`);
          console.log(`strictly_improved_track_count=${e.strictly_improved_track_count}`);
          NODE

      - name: Upload complete temporal motion video proof
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-temporal-motion-video-proof
          path: |
            creative-render/build/temporal-motion-source/
            creative-render/build/temporal-motion/
            creative-render/build/temporal-motion.receipt.json
            creative-render/build/temporal-motion-project.json
            creative-render/build/temporal-motion-project.receipt.json
            creative-render/build/temporal-motion-inspect.json
            creative-render/build/temporal-motion-render/
            creative-render/build/temporal-motion-repeat.json
            creative-render/build/temporal-motion-verify-render.json
            creative-render/build/temporal-motion-framestate-video-evidence.json
            creative-render/build/temporal-motion-video-evidence.json
            creative-render/build/temporal-motion-ffmpeg-environment.txt
