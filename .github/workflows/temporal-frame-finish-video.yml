name: temporal-frame-finish-video

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: temporal-frame-finish-video-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-temporal-frame-finish-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned Universal Creation donor with frame finishing
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 026f4f5d0e669627639f404945147c9dedb48ff2
          path: universal-creation

      - name: Checkout pinned Render Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Checkout pinned FrameState donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-framestate
          ref: 41c9c6827e64613b523b28536ab864dddf046d93
          path: framestate

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install explicit FFmpeg assembly boundary
        run: |
          set -euo pipefail
          mkdir -p creative-render/build
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          {
            echo "resolved_executable=$(readlink -f "$(command -v ffmpeg)")"
            echo "package_version=$(dpkg-query -W -f='${Version}' ffmpeg)"
            ffmpeg -version | head -n 1
          } | tee creative-render/build/temporal-finish-ffmpeg-environment.txt

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Sample Universal Creation animation into exact renderer requests
        run: |
          node creative-render/src/temporal_cli.mjs sample \
            --uc-root universal-creation \
            --out-dir creative-render/build/temporal-finish-source \
            --receipt creative-render/build/temporal-finish-source/temporal.receipt.json \
            --times 0,1,2

      - name: Build and test Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and verify source frame 000
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-finish-source/frame-000.axmrender --receipt creative-render/build/temporal-finish-source/frame-000.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-finish-source/frame-000.axmrender creative-render/build/temporal-finish-source/frame-000.axmreceipt

      - name: Render and verify source frame 001
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-finish-source/frame-001.axmrender --receipt creative-render/build/temporal-finish-source/frame-001.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-finish-source/frame-001.axmrender creative-render/build/temporal-finish-source/frame-001.axmreceipt

      - name: Render and verify source frame 002
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-finish-source/frame-002.axmrender --receipt creative-render/build/temporal-finish-source/frame-002.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-finish-source/frame-002.axmrender creative-render/build/temporal-finish-source/frame-002.axmreceipt

      - name: Apply Universal Creation frame finishing through Creative Flow
        run: |
          node creative-render/src/temporal_finish_cli.mjs apply \
            --uc-root universal-creation \
            --frames creative-render/build/temporal-finish-source/frame-000.ppm,creative-render/build/temporal-finish-source/frame-001.ppm,creative-render/build/temporal-finish-source/frame-002.ppm \
            --out-dir creative-render/build/temporal-finished \
            --receipt creative-render/build/temporal-finish.receipt.json \
            --window 3 \
            --decay 0.65

      - name: Assert pinned Wave 12 finishing surface
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const receipt = JSON.parse(await readFile('creative-render/build/temporal-finish.receipt.json','utf8'));
          const o = receipt.observation;
          if (o.hand_count !== 501) throw new Error(`expected 501 executable Hands at the pinned donor, got ${o.hand_count}`);
          if (o.recipe_count !== 508) throw new Error(`expected 508 callable recipes at the pinned donor, got ${o.recipe_count}`);
          if (o.finishing_hand_id !== 'creative.frame-finish.motion-trail') throw new Error('wrong finishing hand');
          if (o.repeat_verification !== 'PASS') throw new Error('temporal finishing repeat gate failed');
          if (!(o.changed_frame_count >= 1)) throw new Error('temporal finishing did not change any rendered frame bytes');
          if (!o.operation_ids.every((id) => id === 'creative.frame-finish.motion-trail')) throw new Error('unexpected operation entered finishing flow');
          console.log('wave12_temporal_finish=PASS');
          console.log(`changed_frame_count=${o.changed_frame_count}`);
          NODE

      - name: Build FrameState project from exact finished PPMs
        run: |
          node creative-render/src/framestate_bridge_cli.mjs build \
            --machine-root . \
            --frames creative-render/build/temporal-finished/frame-000.ppm,creative-render/build/temporal-finished/frame-001.ppm,creative-render/build/temporal-finished/frame-002.ppm \
            --project creative-render/build/temporal-finished-project.json \
            --receipt creative-render/build/temporal-finished-project.receipt.json \
            --fps 12 \
            --hold-frames 4 \
            --project-id axm-creative-render-temporal-finish-proof

      - name: FrameState canonical admission
        run: |
          PYTHONPATH=framestate/src python -m axm_framestate inspect creative-render/build/temporal-finished-project.json > creative-render/build/temporal-finished-inspect.json

      - name: Render and assemble finished FrameState video
        run: |
          set +e
          PYTHONPATH=framestate/src python -m axm_framestate render \
            creative-render/build/temporal-finished-project.json \
            creative-render/build/temporal-finished-render \
            --profile fast \
            > creative-render/build/temporal-finished-render-output.json \
            2> creative-render/build/temporal-finished-render-stderr.txt
          rc=$?
          set -e
          echo "$rc" > creative-render/build/temporal-finished-render-returncode.txt
          {
            echo "returncode=$rc"
            echo "--- stderr ---"
            cat creative-render/build/temporal-finished-render-stderr.txt || true
            echo "--- produced files ---"
            find creative-render/build/temporal-finished-render -maxdepth 3 -type f -printf '%P %s bytes\n' 2>/dev/null | sort || true
          } | tee creative-render/build/temporal-finished-render-diagnostic.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          test -s creative-render/build/temporal-finished-render/video.mp4
          test -s creative-render/build/temporal-finished-render/render-receipt.json

      - name: Upload finished render diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-temporal-finish-failure
          path: |
            creative-render/build/temporal-finish.receipt.json
            creative-render/build/temporal-finished-project.json
            creative-render/build/temporal-finished-project.receipt.json
            creative-render/build/temporal-finished-render-output.json
            creative-render/build/temporal-finished-render-stderr.txt
            creative-render/build/temporal-finished-render-returncode.txt
            creative-render/build/temporal-finished-render-diagnostic.txt

      - name: FrameState deterministic repeat verification
        run: |
          PYTHONPATH=framestate/src python -m axm_framestate verify-repeat \
            creative-render/build/temporal-finished-project.json \
            creative-render/build/temporal-finished-repeat > creative-render/build/temporal-finished-repeat.json

      - name: FrameState read-only caller-pinned render verification
        run: |
          receipt_digest="$(python -c "import json; print(json.load(open('creative-render/build/temporal-finished-render/render-receipt.json'))['receipt_digest'])")"
          project_digest="$(python -c "import json; print(json.load(open('creative-render/build/temporal-finished-render/render-receipt.json'))['project_digest'])")"
          PYTHONPATH=framestate/src python -m axm_framestate verify-render \
            creative-render/build/temporal-finished-render \
            --receipt-digest "$receipt_digest" \
            --project-digest "$project_digest" > creative-render/build/temporal-finished-verify-render.json

      - name: Bind FrameState video evidence
        run: |
          node creative-render/src/framestate_video_verify.mjs \
            --bridge-receipt creative-render/build/temporal-finished-project.receipt.json \
            --project creative-render/build/temporal-finished-project.json \
            --render-receipt creative-render/build/temporal-finished-render/render-receipt.json \
            --repeat creative-render/build/temporal-finished-repeat.json \
            --verify-render creative-render/build/temporal-finished-verify-render.json \
            --video creative-render/build/temporal-finished-render/video.mp4 \
            --ffmpeg-evidence creative-render/build/temporal-finish-ffmpeg-environment.txt \
            --out creative-render/build/temporal-finished-video-evidence.json

      - name: Bind finishing provenance into final video evidence
        run: |
          node creative-render/src/temporal_finish_video_verify.mjs \
            --finish-receipt creative-render/build/temporal-finish.receipt.json \
            --bridge-receipt creative-render/build/temporal-finished-project.receipt.json \
            --video-evidence creative-render/build/temporal-finished-video-evidence.json \
            --out creative-render/build/temporal-finish-video-evidence.json

      - name: Assert bounded finished video result
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const e = JSON.parse(await readFile('creative-render/build/temporal-finish-video-evidence.json','utf8'));
          if (e.contract !== 'AXM_CREATIVE_TEMPORAL_FINISH_VIDEO_EVIDENCE' || e.version !== 1) throw new Error('combined evidence contract drifted');
          if (e.source_frame_count !== 3 || e.realized_frame_count !== 12) throw new Error('bounded frame counts drifted');
          if (e.fps !== 12 || e.duration_seconds !== 1) throw new Error('bounded video timing drifted');
          if (e.universal_creation_hand_count !== 501 || e.universal_creation_recipe_count !== 508) throw new Error('pinned UC capability census drifted');
          if (e.framestate_authority !== 'EVIDENCE_ADMISSION_ONLY') throw new Error('FrameState authority boundary drifted');
          if (!(e.video_bytes > 0)) throw new Error('finished video is empty');
          console.log('temporal_frame_finish_video=PASS');
          console.log(`video_sha256=${e.video_sha256}`);
          console.log(`changed_frame_count=${e.changed_frame_count}`);
          NODE

      - name: Upload complete temporal finishing video proof
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-temporal-finish-video-proof
          path: |
            creative-render/build/temporal-finish-source/
            creative-render/build/temporal-finished/
            creative-render/build/temporal-finish.receipt.json
            creative-render/build/temporal-finished-project.json
            creative-render/build/temporal-finished-project.receipt.json
            creative-render/build/temporal-finished-inspect.json
            creative-render/build/temporal-finished-render/
            creative-render/build/temporal-finished-repeat.json
            creative-render/build/temporal-finished-verify-render.json
            creative-render/build/temporal-finished-video-evidence.json
            creative-render/build/temporal-finish-video-evidence.json
            creative-render/build/temporal-finish-ffmpeg-environment.txt
