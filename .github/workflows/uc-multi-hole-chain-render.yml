name: uc-multi-hole-chain-render

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: uc-multi-hole-chain-render-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-uc-multi-hole-chain-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Universal Creation
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: e63274d1b0f4f095bef130dac474fe43a0deb090
          path: universal-creation

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare retained proof directory
        run: mkdir -p creative-render/build/uc-multi-hole-chain

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current Universal Creation multi-hole fabrication tests
        run: python universal-creation/tests/test_mesh_hole_fabrication_chain.py

      - name: Build root stock, two-hole stage, then hash-linked resumed third-hole stage through real UC public route
        run: |
          python <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import sys
          from pathlib import Path

          ROOT=Path('universal-creation').resolve()
          sys.path.insert(0,str(ROOT/'src'))
          from axm_uc.machine import UniversalCreationMachine
          from axm_uc.mesh_hole_fabrication_chain import build_hole_fabrication_chain
          from axm_uc.precision_cutter import build_cut
          from axm_uc.procedural_3d import publish_glb,verify_glb

          OUT=Path('creative-render/build/uc-multi-hole-chain').resolve(); OUT.mkdir(parents=True,exist_ok=True)
          root_path=OUT/'root.glb'; one_path=OUT/'stage-one.glb'; two_path=OUT/'stage-two.glb'
          one_receipt=OUT/'stage-one.lineage.json'; two_receipt=OUT/'stage-two.lineage.json'
          material={'color':'#527A91FF','metallic':0.35,'roughness':0.42}
          stock=build_cut({'schema':'axm.precision-cutter/v0.1','name':'Creative Render chain root','operation':'profile-cut','thickness':0.6,'material':material,'profile':[[-.7,-.5],[.7,-.5],[.7,.5],[-.7,.5]]})
          source_surface=stock['surface_specification']
          publication=publish_glb(root_path,source_surface)
          root_bytes=root_path.read_bytes(); root_sha=hashlib.sha256(root_bytes).hexdigest()
          if publication['sha256']!=root_sha or not verify_glb(root_bytes)['passed']: raise RuntimeError('root GLB publication/validation drifted')

          def hole(hid,center,radius,segments):
              return {'id':hid,'center':list(center),'radius':radius,'segments':segments,'kerf':0.02}
          def spec(name,holes):
              # Render Fabric's fixed reference camera projects X/Y and uses Z only for depth.
              # Select the root's Z fabrication axis so the hole cross-sections are observable in
              # this proof view; this is evidence design, not a claim of general camera coverage.
              return {'schema':'axm.mesh-hole-fabrication-chain/v0.5','name':name,'axis_vector':[0.0,0.0,1.0],'holes':holes}

          stage_one_spec=spec('Creative Render two-hole stage',[
              hole('left',(-.40,-.08,0.0),.08,18),
              hole('right',(.40,.08,0.0),.09,24),
          ])
          direct_one=build_hole_fabrication_chain(root_path,stage_one_spec,expected_source_sha256=root_sha)
          machine=UniversalCreationMachine(ROOT)
          first=machine.create({'kind':'mesh-laser-hole-chain','inputs':{'source_path':str(root_path),'path':str(one_path),'receipt_path':str(one_receipt),'expected_source_sha256':root_sha,'specification':stage_one_spec}})
          if first.get('type')!='CREATION_RESULT': raise RuntimeError(f'UC stage one failed: {first!r}')
          one=first['result']
          if one['truth_status']!='VALIDATED_HASH_LINKED_MULTI_HOLE_FABRICATION_CHAIN': raise RuntimeError('stage one truth status drifted')
          one_bytes=one_path.read_bytes(); one_sha=hashlib.sha256(one_bytes).hexdigest()
          if one['sha256']!=one_sha or direct_one['predicted_glb_sha256']!=one_sha or not verify_glb(one_bytes)['passed']: raise RuntimeError('stage-one public/direct publication identity drifted')
          if root_path.read_bytes()!=root_bytes or not one['source_unchanged_after_publication']: raise RuntimeError('stage one mutated root source')
          one_lineage_bytes=one_receipt.read_bytes(); one_lineage=json.loads(one_lineage_bytes)
          if one_lineage['lineage_sha256']!=one['lineage_sha256'] or len(one_lineage['holes'])!=2 or len(one_lineage['steps'])!=2: raise RuntimeError('stage-one lineage receipt drifted')

          stage_two_spec=spec('Creative Render resumed three-hole stage',[hole('middle',(0.0,.15,0.0),.07,16)])
          direct_two_a=build_hole_fabrication_chain(one_path,stage_two_spec,lineage_path=one_receipt,expected_source_sha256=one_sha,expected_lineage_sha256=one['lineage_sha256'])
          direct_two_b=build_hole_fabrication_chain(one_path,stage_two_spec,lineage_path=one_receipt,expected_source_sha256=one_sha,expected_lineage_sha256=one['lineage_sha256'])
          if direct_two_a['surface_specification']!=direct_two_b['surface_specification'] or direct_two_a['lineage']!=direct_two_b['lineage']: raise RuntimeError('same resumed hole-chain request did not repeat identically')
          second=machine.create({'kind':'mesh-laser-hole-chain','inputs':{'source_path':str(one_path),'lineage_path':str(one_receipt),'expected_lineage_sha256':one['lineage_sha256'],'expected_source_sha256':one_sha,'path':str(two_path),'receipt_path':str(two_receipt),'specification':stage_two_spec}})
          if second.get('type')!='CREATION_RESULT': raise RuntimeError(f'UC stage two failed: {second!r}')
          two=second['result']; two_bytes=two_path.read_bytes(); two_sha=hashlib.sha256(two_bytes).hexdigest()
          if two['truth_status']!='VALIDATED_HASH_LINKED_MULTI_HOLE_FABRICATION_CHAIN': raise RuntimeError('stage two truth status drifted')
          if two['sha256']!=two_sha or direct_two_a['predicted_glb_sha256']!=two_sha or not verify_glb(two_bytes)['passed']: raise RuntimeError('stage-two public/direct publication identity drifted')
          if one_path.read_bytes()!=one_bytes or root_path.read_bytes()!=root_bytes: raise RuntimeError('resume mutated root or stage-one source')
          if two['parent_lineage_sha256']!=one['lineage_sha256'] or two['cumulative_hole_count']!=3: raise RuntimeError('stage-two parent/count continuity drifted')
          two_lineage_bytes=two_receipt.read_bytes(); two_lineage=json.loads(two_lineage_bytes)
          if two_lineage['lineage_sha256']!=two['lineage_sha256'] or two_lineage['parent_lineage_sha256']!=one['lineage_sha256']: raise RuntimeError('stage-two lineage parent drifted')
          if two_lineage['holes'][:2]!=one_lineage['holes'] or two_lineage['steps'][:2]!=one_lineage['steps']: raise RuntimeError('resume rewrote prior hole receipts or hash-linked steps')
          truth=two_lineage['truth_boundary']
          if truth['previous_output_recompiled_before_resume'] is not True or truth['inner_hole_boundaries_stable_when_new_holes_are_appended'] is not True or truth['hash_linked_append_only_steps'] is not True: raise RuntimeError('resume continuity truth boundary drifted')
          if one['output_topology']['status']!='CLOSED_ORIENTED_EDGE_MANIFOLD_CANDIDATE' or two['output_topology']['status']!='CLOSED_ORIENTED_EDGE_MANIFOLD_CANDIDATE': raise RuntimeError('chain topology gate failed')

          bundle={
            'contract':'AXM_UC_MULTI_HOLE_CHAIN_DONOR_BUNDLE','version':1,
            'donor':{'repository':'mike-axiom-mir/axm-universal-creation','revision':'e63274d1b0f4f095bef130dac474fe43a0deb090','public_route':'mesh-laser-hole-chain','capability_version':'0.5.0'},
            'source':{'glb_sha256':root_sha,'glb_bytes':len(root_bytes),'unchanged_after_all_stages':root_path.read_bytes()==root_bytes,'surface':source_surface},
            'stage_one':{'truth_status':one['truth_status'],'source_sha256':root_sha,'glb_sha256':one_sha,'glb_bytes':len(one_bytes),'lineage_sha256':one['lineage_sha256'],'lineage_receipt_sha256':hashlib.sha256(one_lineage_bytes).hexdigest(),'cumulative_hole_count':one['cumulative_hole_count'],'partition_axis':one['partition_axis'],'geometry':one['geometry'],'glb_validation_passed':one['glb_validation']['passed'],'lineage':one_lineage,'surface':direct_one['surface_specification']},
            'stage_two':{'truth_status':two['truth_status'],'source_sha256':one_sha,'glb_sha256':two_sha,'glb_bytes':len(two_bytes),'lineage_sha256':two['lineage_sha256'],'parent_lineage_sha256':two['parent_lineage_sha256'],'lineage_receipt_sha256':hashlib.sha256(two_lineage_bytes).hexdigest(),'cumulative_hole_count':two['cumulative_hole_count'],'partition_axis':two['partition_axis'],'geometry':two['geometry'],'glb_validation_passed':two['glb_validation']['passed'],'lineage':two_lineage,'surface':direct_two_a['surface_specification']},
          }
          (OUT/'donor-bundle.json').write_text(json.dumps(bundle,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('uc_multi_hole_public_route=PASS')
          print(f'root_glb_sha256={root_sha}')
          print(f'stage_one_glb_sha256={one_sha}')
          print(f'stage_two_glb_sha256={two_sha}')
          print(f'stage_one_lineage_sha256={one["lineage_sha256"]}')
          print(f'stage_two_lineage_sha256={two["lineage_sha256"]}')
          print(f'partition_axes={one["partition_axis"]},{two["partition_axis"]}')
          print(f'triangles={direct_one["geometry"]["triangles"]},{direct_two_a["geometry"]["triangles"]}')
          PY

      - name: Adapt root and both exact cumulative UC surfaces into renderer-neutral scenes
        run: |
          node creative-render/src/uc_multi_hole_chain_cli.mjs build \
            --uc-root universal-creation \
            --donor-bundle creative-render/build/uc-multi-hole-chain/donor-bundle.json \
            --source-scene creative-render/build/uc-multi-hole-chain/source.axmscene \
            --stage-one-scene creative-render/build/uc-multi-hole-chain/stage-one.axmscene \
            --stage-two-scene creative-render/build/uc-multi-hole-chain/stage-two.axmscene \
            --evidence creative-render/build/uc-multi-hole-chain/scene-evidence.json

      - name: Assert exact append-only lineage, source authority, and adapter continuity
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises'; import {createHash} from 'node:crypto';
          import {parseScene} from './creative-render/src/creative_scene_operator.mjs';
          const sha=b=>createHash('sha256').update(b).digest('hex'),base='creative-render/build/uc-multi-hole-chain/';
          const [bundleBytes,evidenceBytes,sourceBytes,oneBytes,twoBytes]=await Promise.all([readFile(base+'donor-bundle.json'),readFile(base+'scene-evidence.json'),readFile(base+'source.axmscene'),readFile(base+'stage-one.axmscene'),readFile(base+'stage-two.axmscene')]);
          const b=JSON.parse(bundleBytes),e=JSON.parse(evidenceBytes);
          if(e.contract!=='AXM_CREATIVE_UC_MULTI_HOLE_CHAIN_SCENE_EVIDENCE'||e.version!==1)throw new Error('scene evidence contract drifted');
          if(e.observation.donor.donor_revision!=='e63274d1b0f4f095bef130dac474fe43a0deb090')throw new Error('UC donor revision drifted');
          if(e.inputs.donor_bundle.sha256!==sha(bundleBytes))throw new Error('donor bundle bytes are not bound');
          for(const [name,bytes] of [['source',sourceBytes],['stage_one',oneBytes],['stage_two',twoBytes]])if(e.outputs[`${name}_scene`].sha256!==sha(bytes))throw new Error(`${name} scene bytes are not bound`);
          if(new Set([sha(sourceBytes),sha(oneBytes),sha(twoBytes)]).size!==3)throw new Error('three fabrication scene states are not distinct');
          if(e.observation.source_preserved!==true||b.source.unchanged_after_all_stages!==true)throw new Error('root source authority drifted');
          if(e.observation.same_adapter_albedo!==true)throw new Error('adapter albedo changed between stages');
          if(b.stage_two.lineage.holes.slice(0,2).some((h,i)=>JSON.stringify(h)!==JSON.stringify(b.stage_one.lineage.holes[i])))throw new Error('retained hole receipt changed across resume');
          if(b.stage_two.parent_lineage_sha256!==b.stage_one.lineage_sha256)throw new Error('hash-linked parent lineage drifted');
          if(b.stage_two.lineage.truth_boundary.previous_output_recompiled_before_resume!==true)throw new Error('prior state was not proven rebuilt before resume');
          const counts=[sourceBytes,oneBytes,twoBytes].map(bytes=>parseScene(bytes.toString('utf8')).triangles.length);
          if(JSON.stringify(counts)!==JSON.stringify([e.observation.donor.root_triangles,e.observation.donor.stage_one_triangles,e.observation.donor.stage_two_triangles]))throw new Error('scene triangle lineage drifted');
          console.log('uc_multi_hole_chain_lineage=PASS'); console.log(`scene_triangles=${counts.join(',')}`); console.log(`lineages=${b.stage_one.lineage_sha256},${b.stage_two.lineage_sha256}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify root, two-hole, and resumed three-hole scenes
        run: |
          base=creative-render/build/uc-multi-hole-chain
          for name in source stage-one stage-two; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind hash-linked fabrication chain to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises'; import {createHash} from 'node:crypto';
          const sha=b=>createHash('sha256').update(b).digest('hex'),base='creative-render/build/uc-multi-hole-chain/';
          const sceneEvidenceBytes=await readFile(base+'scene-evidence.json'),sceneEvidence=JSON.parse(sceneEvidenceBytes),renders={};
          for(const name of ['source','stage-one','stage-two']){
            const [scene,request,receipt,frame]=await Promise.all([readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(receipt),frame_sha256:sha(frame),frame_bytes:frame.length};
            const key=name==='source'?'source_scene':name.replace('-','_')+'_scene';
            if(renders[name].scene_sha256!==sceneEvidence.outputs[key].sha256)throw new Error(`${name} scene changed before render evidence binding`);
          }
          if(new Set(Object.values(renders).map(x=>x.frame_sha256)).size!==3)throw new Error('root/two-hole/three-hole native frame bytes were not all distinct');
          const evidence={contract:'AXM_CREATIVE_UC_MULTI_HOLE_CHAIN_NATIVE_RENDER_EVIDENCE',version:1,scene_evidence_sha256:sha(sceneEvidenceBytes),renders,donor:sceneEvidence.observation.donor,render_receipt_replay:{source:'PASS','stage-one':'PASS','stage-two':'PASS'},same_adapter_albedo:sceneEvidence.observation.same_adapter_albedo,proof_view:{reference_renderer_projection:'X/Y screen coordinates with Z depth',fabrication_axis_selected_for_observability:'Z',claim:'bounded proof-view choice only; not general camera or viewpoint coverage'},authority:sceneEvidence.observation.authority,truth_boundary:{proves:'the pinned current UC v0.5 public hole-chain route created a two-hole derived GLB and hash-linked receipt, deterministically reconstructed that prior output before resuming to a three-hole derived GLB without rewriting the retained hole/step lineage, and all three same-albedo geometry states became independently receipt-verified and observably distinct native Render Fabric pixels in the declared reference proof view',does_not_prove:'general cut-output chaining, arbitrary-mesh CSG, cross-axis or mixed notch/hole chains, non-separable layouts, arbitrary camera/viewpoint observability, rich material/UV/rig preservation, cryptographic authorship, manufacturing/structural correctness, host import, aesthetic quality, or cross-machine bitwise determinism'}};
          await writeFile(base+'native-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('uc_multi_hole_chain_native_render=PASS'); console.log(`frame_sha256=${Object.values(renders).map(x=>x.frame_sha256).join(',')}`);
          NODE

      - name: Upload complete multi-hole chain proof
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-uc-multi-hole-chain-render-proof
          path: creative-render/build/uc-multi-hole-chain/
