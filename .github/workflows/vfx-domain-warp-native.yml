name: vfx-domain-warp-native

on:
  pull_request:
    paths:
      - 'src/vfx_domain_warp_bridge.mjs'
      - 'src/vfx_domain_warp_cli.mjs'
      - 'tests/vfx_domain_warp_bridge.test.mjs'
      - '.github/workflows/vfx-domain-warp-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_domain_warp_bridge.mjs'
      - 'src/vfx_domain_warp_cli.mjs'
      - 'tests/vfx_domain_warp_bridge.test.mjs'
      - '.github/workflows/vfx-domain-warp-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-domain-warp-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: bf05ad75241001da532f9dff14d8470c34b18c49
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained proof directory
        run: |
          mkdir -p creative-render/build/vfx-domain-warp-native
          cat > creative-render/build/vfx-domain-warp-native/donor-revisions.json <<'EOF'
          {
            "visual_effect_fabric": "bf05ad75241001da532f9dff14d8470c34b18c49",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build zero and active domain-warp proof
        run: |
          base=creative-render/build/vfx-domain-warp-native
          node creative-render/src/vfx_domain_warp_cli.mjs build \
            --vfx-root visual-effect-fabric \
            --zero-scene "$base/zero.axmscene" \
            --warped-scene "$base/warped.axmscene" \
            --zero-state "$base/zero-state.json" \
            --warped-state "$base/warped-state.json" \
            --receipt "$base/domain-warp.receipt.json"

      - name: Independently assert source authority and bounded adapter evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-domain-warp-native/';
          const [receiptBytes,zeroSceneBytes,warpedSceneBytes,zeroStateBytes,warpedStateBytes,donorBytes]=await Promise.all([
            readFile(base+'domain-warp.receipt.json'),readFile(base+'zero.axmscene'),readFile(base+'warped.axmscene'),
            readFile(base+'zero-state.json'),readFile(base+'warped-state.json'),readFile(base+'donor-revisions.json')
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const donors=JSON.parse(donorBytes.toString('utf8'));
          if(donors.visual_effect_fabric!=='bf05ad75241001da532f9dff14d8470c34b18c49'||donors.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor revision evidence drifted');
          if(r.contract!=='AXM_CREATIVE_VFX_DOMAIN_WARP_RECEIPT'||r.version!==1)throw new Error('domain-warp receipt contract drifted');
          const z=r.zero_amplitude.visual_effect_fabric,w=r.active_warp.visual_effect_fabric;
          if(z.graph_id!=='fx.field.domain-warp2d'||w.graph_id!=='fx.field.domain-warp2d'||z.graph_version!=='0.1.0'||w.graph_version!=='0.1.0')throw new Error('current VFX domain-warp graph was not exercised');
          if(z.caller_neutral_repeat_verification!=='PASS'||w.caller_neutral_repeat_verification!=='PASS')throw new Error('caller-neutral repeat verification failed');
          for(const key of ['base_source_hash','flow_scalar_source_hash','flow_source_hash']){
            if(typeof r.shared_inputs[key]!=='string'||!r.shared_inputs[key])throw new Error('shared retained-source identity missing: '+key);
          }
          if(z.base_source.source_hash!==w.base_source.source_hash||z.flow_scalar_source.source_hash!==w.flow_scalar_source.source_hash||z.flow_source.source_hash!==w.flow_source.source_hash)throw new Error('retained source identity changed across amplitude challenge');
          if(z.zero_amplitude_exact_noop_verified!==true||z.grid.max_displacement!==0)throw new Error('zero amplitude did not remain exact no-op evidence');
          if(!(w.grid.max_displacement>0))throw new Error('active warp did not retain non-zero displacement');
          if(z.warp_source.source_hash===w.warp_source.source_hash||z.grid.field_hash===w.grid.field_hash)throw new Error('declared amplitude challenge did not change derived identities');
          for(const row of [z,w]){
            if(row.grid.schema!=='axm.domain-warp-grid/v0.1'||row.grid.derived!==true||row.grid.rebuildable!==true)throw new Error('domain-warp derived-grid truth boundary drifted');
            if(row.grid.cells!==1536)throw new Error('expected current 48x32 derived grid was not exercised');
            if(row.truth_boundary.consumer_semantics_proven!==false||row.truth_boundary.aesthetic_quality_proven!==false||row.truth_boundary.physical_flow_behavior_proven!==false)throw new Error('VFX truth boundary was promoted');
          }
          if(r.outputs.zero_scene.sha256!==sha(zeroSceneBytes)||r.outputs.warped_scene.sha256!==sha(warpedSceneBytes))throw new Error('derived scene bytes not bound');
          if(r.outputs.zero_state.sha256!==sha(zeroStateBytes)||r.outputs.warped_state.sha256!==sha(warpedStateBytes))throw new Error('donor final-state bytes not bound');
          if(sha(zeroSceneBytes)===sha(warpedSceneBytes))throw new Error('zero/active warp produced identical derived scene bytes');
          const zeroScene=parseScene(zeroSceneBytes.toString('utf8')),warpedScene=parseScene(warpedSceneBytes.toString('utf8'));
          if(zeroScene.triangles.length!==3072||warpedScene.triangles.length!==3072)throw new Error('domain-warp scene topology budget drifted');
          const zeroVertices=zeroScene.triangles.map(t=>t.vertices),warpedVertices=warpedScene.triangles.map(t=>t.vertices);
          if(JSON.stringify(zeroVertices)!==JSON.stringify(warpedVertices))throw new Error('domain-warp visualization changed geometry instead of albedo only');
          if(r.zero_amplitude.grid_to_scene.vector_displacement_encoded_as_geometry!==false||r.active_warp.grid_to_scene.vector_displacement_encoded_as_geometry!==false)throw new Error('vector displacement was silently promoted into scene geometry');
          const evidence={
            contract:'AXM_CREATIVE_VFX_DOMAIN_WARP_INDEPENDENT_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),donor_revisions:donors,
            gates:{retained_sources_stable:'PASS',zero_amplitude_exact_noop:'PASS',active_displacement_observed:'PASS',derived_identities_changed:'PASS',fixed_adapter_geometry:'PASS',same_runtime_caller_neutral_repeat:'PASS'}
          };
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_domain_warp_independent_evidence=PASS');
          console.log(`base_source_hash=${r.shared_inputs.base_source_hash}`);
          console.log(`flow_source_hash=${r.shared_inputs.flow_source_hash}`);
          console.log(`zero_grid_hash=${z.grid.field_hash}`);
          console.log(`warped_grid_hash=${w.grid.field_hash}`);
          console.log(`active_max_displacement=${w.grid.max_displacement}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify both domain-warp candidates
        run: |
          base=creative-render/build/vfx-domain-warp-native
          for name in zero warped; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind neutral domain warp to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-domain-warp-native/';
          const receiptBytes=await readFile(base+'domain-warp.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['zero','warped']){
            const [scene,request,renderReceipt,frame]=await Promise.all([
              readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')
            ]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
          }
          if(renders.zero.scene_sha256!==receipt.outputs.zero_scene.sha256||renders.warped.scene_sha256!==receipt.outputs.warped_scene.sha256)throw new Error('scene identity changed before native rendering');
          if(renders.zero.frame_sha256===renders.warped.frame_sha256)throw new Error('active domain warp did not reach distinct native frame bytes');
          const evidence={
            contract:'AXM_CREATIVE_VFX_DOMAIN_WARP_NATIVE_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),
            donor_revisions:{visual_effect_fabric:'bf05ad75241001da532f9dff14d8470c34b18c49',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},
            retained_sources:{base_source_hash:receipt.shared_inputs.base_source_hash,flow_scalar_source_hash:receipt.shared_inputs.flow_scalar_source_hash,flow_source_hash:receipt.shared_inputs.flow_source_hash},
            zero_warp_source_hash:receipt.zero_amplitude.visual_effect_fabric.warp_source.source_hash,
            active_warp_source_hash:receipt.active_warp.visual_effect_fabric.warp_source.source_hash,
            zero_grid_hash:receipt.zero_amplitude.visual_effect_fabric.grid.field_hash,
            active_grid_hash:receipt.active_warp.visual_effect_fabric.grid.field_hash,
            active_max_displacement:receipt.active_warp.visual_effect_fabric.grid.max_displacement,
            renders,render_receipt_replay:{zero:'PASS',warped:'PASS'},
            authority:{retained_vfx_sources:'CANONICAL_VFX_SCALAR_AND_VECTOR_FIELD_SOURCES',domain_warp_sources:'CANONICAL_NEUTRAL_VFX_DOMAIN_WARP_SOURCES',grids:'DERIVED_REBUILDABLE_VFX_WORKING_SETS',scenes:'DERIVED_REPLACEABLE_VISUALIZATIONS',pixels:'DERIVED_RENDER_FABRIC_OUTPUT'},
            truth_boundary:{
              proves:'the current VFX renderer-neutral domain-warp graph preserves retained scalar/vector source identity across an explicit zero-to-active amplitude change, keeps zero amplitude as an exact base-field no-op, produces a distinct derived sampled grid at non-zero displacement, and reaches independently receipt-verified native pixels through one fixed-geometry scalar-to-albedo adapter',
              does_not_prove:'visual quality, smoke/water/wind/particle/crack/gameplay/UI/material semantics, physical fluid behavior, continuous-field equivalence beyond retained samples, real-time performance, GPU/browser parity or cross-machine bitwise determinism'
            }
          };
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_domain_warp_native_render=PASS');
          console.log(`zero_frame_sha256=${renders.zero.frame_sha256}`);
          console.log(`warped_frame_sha256=${renders.warped.frame_sha256}`);
          NODE

      - name: Upload retained VFX domain-warp native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-domain-warp-native-proof
          path: creative-render/build/vfx-domain-warp-native/
          if-no-files-found: warn
