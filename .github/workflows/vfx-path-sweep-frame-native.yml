name: vfx-path-sweep-frame-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vfx-path-sweep-frame-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-vfx-path-sweep-frame-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: b2744d279a9645418eb6552b651ff6e04c4344de
          path: visual-effect-fabric

      - name: Checkout pinned current Render Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Retain attempt identity before gates
        run: |
          mkdir -p creative-render/build/vfx-path-sweep-frame
          cat > creative-render/build/vfx-path-sweep-frame/attempt.json <<EOF
          {
            "creative_render_head": "${GITHUB_SHA}",
            "visual_effect_fabric_revision": "b2744d279a9645418eb6552b651ff6e04c4344de",
            "render_fabric_revision": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b",
            "lane": "vfx-path-sweep-frame-native"
          }
          EOF

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run pinned current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Execute current VFX path-sweep-frame donor and build disposable native ribbon
        run: |
          root=creative-render/build/vfx-path-sweep-frame
          node creative-render/src/vfx_path_sweep_frame_native_cli.mjs build \
            --vfx-root visual-effect-fabric \
            --vfx-revision b2744d279a9645418eb6552b651ff6e04c4344de \
            --scene "$root/scene.axmscene" \
            --donor-state "$root/donor-state.json" \
            --receipt "$root/path-sweep-frame.receipt.json"

      - name: Assert source authority, rebuild validation, bounded work, and retained failures
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';

          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const root='creative-render/build/vfx-path-sweep-frame/';
          const [receiptBytes,stateBytes,sceneBytes]=await Promise.all([
            readFile(root+'path-sweep-frame.receipt.json'),
            readFile(root+'donor-state.json'),
            readFile(root+'scene.axmscene'),
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const state=JSON.parse(stateBytes.toString('utf8'));

          if(r.contract!=='AXM_CREATIVE_VFX_PATH_SWEEP_FRAME_NATIVE_RECEIPT'||r.version!==1)throw new Error('path-sweep receipt drifted');
          const v=r.visual_effect_fabric;
          if(v.revision!=='b2744d279a9645418eb6552b651ff6e04c4344de'||v.donor_graph_reused!==true)throw new Error('pinned current path-sweep donor not exercised');
          if(v.graph_id!=='fx.geometry.path-sweep-frame2d'||v.graph_version!=='0.1.0')throw new Error('path-sweep graph identity drifted');
          if(v.caller_neutral_replay!=='PASS'||v.caller_request_unchanged!==true||v.caller_paths_unchanged!==true)throw new Error('path-sweep caller/source boundary failed');

          const s=v.retained_source;
          if(s.schema!=='axm.path-sweep-frame-source/v0.1'||s.algorithm!=='polyline-bisector-sweep-frame2d/v0.1'||s.profile!=='symmetric-ribbon2d'||s.frame_policy!=='left-normal-bisector2d'||s.reversal_fallback!=='outgoing-segment'||s.width_mode!=='constant-half-width')throw new Error('retained path-sweep semantics drifted');
          const set=v.selected_frame_set;
          if(set.schema!=='axm.path-sweep-frame-set/v0.1'||set.derived!==true||set.rebuildable!==true||set.sourceHash!==s.source_hash||set.pathSourceHash!==s.path_source_hash)throw new Error('derived path-sweep lineage drifted');
          if(set.pointCount!==s.point_count||set.pathCount!==s.path_count)throw new Error('path-sweep source/derived cardinality drifted');
          if(r.outputs.scene.sha256!==sha(sceneBytes)||r.outputs.donor_state.sha256!==sha(stateBytes))throw new Error('path-sweep output bytes are not receipt-bound');

          if(!Object.values(r.challenges).every(Boolean))throw new Error('one or more retained path-sweep challenges failed');
          const o=r.native_observer;
          if(o.geometry_uses_only_retained_points_plus_donor_derived_normals_and_half_width!==true||o.albedo_encodes_frame_semantics!==false||o.mesh_authority_acquired!==false||o.renderer_authority_acquired!==false||o.consumer_semantics_assigned!==false)throw new Error('native observer authority boundary drifted');
          const t=r.truth_boundary;
          if(t.caller_paths_authority!=='RETAINED_CALLER_SOURCE_TRUTH'||t.sweep_source_authority!=='RETAINED_VFX_SOURCE'||t.frame_set_authority!=='DERIVED_REBUILDABLE_VFX_BODY'||t.native_scene_receipt_pixels_authority!=='DERIVED_REPLACEABLE_OBSERVER_BODIES')throw new Error('path-sweep authority labels drifted');
          for(const unsupported of ['creative_render_mesh_authority_acquired','consumer_semantics_proven','physical_sweep_proven','curvature_correctness_proven','aesthetic_quality_proven','accessibility_proven','realtime_performance_proven','gpu_equivalence_proven','cross_machine_bitwise_determinism_proven']){
            if(t[unsupported]!==false)throw new Error(`unsupported claim promoted: ${unsupported}`);
          }

          const donor=await import(pathToFileURL(resolve('visual-effect-fabric/hand-lab/src/path-sweep-frame2d.mjs')).href);
          if(donor.validatePathSweepFrameSet(state,set,{maxPoints:4096})!==true)throw new Error('retained donor state no longer validates selected frame set');

          const challenges={
            contract:'AXM_CREATIVE_VFX_PATH_SWEEP_FRAME_NATIVE_CHALLENGES',
            version:1,
            caller_neutral_replay:'PASS',
            retained_paths_unchanged:'PASS',
            exact_vs_roomy_donor_capacity:'PASS',
            one_below_donor_capacity:'REJECTED_AS_REQUIRED',
            exact_vs_roomy_observer_capacity:'PASS',
            one_below_observer_capacity:'REJECTED_AS_REQUIRED',
            zero_length_span:'REJECTED_AS_REQUIRED',
            graph_4097_points_over_default_4096:'REJECTED_AS_REQUIRED',
            self_consistent_derived_frame_tamper:'REJECTED_AS_REQUIRED',
            self_consistent_retained_semantic_forgery:'REJECTED_AS_REQUIRED'
          };
          await writeFile(root+'challenges.json',JSON.stringify(challenges,null,2)+'\n');
          console.log('vfx_path_sweep_frame_truth_gates=PASS');
          console.log(`path_source_hash=${s.path_source_hash}`);
          console.log(`sweep_source_hash=${s.source_hash}`);
          console.log(`frame_set_hash=${set.frameSetHash}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify disposable path-sweep observation
        run: |
          root=creative-render/build/vfx-path-sweep-frame
          cat > "$root/scene.axmrender" <<'EOF_REQ'
          AXM_RENDER_REQUEST 1
          scene scene.axmscene
          backend axm.native.cpu.reference
          width 640
          height 420
          format ppm-rgb8
          output scene.ppm
          EOF_REQ
          render-fabric/build/axm-render --request "$root/scene.axmrender" --receipt "$root/scene.axmreceipt"
          render-fabric/build/axm-render-verify-receipt "$root/scene.axmrender" "$root/scene.axmreceipt"

      - name: Bind donor-derived scene to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const root='creative-render/build/vfx-path-sweep-frame/';
          const receipt=JSON.parse(await readFile(root+'path-sweep-frame.receipt.json','utf8'));
          const [scene,request,renderReceipt,frame]=await Promise.all([
            readFile(root+'scene.axmscene'),
            readFile(root+'scene.axmrender'),
            readFile(root+'scene.axmreceipt'),
            readFile(root+'scene.ppm'),
          ]);
          if(sha(scene)!==receipt.outputs.scene.sha256)throw new Error('native renderer did not consume receipt-bound scene bytes');
          if(frame.length<=32)throw new Error('native frame is unexpectedly empty');
          const evidence={
            contract:'AXM_CREATIVE_VFX_PATH_SWEEP_FRAME_NATIVE_PIXEL_EVIDENCE',
            version:1,
            retained_path_source_hash:receipt.visual_effect_fabric.retained_source.path_source_hash,
            retained_sweep_source_hash:receipt.visual_effect_fabric.retained_source.source_hash,
            derived_frame_set_hash:receipt.visual_effect_fabric.selected_frame_set.frameSetHash,
            scene_sha256:sha(scene),
            request_sha256:sha(request),
            render_receipt_sha256:sha(renderReceipt),
            frame_sha256:sha(frame),
            frame_bytes:frame.length,
            native_receipt_independently_verified:true,
            pixels_authority:'DERIVED_REPLACEABLE_OBSERVER_BODY',
            aesthetic_quality_proven:false
          };
          await writeFile(root+'native-pixel-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_path_sweep_frame_native_pixel_binding=PASS');
          console.log(`frame_sha256=${evidence.frame_sha256}`);
          NODE

      - name: Upload retained path-sweep proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-path-sweep-frame-native-proof
          path: creative-render/build/vfx-path-sweep-frame
          if-no-files-found: warn
          retention-days: 30
