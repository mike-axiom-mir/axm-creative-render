name: vfx-particle-flow-advection-native

on:
  pull_request:
    paths:
      - 'src/vfx_particle_flow_advection_bridge.mjs'
      - 'src/vfx_particle_flow_advection_cli.mjs'
      - 'tests/vfx_particle_flow_advection_bridge.test.mjs'
      - '.github/workflows/vfx-particle-flow-advection-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_particle_flow_advection_bridge.mjs'
      - 'src/vfx_particle_flow_advection_cli.mjs'
      - 'tests/vfx_particle_flow_advection_bridge.test.mjs'
      - '.github/workflows/vfx-particle-flow-advection-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-particle-flow-advection-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: 78b7c024b6f06340ca28173ba51758886b859c87
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained proof directory
        run: |
          mkdir -p creative-render/build/vfx-particle-flow-advection-native
          cat > creative-render/build/vfx-particle-flow-advection-native/donor-revisions.json <<'EOF'
          {
            "visual_effect_fabric": "78b7c024b6f06340ca28173ba51758886b859c87",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build zero and active particle-flow proof
        run: |
          base=creative-render/build/vfx-particle-flow-advection-native
          node creative-render/src/vfx_particle_flow_advection_cli.mjs build \
            --vfx-root visual-effect-fabric \
            --vfx-revision 78b7c024b6f06340ca28173ba51758886b859c87 \
            --source-particles "$base/source-particles.json" \
            --zero-scene "$base/zero.axmscene" \
            --advected-scene "$base/advected.axmscene" \
            --zero-state "$base/zero-state.json" \
            --advected-state "$base/advected-state.json" \
            --receipt "$base/particle-flow.receipt.json"

      - name: Independently assert authority, lineage and adapter evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-particle-flow-advection-native/';
          const [receiptBytes,sourceBytes,zeroSceneBytes,advectedSceneBytes,zeroStateBytes,advectedStateBytes,donorBytes]=await Promise.all([
            readFile(base+'particle-flow.receipt.json'),readFile(base+'source-particles.json'),readFile(base+'zero.axmscene'),readFile(base+'advected.axmscene'),
            readFile(base+'zero-state.json'),readFile(base+'advected-state.json'),readFile(base+'donor-revisions.json')
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const donors=JSON.parse(donorBytes.toString('utf8'));
          if(donors.visual_effect_fabric!=='78b7c024b6f06340ca28173ba51758886b859c87'||donors.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor revision evidence drifted');
          if(r.contract!=='AXM_CREATIVE_VFX_PARTICLE_FLOW_ADVECTION_RECEIPT'||r.version!==1)throw new Error('particle-flow receipt contract drifted');
          if(r.donor.revision!==donors.visual_effect_fabric||r.donor.graph_id!=='fx.particle.flow-advect2d'||r.donor.graph_version!=='0.1.0')throw new Error('current VFX particle-flow graph was not exercised');
          if(JSON.stringify(r.donor.hand_ids)!==JSON.stringify(['fx.particle.flow-advection-source-normalize','fx.particle.flow-advection-build']))throw new Error('VFX particle-flow Hand boundary drifted');
          if(r.caller_authority.source_particles_mutated!==false||r.caller_authority.particle_metadata_preserved!==true||r.caller_authority.consumer_meaning_assigned!==false||r.caller_authority.canonical_particles_remain_authoritative!==true)throw new Error('caller particle authority boundary failed');
          if(r.outputs.source_particles.sha256!==sha(sourceBytes)||r.outputs.zero_state.sha256!==sha(zeroStateBytes)||r.outputs.active_state.sha256!==sha(advectedStateBytes))throw new Error('source/state byte binding drifted');
          if(r.outputs.zero_scene.sha256!==sha(zeroSceneBytes)||r.outputs.active_scene.sha256!==sha(advectedSceneBytes))throw new Error('scene byte binding drifted');
          if(r.zero_step_size.caller_neutral_repeat_verification!=='PASS'||r.active_flow.caller_neutral_repeat_verification!=='PASS')throw new Error('caller-neutral repeat verification failed');
          if(r.zero_step_size.exact_derived_noop_verified!==true||r.zero_step_size.step_size!==0||r.zero_step_size.moved_particle_count!==0||r.zero_step_size.max_step_distance!==0||r.zero_step_size.clamped_step_count!==0)throw new Error('zero step size did not remain exact derived no-op');
          if(!(r.active_flow.step_size>0)||!(r.active_flow.moved_particle_count>0)||!(r.active_flow.max_step_distance>0))throw new Error('active particle flow did not produce bounded derived motion');
          if(r.zero_step_size.advection_source_hash===r.active_flow.advection_source_hash||r.zero_step_size.particle_set_hash===r.active_flow.particle_set_hash)throw new Error('explicit step-size challenge did not change derived identities');
          for(const row of [r.zero_step_size,r.active_flow]){
            if(row.particle_set.schema!=='axm.flow-advected-particle-set/v0.1'||row.particle_set.derived!==true||row.particle_set.rebuildable!==true)throw new Error('derived particle-set truth boundary drifted');
            if(row.particle_set.particle_count!==12||row.particle_set.sample_count!==156)throw new Error('bounded particle/trajectory fixture cardinality drifted');
            if(row.scene_adapter.geometry_encodes_final_derived_particle_positions!==true||row.scene_adapter.trajectories_remain_evidence_only!==true||row.scene_adapter.albedo_is_constant_observation_style!==true||row.scene_adapter.consumer_semantics_preserved!==false)throw new Error('replaceable scene-adapter boundary drifted');
          }
          const zeroScene=parseScene(zeroSceneBytes.toString('utf8')),advectedScene=parseScene(advectedSceneBytes.toString('utf8'));
          if(zeroScene.triangles.length!==24||advectedScene.triangles.length!==24)throw new Error('expected bounded 12-particle/24-triangle adapter was not exercised');
          const zeroAlbedo=zeroScene.triangles.map(t=>t.albedo),advectedAlbedo=advectedScene.triangles.map(t=>t.albedo);
          if(JSON.stringify(zeroAlbedo)!==JSON.stringify(advectedAlbedo))throw new Error('particle-flow observation styling changed across derived states');
          if(zeroScene.triangles.some(t=>JSON.stringify(t.albedo)!==JSON.stringify([236,174,76])))throw new Error('particle-flow observation style is not constant');
          if(JSON.stringify(zeroScene.triangles.map(t=>t.vertices))===JSON.stringify(advectedScene.triangles.map(t=>t.vertices)))throw new Error('active particle flow did not reach scene geometry');
          const evidence={
            contract:'AXM_CREATIVE_VFX_PARTICLE_FLOW_INDEPENDENT_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),donor_revisions:donors,retained_sources:r.shared_retained_sources,
            gates:{caller_particle_authority:'PASS',metadata_preserved:'PASS',zero_step_size_exact_noop:'PASS',active_particle_motion:'PASS',retained_trajectory_evidence:'PASS',derived_identity_changed:'PASS',constant_style_final_position_adapter:'PASS',same_runtime_caller_neutral_repeat:'PASS'}
          };
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_particle_flow_independent_evidence=PASS');
          console.log(`source_particle_hash=${r.shared_retained_sources.particle_source_hash}`);
          console.log(`flow_source_hash=${r.shared_retained_sources.flow_source_hash}`);
          console.log(`zero_particle_set_hash=${r.zero_step_size.particle_set_hash}`);
          console.log(`active_particle_set_hash=${r.active_flow.particle_set_hash}`);
          console.log(`moved_particle_count=${r.active_flow.moved_particle_count}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify both particle-flow candidates
        run: |
          base=creative-render/build/vfx-particle-flow-advection-native
          for name in zero advected; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind derived final positions to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-particle-flow-advection-native/';
          const receiptBytes=await readFile(base+'particle-flow.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['zero','advected']){
            const [scene,request,renderReceipt,frame]=await Promise.all([
              readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')
            ]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
          }
          if(renders.zero.scene_sha256!==receipt.outputs.zero_scene.sha256||renders.advected.scene_sha256!==receipt.outputs.active_scene.sha256)throw new Error('scene identity changed before native rendering');
          if(renders.zero.frame_sha256===renders.advected.frame_sha256)throw new Error('active particle-flow final positions did not reach distinct native frame bytes');
          const evidence={
            contract:'AXM_CREATIVE_VFX_PARTICLE_FLOW_NATIVE_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),
            donor_revisions:{visual_effect_fabric:'78b7c024b6f06340ca28173ba51758886b859c87',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},
            retained_sources:receipt.shared_retained_sources,
            zero_advection_source_hash:receipt.zero_step_size.advection_source_hash,
            active_advection_source_hash:receipt.active_flow.advection_source_hash,
            zero_particle_set_hash:receipt.zero_step_size.particle_set_hash,
            active_particle_set_hash:receipt.active_flow.particle_set_hash,
            moved_particle_count:receipt.active_flow.moved_particle_count,
            max_step_distance:receipt.active_flow.max_step_distance,
            renders,render_receipt_replay:{zero:'PASS',advected:'PASS'},authority:receipt.authority,truth_boundary:receipt.truth_boundary
          };
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_particle_flow_native_render=PASS');
          console.log(`zero_frame_sha256=${renders.zero.frame_sha256}`);
          console.log(`advected_frame_sha256=${renders.advected.frame_sha256}`);
          NODE

      - name: Upload retained VFX particle-flow native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-particle-flow-advection-native-proof
          path: creative-render/build/vfx-particle-flow-advection-native/
          if-no-files-found: warn
