name: vfx-uc-live-edit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vfx-uc-live-edit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-vfx-uc-live-edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Universal Creation
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: 49ef11ca42b2079dffbd595daa8ea8626b99d2ab
          path: universal-creation

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: f26cb987d31df8a153675f805b6b8579a9f21f96
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Build refined VFX surface then edit it through real UC Creative Flow
        run: |
          mkdir -p creative-render/build/vfx-uc-live-edit
          node creative-render/src/vfx_uc_live_edit_cli.mjs build \
            --uc-root universal-creation \
            --vfx-root visual-effect-fabric \
            --source-scene creative-render/build/vfx-uc-live-edit/source.axmscene \
            --surface-scene creative-render/build/vfx-uc-live-edit/surface.axmscene \
            --edited-scene creative-render/build/vfx-uc-live-edit/edited.axmscene \
            --state creative-render/build/vfx-uc-live-edit/vfx-state.json \
            --html creative-render/build/vfx-uc-live-edit/vfx-refined.html \
            --receipt creative-render/build/vfx-uc-live-edit/live-edit.receipt.json

      - name: Assert creative-state lineage and authority boundaries
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-uc-live-edit/';
          const [receiptBytes,sourceBytes,surfaceBytes,editedBytes,stateBytes,htmlBytes]=await Promise.all([
            readFile(base+'live-edit.receipt.json'),readFile(base+'source.axmscene'),readFile(base+'surface.axmscene'),
            readFile(base+'edited.axmscene'),readFile(base+'vfx-state.json'),readFile(base+'vfx-refined.html'),
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          if(r.contract!=='AXM_CREATIVE_VFX_UC_LIVE_EDIT_RECEIPT'||r.version!==1)throw new Error('live-edit receipt drifted');
          if(r.source_universal_creation.flow_status!=='PASS')throw new Error('source UC Creative Flow did not pass');
          if(r.universal_creation_edit.flow_status!=='PASS'||r.universal_creation_edit.candidate_ready!==true)throw new Error('UC edit flow did not pass');
          if(r.universal_creation_edit.source_state_mutated!==false)throw new Error('UC edit mutated caller source state');
          if(r.universal_creation_edit.repeat_verification!=='PASS')throw new Error('UC edit repeat verification failed');
          if(r.universal_creation_edit.hand_count<501||r.universal_creation_edit.recipe_count<508)throw new Error('UC public creative surface unexpectedly shrank');
          const ops=r.universal_creation_edit.flow_operations;
          if(JSON.stringify(ops)!==JSON.stringify(['creative.mesh-deform.twist','creative.mesh-transform.translate','creative.mesh-analysis.bounds']))throw new Error('UC live-edit operation set drifted');
          if(r.outputs.source_scene.sha256!==sha(sourceBytes)||r.outputs.surface_scene.sha256!==sha(surfaceBytes)||r.outputs.edited_scene.sha256!==sha(editedBytes))throw new Error('scene byte lineage drifted');
          if(r.outputs.vfx_state.sha256!==sha(stateBytes)||r.outputs.vfx_html.sha256!==sha(htmlBytes))throw new Error('VFX output bytes not bound');
          if(r.direct_sample.source_scene_sha256!==r.outputs.source_scene.sha256||r.visual_effect_fabric.source_digest!==r.outputs.source_scene.sha256)throw new Error('source identity lost before VFX refinement');
          if(r.visual_effect_fabric.renderer!=='axm.vfx.holographic-voxel-surface/v0.7')throw new Error('latest refined VFX renderer not exercised');
          if(r.visual_effect_fabric.surface.schema!=='axm.holographic-triangle-surface/v0.2')throw new Error('refined VFX surface schema drifted');
          if(!r.visual_effect_fabric.surface.parent_mesh_digest||!r.visual_effect_fabric.surface.refinement)throw new Error('VFX refinement lineage missing');
          if(r.surface_to_precision_mesh.source_surface_digest!==r.visual_effect_fabric.surface.digest)throw new Error('UC admission lost refined VFX mesh identity');
          if(r.surface_to_precision_mesh.output_triangle_count!==r.visual_effect_fabric.surface.triangle_count)throw new Error('VFX -> UC triangle count changed');
          if(r.surface_to_precision_mesh.uvs_preserved!==false||r.surface_to_precision_mesh.topology_semantics_preserved!==false)throw new Error('loss boundary drifted');
          if(r.universal_creation_edit.input_triangle_count!==r.visual_effect_fabric.surface.triangle_count||r.universal_creation_edit.edited_triangle_count!==r.visual_effect_fabric.surface.triangle_count)throw new Error('bounded UC edit unexpectedly changed topology count');
          if(r.universal_creation_edit.before_scene_sha256!==r.outputs.surface_scene.sha256||r.universal_creation_edit.edited_scene_sha256!==r.outputs.edited_scene.sha256)throw new Error('UC edit scene lineage drifted');
          if(r.outputs.surface_scene.sha256===r.outputs.edited_scene.sha256)throw new Error('UC live edit produced identical scene bytes');
          const source=parseScene(sourceBytes.toString('utf8')),surface=parseScene(surfaceBytes.toString('utf8')),edited=parseScene(editedBytes.toString('utf8'));
          if(source.triangles.length!==12)throw new Error('current source scene evidence drifted');
          if(surface.triangles.length!==edited.triangles.length||surface.triangles.length<1||surface.triangles.length>12000)throw new Error('derived surface triangle bounds drifted');
          console.log('vfx_uc_live_edit_lineage=PASS');
          console.log(`source_triangles=${source.triangles.length}`);
          console.log(`surface_triangles=${surface.triangles.length}`);
          console.log(`vfx_parent_mesh_digest=${r.visual_effect_fabric.surface.parent_mesh_digest}`);
          console.log(`vfx_refined_mesh_digest=${r.visual_effect_fabric.surface.digest}`);
          console.log(`uc_edited_mesh_digest=${r.universal_creation_edit.edited_mesh_digest}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and verify source, VFX surface, and UC-edited surface
        run: |
          base=creative-render/build/vfx-uc-live-edit
          cat > "$base/source.axmrender" <<'EOF'
          AXM_RENDER_REQUEST 1
          scene source.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output source.ppm
          EOF
          cat > "$base/surface.axmrender" <<'EOF'
          AXM_RENDER_REQUEST 1
          scene surface.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output surface.ppm
          EOF
          cat > "$base/edited.axmrender" <<'EOF'
          AXM_RENDER_REQUEST 1
          scene edited.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output edited.ppm
          EOF
          for name in source surface edited; do
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind real creative edit to native render evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-uc-live-edit/';
          const receiptBytes=await readFile(base+'live-edit.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const names=['source','surface','edited'];
          const rows={};
          for(const name of names){
            const [scene,request,renderReceipt,frame]=await Promise.all([
              readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')
            ]);
            rows[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
            if(rows[name].scene_sha256!==receipt.outputs[`${name==='edited'?'edited':name}_scene`].sha256)throw new Error(`${name} scene changed before render evidence binding`);
          }
          if(rows.surface.frame_sha256===rows.edited.frame_sha256)throw new Error('UC geometry edit did not change native renderer frame bytes');
          const evidence={
            contract:'AXM_CREATIVE_VFX_UC_NATIVE_RENDER_EVIDENCE',version:1,
            creative_receipt_sha256:sha(receiptBytes),renders:rows,
            vfx_refined_surface_digest:receipt.visual_effect_fabric.surface.digest,
            uc_edited_mesh_digest:receipt.universal_creation_edit.edited_mesh_digest,
            render_receipt_replay:{source:'PASS',surface:'PASS',edited:'PASS'},
            authority:{source:'CALLER_SOURCE_STATE',surface:'DERIVED_VFX_STATE',edited:'DERIVED_UC_CREATIVE_CANDIDATE',pixels:'DERIVED_RENDER_FABRIC_OUTPUT'},
            truth_boundary:{
              proves:'real UC Creative Flow changed VFX-derived geometry and both before/after bodies became independently receipt-verified native-render pixels',
              does_not_prove:'artistic quality, semantic topology, live world mutation, physics correctness, material preservation or cross-machine determinism'
            }
          };
          await writeFile(base+'native-live-edit-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_uc_native_render=PASS');
          console.log(`surface_frame_sha256=${rows.surface.frame_sha256}`);
          console.log(`edited_frame_sha256=${rows.edited.frame_sha256}`);
          NODE

      - name: Upload complete VFX to UC live-edit proof
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-uc-live-edit-proof
          path: creative-render/build/vfx-uc-live-edit/
