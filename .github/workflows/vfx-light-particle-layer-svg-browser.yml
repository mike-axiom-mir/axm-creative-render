name: vfx-light-particle-layer-svg-browser

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vfx-light-particle-layer-svg-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-vfx-light-particle-layer-svg-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Creative Render revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: 7c46c4c8732a79bb143eb41d722ae5e22be19189
          path: visual-effect-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained attempt evidence before gates
        shell: bash
        run: |
          set -euo pipefail
          root=creative-render/build/vfx-light-particle-layer-svg-browser
          mkdir -p "$root"
          creative_sha="$(git -C creative-render rev-parse HEAD)"
          donor_sha="$(git -C visual-effect-fabric rev-parse HEAD)"
          expected_creative="${{ github.event.pull_request.head.sha || github.sha }}"
          expected_donor="7c46c4c8732a79bb143eb41d722ae5e22be19189"
          cat > "$root/checkout-provenance.json" <<EOF_JSON
          {
            "creative_render_expected": "$expected_creative",
            "creative_render_checked_out": "$creative_sha",
            "visual_effect_fabric_expected": "$expected_donor",
            "visual_effect_fabric_checked_out": "$donor_sha",
            "authority": "EVIDENCE_ONLY"
          }
          EOF_JSON
          cat > "$root/attempt.json" <<'EOF_JSON'
          {
            "lane": "vfx-light-particle-layer-svg-browser",
            "canonical_authority": "retained caller light/particle source truth plus retained VFX source truth",
            "derived_rebuildable": ["light-ray set", "particle-flow set", "light-particle layer plan"],
            "derived_replaceable": ["nested donor SVGs", "composite donor SVG", "browser probe", "browser RGBA", "screenshots"],
            "automatic_aesthetic_acceptance": false
          }
          EOF_JSON
          test "$creative_sha" = "$expected_creative"
          test "$donor_sha" = "$expected_donor"

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run pinned current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build source-honest light-particle composite SVG proof
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { sha256 } from './creative-render/src/creative_scene_operator.mjs';
          import { observeVisualEffectLightParticleLayerStaticSvg } from './creative-render/src/vfx_light_particle_layer_svg_browser_bridge.mjs';
          const root='creative-render/build/vfx-light-particle-layer-svg-browser';
          await mkdir(root,{recursive:true});
          const observed=await observeVisualEffectLightParticleLayerStaticSvg(resolve('visual-effect-fabric'),{vfxRevision:'7c46c4c8732a79bb143eb41d722ae5e22be19189'});
          const files={
            'light-particle-layer-native.receipt.json':observed.nativeReceiptBytes,
            'rays-under-particles.svg':observed.raysUnderParticlesSvg,
            'particles-under-rays.svg':observed.particlesUnderRaysSvg,
            'alternate-presentation.svg':observed.alternatePresentationSvg,
            'browser-probe.html':observed.probeHtml,
          };
          const outputs={};
          for(const [name,bytes] of Object.entries(files)){await writeFile(`${root}/${name}`,bytes);outputs[name]={sha256:sha256(bytes),bytes:bytes.length};}
          const provenance=JSON.parse(await readFile(`${root}/checkout-provenance.json`,'utf8'));
          const receipt={
            contract:'AXM_CREATIVE_VFX_LIGHT_PARTICLE_LAYER_SVG_BROWSER_BUILD_RECEIPT',version:1,
            checkout_provenance:provenance,
            visual_effect_fabric:observed.observation,
            outputs,
            authority:{
              canonical:'retained caller light/particle source truth plus retained VFX source truth',
              derived_rebuildable:['light-ray set','particle-flow set','light-particle layer plan'],
              derived_replaceable:['nested donor SVGs','composite donor SVG','browser probe','browser RGBA','screenshots']
            }
          };
          const receiptBytes=Buffer.from(JSON.stringify(receipt,null,2)+'\n');
          await writeFile(`${root}/build.receipt.json`,receiptBytes);
          console.log('vfx_light_particle_layer_svg_build=PASS');
          console.log(`rays_under_particles_svg_sha256=${outputs['rays-under-particles.svg'].sha256}`);
          console.log(`particles_under_rays_svg_sha256=${outputs['particles-under-rays.svg'].sha256}`);
          console.log(`receipt_sha256=${sha256(receiptBytes)}`);
          NODE

      - name: Independently assert authority, ordering and fail-closed gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const root='creative-render/build/vfx-light-particle-layer-svg-browser/';
          const names=['build.receipt.json','checkout-provenance.json','light-particle-layer-native.receipt.json','rays-under-particles.svg','particles-under-rays.svg','alternate-presentation.svg','browser-probe.html'];
          const values=Object.fromEntries(await Promise.all(names.map(async name=>[name,await readFile(root+name)])));
          const r=JSON.parse(values['build.receipt.json']),v=r.visual_effect_fabric,p=JSON.parse(values['checkout-provenance.json']);
          if(r.contract!=='AXM_CREATIVE_VFX_LIGHT_PARTICLE_LAYER_SVG_BROWSER_BUILD_RECEIPT'||r.version!==1)throw new Error('build receipt drifted');
          if(p.creative_render_expected!==p.creative_render_checked_out||p.visual_effect_fabric_expected!==p.visual_effect_fabric_checked_out)throw new Error('checkout provenance drifted');
          if(v.donor_revision!=='7c46c4c8732a79bb143eb41d722ae5e22be19189'||v.static_graph_id!=='fx.composition.light-particle-layer-static-svg'||v.static_hand_id!=='fx.composition.light-particle-layer-static-svg-realize')throw new Error('expected current donor SVG graph/Hand was not exercised');
          if(v.derived.same_source_layer_identities_across_orders!==true||v.derived.order_preserved!==true||v.derived.rays_under_particles_plan_hash===v.derived.particles_under_rays_plan_hash)throw new Error('verified layer-plan identity/order boundary drifted');
          const s=v.renderer_semantics;
          if(s.orderAuthority!=='verified-layer-plan-only'||s.subrealizationMutation!=='none'||s.blendModeAuthority!=='none'||s.opacityAuthority!=='none'||s.materialAuthority!=='none'||s.canonicalAuthority!=='none'||s.consumerAuthority!=='none'||s.sourceMerge!=='none')throw new Error('donor fixed renderer semantics drifted');
          if(v.capacity_challenge.exact_equals_roomy!==true||v.capacity_challenge.one_below_rejected!==true)throw new Error('structural SVG capacity boundary failed');
          if(v.presentation_challenge.same_plan_hash!==true||v.presentation_challenge.svg_bytes_changed!==true)throw new Error('presentation replaceability boundary failed');
          if(v.forgery_challenges.blend_authority_rehashed_and_rejected!==true||v.forgery_challenges.layer_lineage_rehashed_and_rejected!==true)throw new Error('self-consistent forgery rejection failed');
          for(const [name,row] of Object.entries(r.outputs)){if(!values[name]||row.sha256!==sha(values[name])||row.bytes!==values[name].length)throw new Error(`retained output byte binding drifted: ${name}`);}
          if(sha(values['rays-under-particles.svg'])===sha(values['particles-under-rays.svg']))throw new Error('verified layer orders produced identical donor SVG bytes');
          if(sha(values['rays-under-particles.svg'])===sha(values['alternate-presentation.svg']))throw new Error('presentation challenge did not change replaceable SVG bytes');
          if(v.truth_boundary.browser_pixels_proven!==false||v.truth_boundary.blend_semantics_proven!==false||v.truth_boundary.material_semantics_proven!==false||v.truth_boundary.depth_semantics_proven!==false||v.truth_boundary.consumer_semantics_proven!==false||v.truth_boundary.aesthetic_quality_proven!==false)throw new Error('pre-browser truth boundary was promoted');
          const evidence={
            contract:'AXM_CREATIVE_VFX_LIGHT_PARTICLE_LAYER_SVG_INDEPENDENT_EVIDENCE',version:1,
            build_receipt_sha256:sha(values['build.receipt.json']),donor_revision:v.donor_revision,
            light_source_hash:v.retained.light_source_hash,particle_flow_source_hash:v.retained.particle_flow_source_hash,
            ray_set_hash:v.derived.ray_set_hash,particle_set_hash:v.derived.particle_set_hash,
            rays_under_particles_plan_hash:v.derived.rays_under_particles_plan_hash,particles_under_rays_plan_hash:v.derived.particles_under_rays_plan_hash,
            gates:{checkout_exact:'PASS',source_authority:'PASS',same_source_layers_across_orders:'PASS',donor_order_preserved:'PASS',fixed_renderer_semantics:'PASS',capacity_fail_closed:'PASS',presentation_replaceability:'PASS',forgery_rejection:'PASS',pre_browser_truth_boundary:'PASS'}
          };
          await writeFile(root+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_light_particle_layer_svg_lineage=PASS');
          NODE

      - name: Locate installed browser and retain exact version
        shell: bash
        run: |
          set -euo pipefail
          root=creative-render/build/vfx-light-particle-layer-svg-browser
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then echo "No supported Chromium-family browser is installed" >&2; exit 1; fi
          printf '%s\n' "$browser" > "$root/browser-path.txt"
          "$browser" --version | tee "$root/browser-version.txt"

      - name: Rasterize exact donor SVGs through the real headless browser
        shell: bash
        run: |
          set -euo pipefail
          root=creative-render/build/vfx-light-particle-layer-svg-browser
          browser="$(cat "$root/browser-path.txt")"
          probe_uri="file://$(realpath "$root/browser-probe.html")"
          "$browser" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "$probe_uri" > "$root/browser-probe.dump.html"
          grep -q 'data-axm-done="true"' "$root/browser-probe.dump.html"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=640,420 --screenshot="$PWD/$root/rays-under-particles-browser.png" "file://$(realpath "$root/rays-under-particles.svg")"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=640,420 --screenshot="$PWD/$root/particles-under-rays-browser.png" "file://$(realpath "$root/particles-under-rays.svg")"
          test -s "$root/rays-under-particles-browser.png" && test -s "$root/particles-under-rays-browser.png"

      - name: Verify and bind raw browser pixel evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseLightParticleLayerSvgBrowserProbeDump, verifyLightParticleLayerSvgBrowserRasterEvidence } from './creative-render/src/vfx_light_particle_layer_svg_browser_bridge.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const root='creative-render/build/vfx-light-particle-layer-svg-browser/';
          const [dump,probe,receiptBytes,browserVersionBytes,underShot,overShot]=await Promise.all([readFile(root+'browser-probe.dump.html'),readFile(root+'browser-probe.html'),readFile(root+'build.receipt.json'),readFile(root+'browser-version.txt'),readFile(root+'rays-under-particles-browser.png'),readFile(root+'particles-under-rays-browser.png')]);
          const r=JSON.parse(receiptBytes),v=r.visual_effect_fabric;
          if(sha(probe)!==r.outputs['browser-probe.html'].sha256)throw new Error('browser probe changed after build receipt');
          const raster=verifyLightParticleLayerSvgBrowserRasterEvidence(parseLightParticleLayerSvgBrowserProbeDump(dump),{raysUnderParticlesSvgSha256:r.outputs['rays-under-particles.svg'].sha256,particlesUnderRaysSvgSha256:r.outputs['particles-under-rays.svg'].sha256});
          const sig='89504e470d0a1a0a';if(underShot.subarray(0,8).toString('hex')!==sig||overShot.subarray(0,8).toString('hex')!==sig)throw new Error('browser screenshots are not PNG');
          const browserVersion=browserVersionBytes.toString('utf8').trim();if(!browserVersion)throw new Error('browser version evidence is empty');
          const evidence={
            contract:'AXM_CREATIVE_VFX_LIGHT_PARTICLE_LAYER_SVG_BROWSER_RASTER_EVIDENCE',version:1,
            build_receipt_sha256:sha(receiptBytes),donor_revision:v.donor_revision,
            light_source_hash:v.retained.light_source_hash,particle_flow_source_hash:v.retained.particle_flow_source_hash,
            ray_set_hash:v.derived.ray_set_hash,particle_set_hash:v.derived.particle_set_hash,
            rays_under_particles_plan_hash:v.derived.rays_under_particles_plan_hash,particles_under_rays_plan_hash:v.derived.particles_under_rays_plan_hash,
            browser:{version:browserVersion,version_sha256:sha(browserVersionBytes),mode:'headless-local-file',network_required:false},
            raster,
            screenshots:{rays_under_particles:{sha256:sha(underShot),bytes:underShot.length},particles_under_rays:{sha256:sha(overShot),bytes:overShot.length}},
            authority:{canonical:'retained caller light/particle source truth plus retained VFX source truth',derived_rebuildable:['light-ray set','particle-flow set','light-particle layer plan'],svg_browser_rgba_and_screenshots:'DERIVED_REPLACEABLE_BROWSER_OUTPUT'},
            truth_boundary:{proves:'the identified local browser decoded and rasterized exact hash-bound donor composite SVGs created from the same verified source layers under two donor-verified derived layer orders',does_not_prove:'blend/material/depth/game/UI/world meaning, aesthetic quality, accessibility, continuous animation/timing, production readiness, GPU parity, target-device realtime performance, Firefox/WebKit equivalence, or cross-browser/cross-machine bitwise determinism'}
          };
          await writeFile(root+'browser-raster-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_light_particle_layer_svg_browser_observation=PASS');
          console.log(`browser=${browserVersion}`);console.log(`different_pixels=${raster.different_pixels}`);console.log(`different_channels=${raster.different_channels}`);console.log(`sum_abs_channel_delta=${raster.sum_abs_channel_delta}`);console.log(`rays_under_particles_rgba_fnv1a32=${raster.rays_under_particles_rgba_fnv1a32}`);console.log(`particles_under_rays_rgba_fnv1a32=${raster.particles_under_rays_rgba_fnv1a32}`);
          NODE

      - name: Upload complete light-particle SVG browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-light-particle-layer-svg-browser-proof
          path: creative-render/build/vfx-light-particle-layer-svg-browser
          if-no-files-found: warn
          retention-days: 30
