name: temporal-vfx-video

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: temporal-vfx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-temporal-vfx-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned Universal Creation donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: c89839485a6d09a3e70dbd633c5f1292348f37b1
          path: universal-creation

      - name: Checkout pinned Visual Effect Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: bed7e20374e27b8a6edc1772c606232b196a5869
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Checkout pinned FrameState donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-framestate
          ref: 41c9c6827e64613b523b28536ab864dddf046d93
          path: framestate

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install explicit FFmpeg assembly boundary
        run: |
          set -euo pipefail
          mkdir -p creative-render/build
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          {
            echo "resolved_executable=$(readlink -f "$(command -v ffmpeg)")"
            echo "package_version=$(dpkg-query -W -f='${Version}' ffmpeg)"
            ffmpeg -version | head -n 1
          } | tee creative-render/build/temporal-vfx-ffmpeg-environment.txt

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Sample Universal Creation animation states
        run: |
          node creative-render/src/temporal_cli.mjs sample \
            --uc-root universal-creation \
            --out-dir creative-render/build/temporal-vfx-source \
            --receipt creative-render/build/temporal-vfx-source/temporal.receipt.json \
            --times 0,0.25,0.5

      - name: Build and test Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and verify source frame 000
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-vfx-source/frame-000.axmrender --receipt creative-render/build/temporal-vfx-source/frame-000.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-vfx-source/frame-000.axmrender creative-render/build/temporal-vfx-source/frame-000.axmreceipt

      - name: Render and verify source frame 001
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-vfx-source/frame-001.axmrender --receipt creative-render/build/temporal-vfx-source/frame-001.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-vfx-source/frame-001.axmrender creative-render/build/temporal-vfx-source/frame-001.axmreceipt

      - name: Render and verify source frame 002
        run: |
          render-fabric/build/axm-render --request creative-render/build/temporal-vfx-source/frame-002.axmrender --receipt creative-render/build/temporal-vfx-source/frame-002.axmreceipt
          render-fabric/build/axm-render-verify-receipt creative-render/build/temporal-vfx-source/frame-002.axmrender creative-render/build/temporal-vfx-source/frame-002.axmreceipt

      - name: Execute temporal Visual Effect Fabric states and Universal Creation composites
        run: |
          node creative-render/src/temporal_vfx_cli.mjs apply \
            --uc-root universal-creation \
            --vfx-root visual-effect-fabric \
            --frames creative-render/build/temporal-vfx-source/frame-000.ppm,creative-render/build/temporal-vfx-source/frame-001.ppm,creative-render/build/temporal-vfx-source/frame-002.ppm \
            --out-dir creative-render/build/temporal-vfx-frames \
            --receipt creative-render/build/temporal-vfx.receipt.json \
            --seed 20260915 \
            --seed-step 1

      - name: Assert bounded temporal VFX evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const receipt=JSON.parse(await readFile('creative-render/build/temporal-vfx.receipt.json','utf8'));
          if(receipt.contract!=='AXM_CREATIVE_TEMPORAL_VFX_RECEIPT'||receipt.version!==1)throw new Error('temporal VFX receipt drifted');
          const o=receipt.observation;
          if(o.frame_count!==3||o.changed_frame_count!==3)throw new Error('expected three changed temporal VFX frames');
          if(o.repeat_verification!=='PASS')throw new Error('temporal VFX repeat verification failed');
          if(o.donor_invariant?.vfx_graph_id!=='fx.electric-storm')throw new Error('VFX graph drifted');
          if(o.donor_invariant?.uc_hand_count!==501||o.donor_invariant?.uc_recipe_count!==508)throw new Error('UC public creative census drifted');
          if(o.distinct_vfx_state_count<2)throw new Error('temporal VFX seeds did not produce multiple canonical effect states');
          if(o.distinct_effect_raster_count<2)throw new Error('temporal VFX states did not produce multiple effect rasters');
          for(let i=0;i<3;i++){
            const s=String(i).padStart(3,'0');
            for(const file of [`effect-${s}.state.json`,`effect-${s}.svg`,`effect-${s}.ppm`,`frame-${s}.ppm`]){
              const bytes=await readFile(`creative-render/build/temporal-vfx-frames/${file}`);
              if(!bytes.length)throw new Error(`empty temporal VFX artifact ${file}`);
            }
          }
          console.log('temporal_vfx_evidence=PASS');
          console.log(`distinct_vfx_state_count=${o.distinct_vfx_state_count}`);
          console.log(`distinct_effect_raster_count=${o.distinct_effect_raster_count}`);
          NODE

      - name: Build FrameState project from exact VFX composite frames
        run: |
          node creative-render/src/framestate_bridge_cli.mjs build \
            --machine-root . \
            --frames creative-render/build/temporal-vfx-frames/frame-000.ppm,creative-render/build/temporal-vfx-frames/frame-001.ppm,creative-render/build/temporal-vfx-frames/frame-002.ppm \
            --project creative-render/build/temporal-vfx-project.json \
            --receipt creative-render/build/temporal-vfx-project.receipt.json \
            --fps 12 \
            --hold-frames 4 \
            --project-id axm-creative-render-temporal-vfx-proof

      - name: FrameState canonical admission
        run: |
          PYTHONPATH=framestate/src python -m axm_framestate inspect creative-render/build/temporal-vfx-project.json > creative-render/build/temporal-vfx-inspect.json

      - name: Render and assemble temporal VFX video
        run: |
          PYTHONPATH=framestate/src python -m axm_framestate render \
            creative-render/build/temporal-vfx-project.json \
            creative-render/build/temporal-vfx-render \
            --profile fast > creative-render/build/temporal-vfx-render-output.json
          test -s creative-render/build/temporal-vfx-render/video.mp4
          test -s creative-render/build/temporal-vfx-render/render-receipt.json

      - name: FrameState deterministic repeat verification
        run: |
          PYTHONPATH=framestate/src python -m axm_framestate verify-repeat \
            creative-render/build/temporal-vfx-project.json \
            creative-render/build/temporal-vfx-repeat > creative-render/build/temporal-vfx-repeat.json

      - name: FrameState read-only caller-pinned render verification
        run: |
          receipt_digest="$(python -c "import json; print(json.load(open('creative-render/build/temporal-vfx-render/render-receipt.json'))['receipt_digest'])")"
          project_digest="$(python -c "import json; print(json.load(open('creative-render/build/temporal-vfx-render/render-receipt.json'))['project_digest'])")"
          PYTHONPATH=framestate/src python -m axm_framestate verify-render \
            creative-render/build/temporal-vfx-render \
            --receipt-digest "$receipt_digest" \
            --project-digest "$project_digest" > creative-render/build/temporal-vfx-verify-render.json

      - name: Bind FrameState video evidence
        run: |
          node creative-render/src/framestate_video_verify.mjs \
            --bridge-receipt creative-render/build/temporal-vfx-project.receipt.json \
            --project creative-render/build/temporal-vfx-project.json \
            --render-receipt creative-render/build/temporal-vfx-render/render-receipt.json \
            --repeat creative-render/build/temporal-vfx-repeat.json \
            --verify-render creative-render/build/temporal-vfx-verify-render.json \
            --video creative-render/build/temporal-vfx-render/video.mp4 \
            --ffmpeg-evidence creative-render/build/temporal-vfx-ffmpeg-environment.txt \
            --out creative-render/build/temporal-vfx-video-evidence.json

      - name: Bind temporal VFX provenance into final video evidence
        run: |
          node creative-render/src/temporal_vfx_video_verify.mjs \
            --temporal-vfx-receipt creative-render/build/temporal-vfx.receipt.json \
            --bridge-receipt creative-render/build/temporal-vfx-project.receipt.json \
            --video-evidence creative-render/build/temporal-vfx-video-evidence.json \
            --out creative-render/build/temporal-vfx-final-evidence.json

      - name: Assert bounded temporal VFX video result
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const e=JSON.parse(await readFile('creative-render/build/temporal-vfx-final-evidence.json','utf8'));
          if(e.contract!=='AXM_CREATIVE_TEMPORAL_VFX_VIDEO_EVIDENCE'||e.version!==1)throw new Error('final temporal VFX evidence drifted');
          if(e.frame_count!==3||e.source_frame_count!==3||e.realized_frame_count!==12)throw new Error('temporal VFX frame count drifted');
          if(e.fps!==12||e.duration_seconds!==1)throw new Error('temporal VFX timing drifted');
          if(e.changed_frame_count!==3||e.distinct_vfx_state_count<2)throw new Error('temporal VFX change evidence drifted');
          if(e.framestate_authority!=='EVIDENCE_ADMISSION_ONLY')throw new Error('FrameState authority boundary drifted');
          if(!(e.video_bytes>0))throw new Error('temporal VFX video is empty');
          console.log('temporal_vfx_video=PASS');
          console.log(`video_sha256=${e.video_sha256}`);
          console.log(`video_bytes=${e.video_bytes}`);
          NODE

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-temporal-vfx-failure
          path: creative-render/build/
          if-no-files-found: ignore

      - name: Upload complete temporal VFX video proof
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-temporal-vfx-video-proof
          path: |
            creative-render/build/temporal-vfx-source/
            creative-render/build/temporal-vfx-frames/
            creative-render/build/temporal-vfx.receipt.json
            creative-render/build/temporal-vfx-project.json
            creative-render/build/temporal-vfx-project.receipt.json
            creative-render/build/temporal-vfx-inspect.json
            creative-render/build/temporal-vfx-render/
            creative-render/build/temporal-vfx-repeat.json
            creative-render/build/temporal-vfx-verify-render.json
            creative-render/build/temporal-vfx-video-evidence.json
            creative-render/build/temporal-vfx-final-evidence.json
            creative-render/build/temporal-vfx-ffmpeg-environment.txt
