name: vfx-distance-band-particle-weight-native

on:
  pull_request:
    paths:
      - 'src/vfx_distance_band_particle_weight_native_bridge.mjs'
      - 'tests/vfx_distance_band_particle_weight_native_bridge.test.mjs'
      - '.github/workflows/vfx-distance-band-particle-weight-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_distance_band_particle_weight_native_bridge.mjs'
      - 'tests/vfx_distance_band_particle_weight_native_bridge.test.mjs'
      - '.github/workflows/vfx-distance-band-particle-weight-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-distance-band-particle-weight-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: 67ea5f7af7c3eba14fda2c39e5289472bc7175c1
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained attempt evidence
        run: |
          base=creative-render/build/vfx-distance-band-particle-weight-native
          mkdir -p "$base"
          cat > "$base/donor-revisions.json" <<'JSON'
          {
            "visual_effect_fabric": "67ea5f7af7c3eba14fda2c39e5289472bc7175c1",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          JSON
          cat > "$base/attempt-inputs.json" <<'JSON'
          {
            "source_families": ["fbm-value-noise-2d", "cellular-nearest-feature-2d"],
            "shared_mask": {"threshold":0.5,"softness":0.1,"invert":false},
            "shared_distance": {"isoLevel":0.5,"metric":"euclidean-normalized-domain","signConvention":"coverage-gte-iso-positive"},
            "shared_band": {"innerWidth":0.1,"outerWidth":0.15,"softness":0.03,"signMapping":"positive-inside-negative-outside"},
            "shared_weight": {"transform":"band-coverage-power-v0.1","exponent":1.3},
            "grid": {"width":48,"height":32,"cells":1536},
            "particle_source": {"count":49,"authority":"caller-owned retained point set"},
            "observer": "one derived weighted particle becomes one fixed-size planar two-triangle square at retained source position; neutral weight maps only to fixed grayscale albedo",
            "consumer_semantics_assigned": false
          }
          JSON

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build retained multi-family particle-weight and native-scene evidence
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { observeVisualEffectDistanceBandParticleWeightFamiliesNative } from './creative-render/src/vfx_distance_band_particle_weight_native_bridge.mjs';
          const base='creative-render/build/vfx-distance-band-particle-weight-native/';
          await mkdir(base,{recursive:true});
          const result=await observeVisualEffectDistanceBandParticleWeightFamiliesNative('visual-effect-fabric',{vfxRevision:'67ea5f7af7c3eba14fda2c39e5289472bc7175c1'});
          for(const name of ['fbm','cellular']){
            const row=result.variants[name];
            await Promise.all([
              writeFile(base+name+'-request.json',row.requestBytes),
              writeFile(base+name+'-source.json',row.sourceBytes),
              writeFile(base+name+'-mask-source.json',row.maskSourceBytes),
              writeFile(base+name+'-distance-source.json',row.distanceSourceBytes),
              writeFile(base+name+'-band-source.json',row.bandSourceBytes),
              writeFile(base+name+'-particles.json',row.particleBytes),
              writeFile(base+name+'-weight-source.json',row.weightSourceBytes),
              writeFile(base+name+'-band-grid.json',row.bandGridBytes),
              writeFile(base+name+'-weighted-set.json',row.weightSetBytes),
              writeFile(base+name+'.axmscene',row.adapted.bytes),
            ]);
          }
          await writeFile(base+'multi-family-distance-band-particle-weight.receipt.json',JSON.stringify(result.receipt,null,2)+'\n');
          console.log('vfx_distance_band_particle_weight_bridge=PASS');
          console.log(`fbm_weighted_set_hash=${result.variants.fbm.weightSet.weightedSetHash}`);
          console.log(`cellular_weighted_set_hash=${result.variants.cellular.weightSet.weightedSetHash}`);
          NODE

      - name: Independently assert authority, lineage, rebuildability and bounded work
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-distance-band-particle-weight-native/';
          const [receiptBytes,donorBytes,attemptBytes]=await Promise.all([
            readFile(base+'multi-family-distance-band-particle-weight.receipt.json'),
            readFile(base+'donor-revisions.json'),
            readFile(base+'attempt-inputs.json'),
          ]);
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const donors=JSON.parse(donorBytes.toString('utf8'));
          const attempt=JSON.parse(attemptBytes.toString('utf8'));
          if(donors.visual_effect_fabric!=='67ea5f7af7c3eba14fda2c39e5289472bc7175c1'||donors.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor evidence drifted');
          if(receipt.contract!=='AXM_CREATIVE_VFX_MULTI_FAMILY_DISTANCE_BAND_PARTICLE_WEIGHT_NATIVE_RECEIPT'||receipt.version!==1)throw new Error('particle-weight receipt contract drifted');
          if(receipt.donor.revision!==donors.visual_effect_fabric||receipt.donor.graphs.fbm.id!=='fx.particle.distance-band-weight2d'||receipt.donor.graphs.cellular.id!=='fx.particle.distance-band-weight2d-cellular')throw new Error('current VFX distance-band particle-weight graphs were not exercised');
          if(receipt.shared_contract.derived_schema!=='axm.distance-band-particle-weight-set/v0.1'||receipt.shared_contract.weight_transform!==attempt.shared_weight.transform||receipt.shared_contract.particle_count!==attempt.particle_source.count||receipt.shared_contract.source_family_branching!==false)throw new Error('shared particle-weight contract drifted');
          if(receipt.authority.canonical_scalar_sources_remain_authoritative!==true||receipt.authority.coverage_transfer_sources_remain_authoritative!==true||receipt.authority.mask_distance_sources_remain_authoritative!==true||receipt.authority.mask_distance_band_sources_remain_authoritative!==true||receipt.authority.caller_particle_source_remains_authoritative!==true||receipt.authority.particle_weight_sources_remain_authoritative!==true||receipt.authority.derived_band_grids_are_canonical!==false||receipt.authority.derived_particle_weight_sets_are_canonical!==false||receipt.authority.native_scenes_are_canonical!==false||receipt.authority.consumer_semantics_assigned!==false||receipt.authority.source_truth_rebuild_rejects_derived_band_tampering!==true)throw new Error('authority boundary failed');

          const retained={};
          for(const name of ['fbm','cellular']){
            const files=await Promise.all([
              readFile(base+name+'-request.json'),readFile(base+name+'-source.json'),readFile(base+name+'-mask-source.json'),readFile(base+name+'-distance-source.json'),readFile(base+name+'-band-source.json'),readFile(base+name+'-particles.json'),readFile(base+name+'-weight-source.json'),readFile(base+name+'-band-grid.json'),readFile(base+name+'-weighted-set.json'),readFile(base+name+'.axmscene')
            ]);
            const [requestBytes,sourceBytes,maskSourceBytes,distanceSourceBytes,bandSourceBytes,particleBytes,weightSourceBytes,bandGridBytes,weightSetBytes,sceneBytes]=files;
            const source=JSON.parse(sourceBytes); const maskSource=JSON.parse(maskSourceBytes); const distanceSource=JSON.parse(distanceSourceBytes); const bandSource=JSON.parse(bandSourceBytes); const particles=JSON.parse(particleBytes); const weightSource=JSON.parse(weightSourceBytes); const bandGrid=JSON.parse(bandGridBytes); const weightSet=JSON.parse(weightSetBytes);
            const row=receipt.variants[name];
            if(row.request_sha256!==sha(requestBytes)||row.source.bytes_sha256!==sha(sourceBytes)||row.mask_source.bytes_sha256!==sha(maskSourceBytes)||row.distance_source.bytes_sha256!==sha(distanceSourceBytes)||row.band_source.bytes_sha256!==sha(bandSourceBytes)||row.particle_source.bytes_sha256!==sha(particleBytes)||row.weight_source.bytes_sha256!==sha(weightSourceBytes)||row.band_grid.bytes_sha256!==sha(bandGridBytes)||row.weighted_set.bytes_sha256!==sha(weightSetBytes)||row.native_scene.bytes_sha256!==sha(sceneBytes))throw new Error(`retained byte binding drifted for ${name}`);
            if(particles.length!==attempt.particle_source.count||row.particle_source.count!==particles.length||row.particle_source.hash!==weightSource.particleSourceHash)throw new Error(`caller particle-source authority drifted for ${name}`);
            if(weightSource.schema!=='axm.distance-band-particle-weight-source/v0.1'||weightSource.distanceBandSourceHash!==row.band_source.hash||weightSource.weightTransform!==attempt.shared_weight.transform||weightSource.exponent!==attempt.shared_weight.exponent||weightSource.particleCount!==particles.length)throw new Error(`retained particle-weight source semantics drifted for ${name}`);
            if(bandSource.distanceSourceHash!==row.distance_source.hash||distanceSource.maskSourceHash!==row.mask_source.hash||maskSource.fieldSourceHash!==row.source.hash)throw new Error(`upstream retained lineage drifted for ${name}`);
            if(bandGrid.schema!=='axm.distance-band-grid/v0.1'||bandGrid.bandSourceHash!==row.band_source.hash||bandGrid.width!==attempt.grid.width||bandGrid.height!==attempt.grid.height||bandGrid.values.length!==attempt.grid.cells||bandGrid.derived!==true||bandGrid.rebuildable!==true)throw new Error(`distance-band grid lineage drifted for ${name}`);
            if(weightSet.schema!=='axm.distance-band-particle-weight-set/v0.1'||weightSet.weightSourceHash!==row.weight_source.hash||weightSet.particleSourceHash!==row.particle_source.hash||weightSet.distanceBandSourceHash!==row.band_source.hash||weightSet.bandGridHash!==row.band_grid.hash||weightSet.particleCount!==particles.length||weightSet.samples.length!==particles.length||weightSet.derived!==true||weightSet.rebuildable!==true)throw new Error(`derived particle-weight lineage drifted for ${name}`);
            if(weightSet.samples.some((sample,index)=>sample.particleId!==particles[index].id||sample.x!==particles[index].x||sample.y!==particles[index].y||!Number.isFinite(sample.weight)||sample.weight<0||sample.weight>1))throw new Error(`particle positions/weights drifted for ${name}`);
            if(row.lower_resolution_rebuild.width!==24||row.lower_resolution_rebuild.height!==16||row.lower_resolution_rebuild.sameWeightSourceHash!==true||row.lower_resolution_rebuild.sameParticleSourceHash!==true||row.lower_resolution_rebuild.bandGridHash===row.band_grid.hash)throw new Error(`resolution-rebuild boundary failed for ${name}`);
            if(!row.gates.insufficient_particle_budget_failed.includes('distanceBandParticle particle budget exceeded')||!row.gates.insufficient_band_cell_budget_failed.includes('distanceBandParticle band cell budget exceeded')||!row.gates.insufficient_comparison_budget_failed.includes('maskDistance comparison budget exceeded')||!row.gates.self_consistent_derived_band_tamper_failed.includes('distance-band particle grid differs from source-truth rebuild'))throw new Error(`failure gate drifted for ${name}`);
            if(row.native_scene.adapter.source_family_branching!==false||row.native_scene.adapter.consumer_semantics_assigned!==false||row.native_scene.adapter.opacity_size_emission_gameplay_semantics_assigned!==false||row.native_scene.adapter.canonical_source_rewritten!==false||row.native_scene.adapter.derived!==true||row.native_scene.adapter.replaceable!==true)throw new Error(`native observer boundary drifted for ${name}`);
            const scene=parseScene(sceneBytes.toString('utf8'));
            if(scene.triangles.length!==particles.length*2||row.native_scene.triangles!==particles.length*2)throw new Error(`native triangle count drifted for ${name}`);
            retained[name]={source,particles,weightSet,scene};
          }
          if(retained.fbm.source.schema===retained.cellular.source.schema)throw new Error('fixture no longer proves distinct retained scalar-source families');
          if(JSON.stringify(retained.fbm.particles)!==JSON.stringify(retained.cellular.particles))throw new Error('shared caller particle source changed across source families');
          if(JSON.stringify(retained.fbm.weightSet.samples.map(s=>s.weight))===JSON.stringify(retained.cellular.weightSet.samples.map(s=>s.weight)))throw new Error('distinct donor families collapsed to identical neutral particle weights');
          if(receipt.comparison.particle_source_hash_identical!==true||receipt.comparison.source_hashes_differ!==true||receipt.comparison.band_source_hashes_differ!==true||receipt.comparison.weighted_set_hashes_differ!==true||receipt.comparison.weight_samples_differ!==true||receipt.comparison.native_geometry_identical!==true||receipt.comparison.native_albedo_differs!==true||receipt.comparison.native_scene_bytes_differ!==true)throw new Error('multi-family particle-weight comparison drifted');
          const geometry=scene=>scene.triangles.map(t=>t.vertices); const albedo=scene=>scene.triangles.map(t=>t.albedo);
          if(JSON.stringify(geometry(retained.fbm.scene))!==JSON.stringify(geometry(retained.cellular.scene)))throw new Error('source family leaked into observation geometry');
          if(JSON.stringify(albedo(retained.fbm.scene))===JSON.stringify(albedo(retained.cellular.scene)))throw new Error('distinct weights collapsed to identical observation albedo');
          const evidence={contract:'AXM_CREATIVE_VFX_MULTI_FAMILY_DISTANCE_BAND_PARTICLE_WEIGHT_INDEPENDENT_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:donors,gates:{canonical_source_authority:'PASS',retained_caller_particles:'PASS',retained_weight_source:'PASS',caller_neutral_replay:'PASS',generic_particle_weight_contract:'PASS',resolution_rebuild_without_source_rewrite:'PASS',sufficient_budgets_noncreative:'PASS',insufficient_budgets_fail_loudly:'PASS',self_consistent_derived_band_tamper_rejected:'PASS',source_family_neutral_native_adapter:'PASS',consumer_semantics_not_assigned:'PASS'}};
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_distance_band_particle_weight_independent_evidence=PASS');
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify both weighted-particle observations
        run: |
          base=creative-render/build/vfx-distance-band-particle-weight-native
          for name in fbm cellular; do
            cat > "$base/$name.axmrender" <<EOF2
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF2
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind weighted-particle evidence to native pixels
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-distance-band-particle-weight-native/';
          const receiptBytes=await readFile(base+'multi-family-distance-band-particle-weight.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['fbm','cellular']){
            const [scene,request,renderReceipt,frame]=await Promise.all([readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
            if(receipt.variants[name].native_scene.bytes_sha256!==renders[name].scene_sha256)throw new Error(`scene identity changed before native rendering: ${name}`);
          }
          if(renders.fbm.frame_sha256===renders.cellular.frame_sha256)throw new Error('distinct neutral particle weights did not reach distinct native frame bytes');
          const evidence={contract:'AXM_CREATIVE_VFX_MULTI_FAMILY_DISTANCE_BAND_PARTICLE_WEIGHT_NATIVE_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:{visual_effect_fabric:'67ea5f7af7c3eba14fda2c39e5289472bc7175c1',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},weighted_set_hashes:{fbm:receipt.variants.fbm.weighted_set.hash,cellular:receipt.variants.cellular.weighted_set.hash},renders,render_receipt_replay:{fbm:'PASS',cellular:'PASS'},authority:receipt.authority,truth_boundary:receipt.truth_boundary};
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_distance_band_particle_weight_native_render=PASS');
          console.log(`fbm_frame_sha256=${renders.fbm.frame_sha256}`);
          console.log(`cellular_frame_sha256=${renders.cellular.frame_sha256}`);
          NODE

      - name: Upload retained proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-distance-band-particle-weight-native-proof
          path: creative-render/build/vfx-distance-band-particle-weight-native
          if-no-files-found: warn
          retention-days: 30
