name: vfx-parameter-curve-native

on:
  pull_request:
    paths:
      - 'src/vfx_parameter_curve_bridge.mjs'
      - 'src/vfx_parameter_curve_cli.mjs'
      - 'tests/vfx_parameter_curve_bridge.test.mjs'
      - '.github/workflows/vfx-parameter-curve-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_parameter_curve_bridge.mjs'
      - 'src/vfx_parameter_curve_cli.mjs'
      - 'tests/vfx_parameter_curve_bridge.test.mjs'
      - '.github/workflows/vfx-parameter-curve-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-parameter-curve-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: ae7cea116ee100f24e94696a77fb57d2639ae82c
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained proof directory
        run: |
          mkdir -p creative-render/build/vfx-parameter-curve-native
          cat > creative-render/build/vfx-parameter-curve-native/donor-revisions.json <<'EOF'
          {
            "visual_effect_fabric": "ae7cea116ee100f24e94696a77fb57d2639ae82c",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build canonical curve and fixed-geometry observation scenes
        run: |
          base=creative-render/build/vfx-parameter-curve-native
          node creative-render/src/vfx_parameter_curve_cli.mjs build \
            --vfx-root visual-effect-fabric \
            --vfx-revision ae7cea116ee100f24e94696a77fb57d2639ae82c \
            --source "$base/curve-source.json" \
            --samples-33 "$base/samples-33.json" \
            --samples-129 "$base/samples-129.json" \
            --state "$base/final-state.json" \
            --start-scene "$base/start.axmscene" \
            --mid-scene "$base/mid.axmscene" \
            --end-scene "$base/end.axmscene" \
            --receipt "$base/parameter-curve.receipt.json"

      - name: Independently assert source authority, density lineage and fixed geometry
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-parameter-curve-native/';
          const [receiptBytes,sourceBytes,s33Bytes,s129Bytes,donorBytes]=await Promise.all([
            readFile(base+'parameter-curve.receipt.json'),readFile(base+'curve-source.json'),readFile(base+'samples-33.json'),readFile(base+'samples-129.json'),readFile(base+'donor-revisions.json')
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const donors=JSON.parse(donorBytes.toString('utf8'));
          if(donors.visual_effect_fabric!=='ae7cea116ee100f24e94696a77fb57d2639ae82c'||donors.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor revision evidence drifted');
          if(r.contract!=='AXM_CREATIVE_VFX_PARAMETER_CURVE_NATIVE_RECEIPT'||r.version!==1)throw new Error('parameter-curve receipt contract drifted');
          if(r.donor.revision!==donors.visual_effect_fabric||r.donor.graph_id!=='fx.animation.parameter-curve1d'||r.donor.graph_version!=='0.1.0')throw new Error('current VFX parameter-curve graph was not exercised');
          if(JSON.stringify(r.donor.hand_ids)!==JSON.stringify(['fx.animation.parameter-curve-source-normalize','fx.animation.parameter-curve-samples-build']))throw new Error('VFX parameter-curve Hand boundary drifted');
          if(r.caller_authority.request_mutated!==false||r.caller_authority.caller_neutral_repeat_verification!=='PASS'||r.caller_authority.canonical_curve_source_remains_authoritative!==true||r.caller_authority.sample_density_is_canonical!==false)throw new Error('parameter-curve authority boundary failed');
          if(r.canonical_source.bytes_sha256!==sha(sourceBytes))throw new Error('canonical curve source byte binding drifted');
          if(r.derived_sample_tables.sample_33.bytes_sha256!==sha(s33Bytes)||r.derived_sample_tables.sample_129.bytes_sha256!==sha(s129Bytes))throw new Error('derived sample-table byte binding drifted');
          if(r.derived_sample_tables.sample_33.sample_count!==33||r.derived_sample_tables.sample_129.sample_count!==129)throw new Error('sample-density challenge drifted');
          if(r.derived_sample_tables.sample_33.sample_set_hash===r.derived_sample_tables.sample_129.sample_set_hash)throw new Error('derived sample-table identities did not change with density');
          if(r.derived_sample_tables.canonical_source_hash_preserved!==true)throw new Error('sample density rewrote canonical curve truth');
          if(r.observations.length!==3||new Set(r.observations.map(x=>x.value)).size!==3)throw new Error('bounded retained sample challenge drifted');
          const scenes=[];
          for(const obs of r.observations){
            const bytes=await readFile(base+obs.id+'.axmscene');
            if(obs.scene_sha256!==sha(bytes)||obs.scene_adapter.output_sha256!==sha(bytes))throw new Error(`scene byte binding drifted for ${obs.id}`);
            if(obs.scene_adapter.source_hash!==r.canonical_source.hash||obs.scene_adapter.geometry_is_fixed!==true||obs.scene_adapter.albedo_encodes_only_sample_value!==true||obs.scene_adapter.consumer_semantics_assigned!==false)throw new Error(`scene adapter boundary drifted for ${obs.id}`);
            scenes.push(parseScene(bytes.toString('utf8')));
          }
          const geometry=scenes.map(scene=>JSON.stringify(scene.triangles.map(t=>t.vertices)));
          if(new Set(geometry).size!==1)throw new Error('parameter-curve observations changed geometry');
          const albedos=scenes.map(scene=>JSON.stringify(scene.triangles.map(t=>t.albedo)));
          if(new Set(albedos).size!==3)throw new Error('retained scalar samples did not produce distinct observation albedos');
          const evidence={contract:'AXM_CREATIVE_VFX_PARAMETER_CURVE_INDEPENDENT_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:donors,curve_source_hash:r.canonical_source.hash,gates:{canonical_source_byte_binding:'PASS',sample_density_noncanonical:'PASS',caller_neutral_repeat:'PASS',fixed_geometry:'PASS',scalar_only_albedo_observation:'PASS',consumer_semantics_not_assigned:'PASS'}};
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_parameter_curve_independent_evidence=PASS');
          console.log(`curve_source_hash=${r.canonical_source.hash}`);
          console.log(`samples_33_hash=${r.derived_sample_tables.sample_33.sample_set_hash}`);
          console.log(`samples_129_hash=${r.derived_sample_tables.sample_129.sample_set_hash}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify retained curve samples
        run: |
          base=creative-render/build/vfx-parameter-curve-native
          for name in start mid end; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind retained scalar samples to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-parameter-curve-native/';
          const receiptBytes=await readFile(base+'parameter-curve.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['start','mid','end']){
            const [scene,request,renderReceipt,frame]=await Promise.all([
              readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')
            ]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
            const obs=receipt.observations.find(row=>row.id===name);
            if(!obs||obs.scene_sha256!==renders[name].scene_sha256)throw new Error(`scene identity changed before native rendering: ${name}`);
          }
          if(new Set(Object.values(renders).map(row=>row.frame_sha256)).size!==3)throw new Error('distinct retained curve samples did not reach three distinct native frame byte identities');
          const evidence={contract:'AXM_CREATIVE_VFX_PARAMETER_CURVE_NATIVE_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:{visual_effect_fabric:'ae7cea116ee100f24e94696a77fb57d2639ae82c',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},curve_source_hash:receipt.canonical_source.hash,observations:receipt.observations.map(row=>({id:row.id,t:row.t,value:row.value,scene_sha256:row.scene_sha256})),renders,render_receipt_replay:{start:'PASS',mid:'PASS',end:'PASS'},authority:receipt.authority,truth_boundary:receipt.truth_boundary};
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_parameter_curve_native_render=PASS');
          for(const [name,row] of Object.entries(renders))console.log(`${name}_frame_sha256=${row.frame_sha256}`);
          NODE

      - name: Upload retained VFX parameter-curve native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-parameter-curve-native-proof
          path: creative-render/build/vfx-parameter-curve-native/
          if-no-files-found: warn
