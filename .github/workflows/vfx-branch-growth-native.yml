name: vfx-branch-growth-native

on:
  pull_request:
    paths:
      - 'src/vfx_branch_growth_native_bridge.mjs'
      - 'src/vfx_branch_growth_native_cli.mjs'
      - 'tests/vfx_branch_growth_native_bridge.test.mjs'
      - '.github/workflows/vfx-branch-growth-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/vfx_branch_growth_native_bridge.mjs'
      - 'src/vfx_branch_growth_native_cli.mjs'
      - 'tests/vfx_branch_growth_native_bridge.test.mjs'
      - '.github/workflows/vfx-branch-growth-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-vfx-branch-growth-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Creative Render
        uses: actions/checkout@v4
        with:
          path: creative-render

      - name: Checkout pinned current Visual Effect Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-visual-effect-fabric
          ref: 6d5a6350cba7c2016bd2742cf0102d762efec009
          path: visual-effect-fabric

      - name: Checkout pinned Render Fabric
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-render-fabric
          ref: 6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b
          path: render-fabric

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare retained proof directory
        run: |
          mkdir -p creative-render/build/vfx-branch-growth-native
          cat > creative-render/build/vfx-branch-growth-native/donor-revisions.json <<'EOF'
          {
            "visual_effect_fabric": "6d5a6350cba7c2016bd2742cf0102d762efec009",
            "render_fabric": "6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b"
          }
          EOF

      - name: Run Creative Render tests
        run: npm --prefix creative-render test

      - name: Run current VFX Hand-lab tests
        run: npm --prefix visual-effect-fabric/hand-lab test

      - name: Build retained branching sources, networks, SVGs and native scenes
        run: |
          base=creative-render/build/vfx-branch-growth-native
          node creative-render/src/vfx_branch_growth_native_cli.mjs build \
            --vfx-root visual-effect-fabric \
            --vfx-revision 6d5a6350cba7c2016bd2742cf0102d762efec009 \
            --symmetric-source "$base/symmetric-source.json" \
            --asymmetric-source "$base/asymmetric-source.json" \
            --symmetric-network "$base/symmetric-network.json" \
            --asymmetric-network "$base/asymmetric-network.json" \
            --symmetric-svg "$base/symmetric.svg" \
            --asymmetric-svg "$base/asymmetric.svg" \
            --symmetric-state "$base/symmetric-state.json" \
            --asymmetric-state "$base/asymmetric-state.json" \
            --symmetric-scene "$base/symmetric.axmscene" \
            --asymmetric-scene "$base/asymmetric.axmscene" \
            --receipt "$base/branch-growth.receipt.json"

      - name: Independently assert source authority, budget honesty and replaceable realizations
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseScene } from './creative-render/src/creative_scene_operator.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-branch-growth-native/';
          const [receiptBytes, donorBytes] = await Promise.all([
            readFile(base+'branch-growth.receipt.json'), readFile(base+'donor-revisions.json')
          ]);
          const r=JSON.parse(receiptBytes.toString('utf8'));
          const donors=JSON.parse(donorBytes.toString('utf8'));
          if(donors.visual_effect_fabric!=='6d5a6350cba7c2016bd2742cf0102d762efec009'||donors.render_fabric!=='6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b')throw new Error('pinned donor revision evidence drifted');
          if(r.contract!=='AXM_CREATIVE_VFX_BRANCH_GROWTH_NATIVE_RECEIPT'||r.version!==1)throw new Error('branch-growth receipt contract drifted');
          if(r.donor.revision!==donors.visual_effect_fabric||r.donor.graph_id!=='fx.growth.branching2d-static-svg'||r.donor.graph_version!=='0.1.0')throw new Error('current VFX branch-growth graph was not exercised');
          if(JSON.stringify(r.donor.hand_ids)!==JSON.stringify(['fx.growth.branching2d-source-normalize','fx.growth.branching2d-network-build','fx.growth.branching2d-static-svg-realize']))throw new Error('VFX branch-growth Hand boundary drifted');
          if(r.caller_authority.explicit_choice!=='branchOffsetsTurns'||r.caller_authority.all_other_canonical_source_fields_held_constant!==true||r.caller_authority.caller_requests_mutated!==false||r.caller_authority.canonical_growth_sources_remain_authoritative!==true||r.caller_authority.derived_networks_are_canonical!==false||r.caller_authority.donor_svg_is_canonical!==false||r.caller_authority.native_scene_is_canonical!==false||r.caller_authority.consumer_semantics_assigned!==false)throw new Error('branch-growth authority boundary failed');

          const scenes={};
          const sources={};
          for(const name of ['symmetric','asymmetric']){
            const [sourceBytes,networkBytes,svgBytes,sceneBytes]=await Promise.all([
              readFile(base+name+'-source.json'), readFile(base+name+'-network.json'), readFile(base+name+'.svg'), readFile(base+name+'.axmscene')
            ]);
            const source=JSON.parse(sourceBytes.toString('utf8'));
            const network=JSON.parse(networkBytes.toString('utf8'));
            const row=r.variants[name];
            if(row.source.bytes_sha256!==sha(sourceBytes)||row.network.bytes_sha256!==sha(networkBytes)||row.donor_svg.bytes_sha256!==sha(svgBytes)||row.native_scene.bytes_sha256!==sha(sceneBytes))throw new Error(`retained byte binding drifted for ${name}`);
            if(network.sourceHash!==row.source.hash||network.networkHash!==row.network.hash||network.derived!==true||network.rebuildable!==true)throw new Error(`derived network lineage drifted for ${name}`);
            if(network.segmentCount!==31||network.clippedSegmentCount!==0||row.network.segment_count!==31)throw new Error(`bounded branch topology drifted for ${name}`);
            if(row.working_set_budget.exact_31_matches_default_2048!==true||row.working_set_budget.insufficient_30_failed_loudly!==true||!row.working_set_budget.insufficient_30_error.includes('segment budget exceeded'))throw new Error(`working-set budget truth gate failed for ${name}`);
            if(row.donor_svg.source_hash!==row.source.hash||row.donor_svg.network_hash!==row.network.hash||row.donor_svg.replaceable_realization!==true)throw new Error(`donor SVG lineage drifted for ${name}`);
            if(row.native_scene.adapter.source_hash!==row.source.hash||row.native_scene.adapter.network_hash!==row.network.hash||row.native_scene.adapter.geometry_encodes_only_derived_network_endpoints!==true||row.native_scene.adapter.style_is_fixed!==true||row.native_scene.adapter.consumer_semantics_assigned!==false)throw new Error(`native adapter truth boundary drifted for ${name}`);
            const scene=parseScene(sceneBytes.toString('utf8'));
            if(scene.triangles.length!==62)throw new Error(`native branch scene triangle count drifted for ${name}`);
            scenes[name]=scene;
            sources[name]=source;
          }
          const stripOffsets=source=>{const copy=structuredClone(source);delete copy.branchOffsetsTurns;return copy;};
          if(JSON.stringify(stripOffsets(sources.symmetric))!==JSON.stringify(stripOffsets(sources.asymmetric)))throw new Error('canonical source fields beyond explicit branch offsets changed');
          if(JSON.stringify(sources.symmetric.branchOffsetsTurns)===JSON.stringify(sources.asymmetric.branchOffsetsTurns))throw new Error('explicit branch-offset choice collapsed');
          const symAlbedo=JSON.stringify(scenes.symmetric.triangles.map(t=>t.albedo));
          const asymAlbedo=JSON.stringify(scenes.asymmetric.triangles.map(t=>t.albedo));
          if(symAlbedo!==asymAlbedo)throw new Error('fixed native realization style drifted between source choices');
          const symGeometry=JSON.stringify(scenes.symmetric.triangles.map(t=>t.vertices));
          const asymGeometry=JSON.stringify(scenes.asymmetric.triangles.map(t=>t.vertices));
          if(symGeometry===asymGeometry)throw new Error('distinct derived networks did not change native geometry');
          if(r.variants.symmetric.source.hash===r.variants.asymmetric.source.hash||r.variants.symmetric.network.hash===r.variants.asymmetric.network.hash||r.variants.symmetric.donor_svg.bytes_sha256===r.variants.asymmetric.donor_svg.bytes_sha256)throw new Error('explicit branch choice did not propagate across replaceable derived bodies');
          if(r.replaceability.same_derived_network_can_feed_donor_svg_and_native_scene_realizations!==true||r.replaceability.donor_svg_and_native_scene_do_not_rewrite_source_or_network_truth!==true)throw new Error('replaceability boundary drifted');
          const evidence={contract:'AXM_CREATIVE_VFX_BRANCH_GROWTH_INDEPENDENT_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:donors,gates:{caller_source_authority:'PASS',caller_neutral_repeat:'PASS',sufficient_budget_noncreative:'PASS',insufficient_budget_fails_loudly:'PASS',derived_network_lineage:'PASS',replaceable_svg_and_native_realizations:'PASS',fixed_native_style:'PASS',consumer_semantics_not_assigned:'PASS'}};
          await writeFile(base+'independent-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_branch_growth_independent_evidence=PASS');
          console.log(`symmetric_source_hash=${r.variants.symmetric.source.hash}`);
          console.log(`asymmetric_source_hash=${r.variants.asymmetric.source.hash}`);
          console.log(`symmetric_network_hash=${r.variants.symmetric.network.hash}`);
          console.log(`asymmetric_network_hash=${r.variants.asymmetric.network.hash}`);
          NODE

      - name: Build and test native Render Fabric
        run: |
          cmake -S render-fabric -B render-fabric/build
          cmake --build render-fabric/build --config Release
          ctest --test-dir render-fabric/build --output-on-failure

      - name: Render and independently verify both branch-growth observations
        run: |
          base=creative-render/build/vfx-branch-growth-native
          for name in symmetric asymmetric; do
            cat > "$base/$name.axmrender" <<EOF
          AXM_RENDER_REQUEST 1
          scene $name.axmscene
          backend axm.native.cpu.reference
          width 320
          height 180
          format ppm-rgb8
          output $name.ppm
          EOF
            render-fabric/build/axm-render --request "$base/$name.axmrender" --receipt "$base/$name.axmreceipt"
            render-fabric/build/axm-render-verify-receipt "$base/$name.axmrender" "$base/$name.axmreceipt"
          done

      - name: Bind derived branch networks to native pixel evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const base='creative-render/build/vfx-branch-growth-native/';
          const receiptBytes=await readFile(base+'branch-growth.receipt.json');
          const receipt=JSON.parse(receiptBytes.toString('utf8'));
          const renders={};
          for(const name of ['symmetric','asymmetric']){
            const [scene,request,renderReceipt,frame]=await Promise.all([
              readFile(base+name+'.axmscene'),readFile(base+name+'.axmrender'),readFile(base+name+'.axmreceipt'),readFile(base+name+'.ppm')
            ]);
            renders[name]={scene_sha256:sha(scene),request_sha256:sha(request),receipt_sha256:sha(renderReceipt),frame_sha256:sha(frame),frame_bytes:frame.length};
            if(receipt.variants[name].native_scene.bytes_sha256!==renders[name].scene_sha256)throw new Error(`scene identity changed before native rendering: ${name}`);
          }
          if(renders.symmetric.frame_sha256===renders.asymmetric.frame_sha256)throw new Error('distinct caller-authored branching choices did not reach distinct native frame bytes');
          const evidence={contract:'AXM_CREATIVE_VFX_BRANCH_GROWTH_NATIVE_EVIDENCE',version:1,creative_receipt_sha256:sha(receiptBytes),donor_revisions:{visual_effect_fabric:'6d5a6350cba7c2016bd2742cf0102d762efec009',render_fabric:'6fd39ffa5566ce2f6f9e6452c4ec1fdc9603313b'},source_hashes:{symmetric:receipt.variants.symmetric.source.hash,asymmetric:receipt.variants.asymmetric.source.hash},network_hashes:{symmetric:receipt.variants.symmetric.network.hash,asymmetric:receipt.variants.asymmetric.network.hash},renders,render_receipt_replay:{symmetric:'PASS',asymmetric:'PASS'},authority:receipt.authority,truth_boundary:receipt.truth_boundary};
          await writeFile(base+'native-render-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('vfx_branch_growth_native_render=PASS');
          console.log(`symmetric_frame_sha256=${renders.symmetric.frame_sha256}`);
          console.log(`asymmetric_frame_sha256=${renders.asymmetric.frame_sha256}`);
          NODE

      - name: Upload retained VFX branch-growth native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-creative-render-vfx-branch-growth-native-proof
          path: creative-render/build/vfx-branch-growth-native/
          if-no-files-found: warn
